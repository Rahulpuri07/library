<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Now Playing - My Library</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   TOP BAR
========================= */

.header {
    height: 72px;
    width: 100%;
    background: #050505;
    border-bottom: 1px solid #202020;

    display: flex;
    align-items: center;

    padding: 0 35px;
    gap: 25px;
}

.back-btn {
    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 6px;

    padding: 10px 18px;

    font-size: 15px;
    cursor: pointer;

    transition: 0.2s;
}

.back-btn:hover {
    background: #181818;
}

.logo {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.logo span {
    color: #e50914;
}

/* =========================
   PLAYER AREA
========================= */

.player-page {
    width: 100%;
    min-height: calc(100vh - 72px);

    background: #000;

    display: flex;
    flex-direction: column;
}

/* =========================
   VIDEO WRAPPER
========================= */

.video-section {
    width: 100%;

    /*
       Keeps the complete video visible
       and prevents cropping.
    */
    height: calc(100vh - 145px);

    min-height: 400px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    background: #000;

    overflow: hidden;
}

/* =========================
   VIDEO
========================= */

.video-container {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #000;
}

video {
    width: 100%;
    height: 100%;

    /*
       IMPORTANT:
       contain = complete video stays visible
       without cropping.
    */
    object-fit: contain;

    background: #000;

    display: block;
}

/* =========================
   CUSTOM CONTROLS
========================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 0 20px 12px 20px;

    background: linear-gradient(
        transparent,
        rgba(0,0,0,0.85)
    );

    z-index: 10;

    transition: opacity 0.3s;
}

/* =========================
   TIMELINE AREA
========================= */

.timeline-area {
    width: 100%;
    position: relative;

    padding-top: 72px;
}

/* =========================
   PREVIEW
========================= */

.preview-box {
    position: absolute;

    /*
       PREVIEW IS NOW DIRECTLY
       ABOVE THE TIMELINE.
    */

    bottom: 18px;

    left: 0;

    width: 180px;
    height: 102px;

    background: #111;

    border: 2px solid #333;
    border-radius: 4px;

    overflow: hidden;

    display: none;

    pointer-events: none;

    z-index: 50;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.8);
}

.preview-box canvas {
    width: 100%;
    height: 100%;

    display: block;
}

.preview-time {
    position: absolute;

    bottom: 3px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;
    font-weight: bold;

    text-shadow: 0 1px 3px #000;
}

/* =========================
   TIMELINE
========================= */

.timeline {
    position: relative;

    width: 100%;
    height: 5px;

    background: #666;

    border-radius: 10px;

    cursor: pointer;
}

.timeline-buffer {
    position: absolute;

    top: 0;
    left: 0;

    height: 100%;

    width: 0%;

    background: #999;

    border-radius: 10px;

    pointer-events: none;
}

.timeline-progress {
    position: absolute;

    top: 0;
    left: 0;

    height: 100%;

    width: 0%;

    background: #e50914;

    border-radius: 10px;

    pointer-events: none;
}

.timeline-thumb {
    position: absolute;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    background: #e50914;

    top: 50%;
    transform: translate(-50%, -50%);

    left: 0%;

    pointer-events: none;
}

/* =========================
   CONTROL BUTTON ROW
========================= */

.control-row {
    height: 50px;

    display: flex;
    align-items: center;

    gap: 18px;
}

.control-btn {
    background: none;
    border: none;

    color: white;

    font-size: 20px;

    cursor: pointer;

    width: 30px;
    height: 35px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 0;
}

.control-btn:hover {
    color: #e50914;
}

/* =========================
   TIME
========================= */

.time {
    font-size: 13px;

    white-space: nowrap;

    color: #ddd;
}

/* =========================
   VOLUME
========================= */

.volume-container {
    display: flex;
    align-items: center;

    gap: 8px;
}

.volume-slider {
    width: 80px;
}

/* =========================
   SPACER
========================= */

.control-spacer {
    flex: 1;
}

/* =========================
   SPEED MENU
========================= */

.speed-wrapper,
.quality-wrapper {
    position: relative;
}

.menu {
    position: absolute;

    bottom: 45px;
    right: 0;

    background: #181818;

    border: 1px solid #333;

    border-radius: 6px;

    min-width: 130px;

    padding: 6px 0;

    display: none;

    z-index: 100;
}

.menu button {
    display: block;

    width: 100%;

    background: none;
    border: none;

    color: white;

    text-align: left;

    padding: 9px 14px;

    cursor: pointer;

    font-size: 13px;
}

.menu button:hover {
    background: #333;
}

/* =========================
   TITLE
========================= */

.movie-title {
    padding: 18px 35px 25px;

    font-size: 26px;
    font-weight: 700;

    background: #000;
}

/* =========================
   FULLSCREEN
========================= */

.video-container:fullscreen {
    width: 100vw;
    height: 100vh;

    background: #000;
}

.video-container:fullscreen video {
    width: 100%;
    height: 100%;

    object-fit: contain;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        height: 60px;
        padding: 0 15px;
    }

    .logo {
        font-size: 17px;
    }

    .back-btn {
        padding: 8px 12px;
    }

    .video-section {
        height: calc(100vh - 115px);
        min-height: 300px;
    }

    .controls {
        padding-left: 10px;
        padding-right: 10px;
    }

    .volume-slider {
        display: none;
    }

    .quality-btn {
        display: none;
    }

    .movie-title {
        padding: 12px 15px;
        font-size: 20px;
    }

    .preview-box {
        width: 140px;
        height: 79px;
    }
}

</style>
</head>


<body>

<div class="player-page">

    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <button class="back-btn" onclick="goBack()">
            ← Back
        </button>

        <div class="logo">
            MY <span>LIBRARY</span>
        </div>

    </div>


    <!-- =========================
         VIDEO SECTION
    ========================== -->

    <div class="video-section">

        <div class="video-container" id="videoContainer">

            <video
                id="video"
                preload="metadata"
                playsinline
            >
                Your browser does not support video.
            </video>


            <!-- =========================
                 CONTROLS
            ========================== -->

            <div class="controls" id="controls">

                <!-- TIMELINE -->

                <div class="timeline-area">

                    <div
                        class="preview-box"
                        id="previewBox"
                    >

                        <canvas
                            id="previewCanvas"
                            width="180"
                            height="102"
                        ></canvas>

                        <div
                            class="preview-time"
                            id="previewTime"
                        >
                            00:00
                        </div>

                    </div>


                    <div
                        class="timeline"
                        id="timeline"
                    >

                        <div
                            class="timeline-buffer"
                            id="buffer"
                        ></div>

                        <div
                            class="timeline-progress"
                            id="progress"
                        ></div>

                        <div
                            class="timeline-thumb"
                            id="thumb"
                        ></div>

                    </div>

                </div>


                <!-- CONTROL ROW -->

                <div class="control-row">

                    <!-- REWIND -->

                    <button
                        class="control-btn"
                        id="rewindBtn"
                        title="Rewind 10 seconds"
                    >
                        ↶
                    </button>


                    <!-- PLAY -->

                    <button
                        class="control-btn"
                        id="playBtn"
                        title="Play / Pause"
                    >
                        ▶
                    </button>


                    <!-- FORWARD -->

                    <button
                        class="control-btn"
                        id="forwardBtn"
                        title="Forward 10 seconds"
                    >
                        ↷
                    </button>


                    <!-- VOLUME -->

                    <div class="volume-container">

                        <button
                            class="control-btn"
                            id="muteBtn"
                            title="Mute"
                        >
                            🔊
                        </button>

                        <input
                            class="volume-slider"
                            id="volumeSlider"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1"
                        >

                    </div>


                    <!-- TIME -->

                    <div class="time">

                        <span id="currentTime">
                            00:00
                        </span>

                        /

                        <span id="duration">
                            00:00
                        </span>

                    </div>


                    <div class="control-spacer"></div>


                    <!-- SPEED -->

                    <div class="speed-wrapper">

                        <button
                            class="control-btn"
                            id="speedBtn"
                            title="Playback speed"
                        >
                            ⚡
                        </button>

                        <div
                            class="menu"
                            id="speedMenu"
                        >

                            <button data-speed="0.5">
                                0.5×
                            </button>

                            <button data-speed="0.75">
                                0.75×
                            </button>

                            <button data-speed="1">
                                Normal
                            </button>

                            <button data-speed="1.25">
                                1.25×
                            </button>

                            <button data-speed="1.5">
                                1.5×
                            </button>

                            <button data-speed="2">
                                2×
                            </button>

                        </div>

                    </div>


                    <!-- QUALITY -->

                    <div class="quality-wrapper">

                        <button
                            class="control-btn quality-btn"
                            id="qualityBtn"
                            title="Quality"
                        >
                            ⚙
                        </button>

                        <div
                            class="menu"
                            id="qualityMenu"
                        >

                            <button data-quality="auto">
                                Auto
                            </button>

                            <button data-quality="1080">
                                1080p
                            </button>

                            <button data-quality="720">
                                720p
                            </button>

                            <button data-quality="480">
                                480p
                            </button>

                        </div>

                    </div>


                    <!-- FULLSCREEN -->

                    <button
                        class="control-btn"
                        id="fullscreenBtn"
                        title="Fullscreen"
                    >
                        ⛶
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         MOVIE TITLE
    ========================== -->

    <div
        class="movie-title"
        id="movieTitle"
    >
        Now Playing
    </div>

</div>


<script>

/* ==========================================
   GET VIDEO INFORMATION FROM URL
========================================== */

const params = new URLSearchParams(
    window.location.search
);

const videoURL =
    params.get("video") ||
    params.get("src") ||
    "sample.mp4";

const title =
    params.get("title") ||
    "Sample Video";


/* ==========================================
   ELEMENTS
========================================== */

const video =
    document.getElementById("video");

const videoContainer =
    document.getElementById("videoContainer");

const playBtn =
    document.getElementById("playBtn");

const rewindBtn =
    document.getElementById("rewindBtn");

const forwardBtn =
    document.getElementById("forwardBtn");

const muteBtn =
    document.getElementById("muteBtn");

const volumeSlider =
    document.getElementById("volumeSlider");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const timeline =
    document.getElementById("timeline");

const progress =
    document.getElementById("progress");

const buffer =
    document.getElementById("buffer");

const thumb =
    document.getElementById("thumb");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const movieTitle =
    document.getElementById("movieTitle");

const previewBox =
    document.getElementById("previewBox");

const previewCanvas =
    document.getElementById("previewCanvas");

const previewTime =
    document.getElementById("previewTime");

const speedBtn =
    document.getElementById("speedBtn");

const speedMenu =
    document.getElementById("speedMenu");

const qualityBtn =
    document.getElementById("qualityBtn");

const qualityMenu =
    document.getElementById("qualityMenu");


/* ==========================================
   LOAD VIDEO
========================================== */

video.src = videoURL;

movieTitle.textContent = title;

document.title =
    title + " - My Library";


/* ==========================================
   FORMAT TIME
========================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "00:00";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);

    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* ==========================================
   PLAY / PAUSE
========================================== */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }
}

playBtn.addEventListener(
    "click",
    togglePlay
);

video.addEventListener(
    "play",
    () => {

        playBtn.textContent = "❚❚";

    }
);

video.addEventListener(
    "pause",
    () => {

        playBtn.textContent = "▶";

    }
);


/* ==========================================
   REWIND
========================================== */

rewindBtn.addEventListener(
    "click",
    () => {

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );

    }
);


/* ==========================================
   FORWARD
========================================== */

forwardBtn.addEventListener(
    "click",
    () => {

        video.currentTime =
            Math.min(
                video.duration,
                video.currentTime + 10
            );

    }
);


/* ==========================================
   UPDATE TIMELINE
========================================== */

video.addEventListener(
    "timeupdate",
    () => {

        if (!video.duration) {
            return;
        }

        const percentage =
            (video.currentTime /
            video.duration) * 100;

        progress.style.width =
            percentage + "%";

        thumb.style.left =
            percentage + "%";

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

    }
);


/* ==========================================
   DURATION
========================================== */

video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);


/* ==========================================
   CLICK TIMELINE
========================================== */

timeline.addEventListener(
    "click",
    (event) => {

        const rect =
            timeline.getBoundingClientRect();

        const percentage =
            (event.clientX - rect.left) /
            rect.width;

        video.currentTime =
            percentage * video.duration;

    }
);


/* ==========================================
   BUFFER
========================================== */

video.addEventListener(
    "progress",
    () => {

        if (!video.duration) {
            return;
        }

        if (video.buffered.length) {

            const bufferedEnd =
                video.buffered.end(
                    video.buffered.length - 1
                );

            const percentage =
                (bufferedEnd /
                video.duration) * 100;

            buffer.style.width =
                Math.min(
                    percentage,
                    100
                ) + "%";

        }

    }
);


/* ==========================================
   VOLUME
========================================== */

volumeSlider.addEventListener(
    "input",
    () => {

        video.volume =
            volumeSlider.value;

        if (video.volume === 0) {

            muteBtn.textContent = "🔇";

        } else {

            muteBtn.textContent = "🔊";

        }

    }
);


/* ==========================================
   MUTE
========================================== */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        muteBtn.textContent =
            video.muted
            ? "🔇"
            : "🔊";

    }
);


/* ==========================================
   FULLSCREEN
========================================== */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoContainer.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ==========================================
   SPEED MENU
========================================== */

speedBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        speedMenu.style.display =
            speedMenu.style.display === "block"
            ? "none"
            : "block";

        qualityMenu.style.display =
            "none";

    }
);


document
.querySelectorAll(
    "#speedMenu button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            video.playbackRate =
                parseFloat(
                    button.dataset.speed
                );

            speedMenu.style.display =
                "none";

        }
    );

});


/* ==========================================
   QUALITY MENU
========================================== */

qualityBtn.addEventListener(
    "click",
    (event) => {

        event.stopPropagation();

        qualityMenu.style.display =
            qualityMenu.style.display === "block"
            ? "none"
            : "block";

        speedMenu.style.display =
            "none";

    }
);


/*
   The quality buttons are ready.

   Actual quality switching will be added
   when we store multiple versions of a movie,
   for example:

   movie-1080.mp4
   movie-720.mp4
   movie-480.mp4
*/

document
.querySelectorAll(
    "#qualityMenu button"
)
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            qualityMenu.style.display =
                "none";

            alert(
                "Quality switching will be connected when multiple video qualities are added."
            );

        }
    );

});


/* ==========================================
   CLOSE MENUS
========================================== */

document.addEventListener(
    "click",
    () => {

        speedMenu.style.display =
            "none";

        qualityMenu.style.display =
            "none";

    }
);


/* ==========================================
   TIMELINE PREVIEW
========================================== */

let previewVideo = null;


/*
   Create a separate hidden video.

   This lets us seek to different positions
   without disturbing the actual movie.
*/

function createPreviewVideo() {

    previewVideo =
        document.createElement("video");

    previewVideo.src =
        videoURL;

    previewVideo.preload =
        "metadata";

    previewVideo.muted =
        true;

    previewVideo.playsInline =
        true;

    previewVideo.style.display =
        "none";

    document.body.appendChild(
        previewVideo
    );

}

createPreviewVideo();


/* ==========================================
   DRAW PREVIEW FRAME
========================================== */

previewVideo.addEventListener(
    "loadeddata",
    () => {

        previewVideo.currentTime = 0;

    }
);


previewVideo.addEventListener(
    "seeked",
    () => {

        const ctx =
            previewCanvas.getContext(
                "2d"
            );

        ctx.clearRect(
            0,
            0,
            previewCanvas.width,
            previewCanvas.height
        );

        ctx.drawImage(
            previewVideo,
            0,
            0,
            previewCanvas.width,
            previewCanvas.height
        );

    }
);


/* ==========================================
   MOVE PREVIEW ABOVE TIMELINE
========================================== */

timeline.addEventListener(
    "mousemove",
    (event) => {

        if (!video.duration) {
            return;
        }

        const rect =
            timeline.getBoundingClientRect();

        let percentage =
            (event.clientX - rect.left) /
            rect.width;

        percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    percentage
                )
            );

        const previewSeconds =
            percentage *
            video.duration;

        /*
           Preview position is calculated
           relative to the timeline.
        */

        const previewWidth =
            previewBox.offsetWidth;

        let previewLeft =
            event.clientX -
            rect.left -
            (previewWidth / 2);

        previewLeft =
            Math.max(
                0,
                Math.min(
                    rect.width - previewWidth,
                    previewLeft
                )
            );

        previewBox.style.left =
            previewLeft + "px";

        /*
           IMPORTANT:
           The preview is ABOVE the
           timeline, not in the middle
           of the video.
        */

        previewBox.style.bottom =
            "18px";

        previewBox.style.display =
            "block";

        previewTime.textContent =
            formatTime(
                previewSeconds
            );

        if (
            previewVideo.readyState >= 2
        ) {

            previewVideo.currentTime =
                previewSeconds;

        }

    }
);


timeline.addEventListener(
    "mouseleave",
    () => {

        previewBox.style.display =
            "none";

    }
);


/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener(
    "keydown",
    (event) => {

        /*
           Don't activate shortcuts
           while typing.
        */

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        /* SPACE */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        /* LEFT */

        if (
            event.key ===
            "ArrowLeft"
        ) {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }


        /* RIGHT */

        if (
            event.key ===
            "ArrowRight"
        ) {

            video.currentTime =
                Math.min(
                    video.duration,
                    video.currentTime + 5
                );

        }


        /* F */

        if (
            event.key.toLowerCase()
            === "f"
        ) {

            fullscreenBtn.click();

        }

    }
);


/* ==========================================
   BACK BUTTON
========================================== */

function goBack() {

    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}

</script>

</body>
</html>
