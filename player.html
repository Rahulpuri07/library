<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Now Playing - My Library</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }

        .top-bar {
            height: 70px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            border-bottom: 1px solid #151515;
            background: #000;
        }

        .back-button {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 9px 16px;
            border: 1px solid #333;
            border-radius: 5px;
            transition: 0.2s;
        }

        .back-button:hover {
            background: #fff;
            color: #000;
        }

        .player-logo {
            margin-left: 25px;
            font-size: 20px;
            font-weight: 700;
        }

        .player-logo span {
            color: #e50914;
        }

        .player-container {
            width: 100%;
            max-width: 1400px;
            margin: 35px auto 0;
            padding: 0 30px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        video {
            display: block;
            width: 100%;
            max-height: 75vh;
            background: #000;
        }

        /* CUSTOM CONTROLS */

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;

            padding: 45px 20px 15px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.95)
                );

            opacity: 1;
            transition: opacity 0.3s;
        }

        .video-wrapper.hide-controls .controls {
            opacity: 0;
        }

        /* TIMELINE */

        .timeline-container {
            position: relative;
            width: 100%;
            height: 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .timeline {
            width: 100%;
            height: 5px;
            appearance: none;
            background: #555;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        .timeline::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            background: #e50914;
            border-radius: 50%;
            cursor: pointer;
        }

        .timeline::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #e50914;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        /* PREVIEW */

        .preview-box {
            position: absolute;

            bottom: 28px;

            width: 180px;
            height: 100px;

            background: #111;

            border: 2px solid #333;

            border-radius: 5px;

            overflow: hidden;

            display: none;

            pointer-events: none;

            transform: translateX(-50%);

            box-shadow: 0 5px 25px rgba(0,0,0,0.8);
        }

        .preview-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-time {
            position: absolute;
            bottom: 2px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            background: rgba(0,0,0,0.75);
            padding: 2px;
        }

        /* BUTTON ROW */

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .control-button {
            width: 42px;
            height: 38px;

            border: none;
            background: transparent;

            color: white;

            font-size: 20px;

            cursor: pointer;

            border-radius: 4px;

            transition: 0.2s;
        }

        .control-button:hover {
            background: rgba(255,255,255,0.15);
        }

        .time-display {
            font-size: 13px;
            color: #ddd;
            margin-left: 4px;
            margin-right: auto;
            white-space: nowrap;
        }

        /* VOLUME */

        .volume-container {
            display: flex;
            align-items: center;
        }

        .volume-slider {
            width: 80px;
            height: 4px;
            accent-color: #fff;
            cursor: pointer;
        }

        /* MENUS */

        .menu-container {
            position: relative;
        }

        .menu {
            position: absolute;

            right: 0;

            bottom: 48px;

            background: #181818;

            border: 1px solid #333;

            border-radius: 6px;

            min-width: 150px;

            padding: 6px;

            display: none;

            box-shadow: 0 8px 30px rgba(0,0,0,0.7);

            z-index: 20;
        }

        .menu.show {
            display: block;
        }

        .menu-title {
            font-size: 11px;
            color: #888;
            padding: 8px 10px;
            text-transform: uppercase;
        }

        .menu button {
            display: block;

            width: 100%;

            border: none;

            background: transparent;

            color: #fff;

            text-align: left;

            padding: 9px 10px;

            font-family: inherit;

            font-size: 13px;

            cursor: pointer;

            border-radius: 4px;
        }

        .menu button:hover {
            background: #333;
        }

        .menu button.active {
            color: #e50914;
        }

        .movie-information {
            padding: 25px 5px 50px;
        }

        .movie-information h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .movie-information p {
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .top-bar {
                height: 60px;
                padding: 0 15px;
            }

            .player-logo {
                margin-left: 15px;
                font-size: 17px;
            }

            .player-container {
                margin-top: 15px;
                padding: 0 8px;
            }

            .controls {
                padding-left: 10px;
                padding-right: 10px;
            }

            .volume-slider {
                display: none;
            }

            .control-button {
                width: 36px;
            }

            .time-display {
                font-size: 11px;
            }

            .preview-box {
                width: 140px;
                height: 78px;
            }

            .movie-information h1 {
                font-size: 21px;
            }
        }

    </style>

</head>


<body>


    <div class="top-bar">

        <a
            href="index.html"
            class="back-button"
        >
            ← Back
        </a>

        <div class="player-logo">
            MY <span>LIBRARY</span>
        </div>

    </div>



    <div class="player-container">


        <div
            class="video-wrapper"
            id="videoWrapper"
        >


            <video
                id="videoPlayer"
                playsinline
                preload="metadata"
            >

                <source
                    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                    type="video/mp4"
                >

                Your browser does not support HTML5 video.

            </video>



            <!-- PREVIEW VIDEO -->

            <div
                class="preview-box"
                id="previewBox"
            >

                <video
                    id="previewVideo"
                    muted
                    preload="metadata"
                >

                    <source
                        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                        type="video/mp4"
                    >

                </video>

                <div
                    class="preview-time"
                    id="previewTime"
                >
                    0:00
                </div>

            </div>



            <!-- CUSTOM CONTROLS -->

            <div class="controls">


                <div
                    class="timeline-container"
                    id="timelineContainer"
                >

                    <input
                        type="range"
                        class="timeline"
                        id="timeline"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                    >

                </div>



                <div class="control-row">


                    <!-- BACK 10 -->

                    <button
                        class="control-button"
                        id="backButton"
                        title="Back 10 seconds"
                    >
                        ↶
                    </button>



                    <!-- PLAY -->

                    <button
                        class="control-button"
                        id="playButton"
                        title="Play / Pause"
                    >
                        ▶
                    </button>



                    <!-- FORWARD 10 -->

                    <button
                        class="control-button"
                        id="forwardButton"
                        title="Forward 10 seconds"
                    >
                        ↷
                    </button>



                    <!-- VOLUME -->

                    <div class="volume-container">

                        <button
                            class="control-button"
                            id="muteButton"
                            title="Mute"
                        >
                            🔊
                        </button>

                        <input
                            type="range"
                            class="volume-slider"
                            id="volumeSlider"
                            min="0"
                            max="1"
                            value="1"
                            step="0.05"
                        >

                    </div>



                    <!-- TIME -->

                    <div
                        class="time-display"
                        id="timeDisplay"
                    >
                        0:00 / 0:00
                    </div>



                    <!-- SPEED -->

                    <div class="menu-container">

                        <button
                            class="control-button"
                            id="speedButton"
                            title="Playback speed"
                        >
                            ⚡
                        </button>


                        <div
                            class="menu"
                            id="speedMenu"
                        >

                            <div class="menu-title">
                                Speed
                            </div>

                            <button data-speed="0.5">
                                0.5×
                            </button>

                            <button data-speed="0.75">
                                0.75×
                            </button>

                            <button
                                data-speed="1"
                                class="active"
                            >
                                Normal
                            </button>

                            <button data-speed="1.25">
                                1.25×
                            </button>

                            <button data-speed="1.5">
                                1.5×
                            </button>

                            <button data-speed="2">
                                2×
                            </button>

                        </div>

                    </div>



                    <!-- QUALITY -->

                    <div class="menu-container">

                        <button
                            class="control-button"
                            id="qualityButton"
                            title="Video quality"
                        >
                            ⚙
                        </button>


                        <div
                            class="menu"
                            id="qualityMenu"
                        >

                            <div class="menu-title">
                                Quality
                            </div>

                            <button class="active">
                                Auto
                            </button>

                            <button>
                                1080p
                            </button>

                            <button>
                                720p
                            </button>

                            <button>
                                480p
                            </button>

                        </div>

                    </div>



                    <!-- FULLSCREEN -->

                    <button
                        class="control-button"
                        id="fullscreenButton"
                        title="Fullscreen"
                    >
                        ⛶
                    </button>


                </div>

            </div>

        </div>



        <div class="movie-information">

            <h1>
                Sample Video
            </h1>

            <p>
                Test movie • My Personal Library
            </p>

        </div>


    </div>



    <script>

        const video = document.getElementById("videoPlayer");

        const previewVideo = document.getElementById("previewVideo");

        const wrapper = document.getElementById("videoWrapper");

        const playButton = document.getElementById("playButton");

        const backButton = document.getElementById("backButton");

        const forwardButton = document.getElementById("forwardButton");

        const muteButton = document.getElementById("muteButton");

        const volumeSlider = document.getElementById("volumeSlider");

        const timeline = document.getElementById("timeline");

        const timelineContainer =
            document.getElementById("timelineContainer");

        const timeDisplay =
            document.getElementById("timeDisplay");

        const previewBox =
            document.getElementById("previewBox");

        const previewTime =
            document.getElementById("previewTime");

        const speedButton =
            document.getElementById("speedButton");

        const speedMenu =
            document.getElementById("speedMenu");

        const qualityButton =
            document.getElementById("qualityButton");

        const qualityMenu =
            document.getElementById("qualityMenu");

        const fullscreenButton =
            document.getElementById("fullscreenButton");



        /* ==============================
           TIME FORMAT
        ============================== */

        function formatTime(seconds) {

            if (!isFinite(seconds)) {
                return "0:00";
            }

            const hours =
                Math.floor(seconds / 3600);

            const minutes =
                Math.floor((seconds % 3600) / 60);

            const secs =
                Math.floor(seconds % 60);

            if (hours > 0) {

                return (
                    hours +
                    ":" +
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(secs).padStart(2, "0")
                );

            }

            return (
                minutes +
                ":" +
                String(secs).padStart(2, "0")
            );

        }



        /* ==============================
           PLAY / PAUSE
        ============================== */

        function togglePlay() {

            if (video.paused) {

                video.play();

            } else {

                video.pause();

            }

        }


        playButton.addEventListener(
            "click",
            togglePlay
        );


        video.addEventListener(
            "click",
            togglePlay
        );


        video.addEventListener(
            "play",
            function() {

                playButton.textContent = "❚❚";

            }
        );


        video.addEventListener(
            "pause",
            function() {

                playButton.textContent = "▶";

            }
        );



        /* ==============================
           BACK 10 SECONDS
        ============================== */

        backButton.addEventListener(
            "click",
            function() {

                video.currentTime =
                    Math.max(
                        0,
                        video.currentTime - 10
                    );

            }
        );



        /* ==============================
           FORWARD 10 SECONDS
        ============================== */

        forwardButton.addEventListener(
            "click",
            function() {

                video.currentTime =
                    Math.min(
                        video.duration,
                        video.currentTime + 10
                    );

            }
        );



        /* ==============================
           TIMELINE
        ============================== */

        video.addEventListener(
            "timeupdate",
            function() {

                if (!video.duration) {
                    return;
                }

                timeline.value =
                    (video.currentTime /
                    video.duration) * 100;

                timeDisplay.textContent =
                    formatTime(video.currentTime) +
                    " / " +
                    formatTime(video.duration);

            }
        );


        timeline.addEventListener(
            "input",
            function() {

                if (!video.duration) {
                    return;
                }

                video.currentTime =
                    (timeline.value / 100) *
                    video.duration;

            }
        );



        /* ==============================
           TIMELINE PREVIEW
        ============================== */

        timelineContainer.addEventListener(
            "mousemove",
            function(event) {

                if (!video.duration) {
                    return;
                }

                const rect =
                    timelineContainer.getBoundingClientRect();

                let position =
                    event.clientX - rect.left;

                position =
                    Math.max(
                        0,
                        Math.min(
                            position,
                            rect.width
                        )
                    );

                const percentage =
                    position / rect.width;

                const previewSecond =
                    percentage * video.duration;


                previewBox.style.display =
                    "block";


                previewBox.style.left =
                    position + "px";


                previewTime.textContent =
                    formatTime(previewSecond);


                if (
                    previewVideo.readyState >= 1
                ) {

                    previewVideo.currentTime =
                        previewSecond;

                }

            }
        );


        timelineContainer.addEventListener(
            "mouseleave",
            function() {

                previewBox.style.display =
                    "none";

            }
        );


        previewVideo.addEventListener(
            "loadedmetadata",
            function() {

                previewVideo.currentTime = 0;

            }
        );



        /* ==============================
           VOLUME
        ============================== */

        volumeSlider.addEventListener(
            "input",
            function() {

                video.volume =
                    volumeSlider.value;

                video.muted =
                    video.volume === 0;

                updateVolumeIcon();

            }
        );


        muteButton.addEventListener(
            "click",
            function() {

                video.muted =
                    !video.muted;

                updateVolumeIcon();

            }
        );


        function updateVolumeIcon() {

            if (
                video.muted ||
                video.volume === 0
            ) {

                muteButton.textContent = "🔇";

            } else if (
                video.volume < 0.5
            ) {

                muteButton.textContent = "🔉";

            } else {

                muteButton.textContent = "🔊";

            }

        }



        /* ==============================
           SPEED MENU
        ============================== */

        speedButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                qualityMenu.classList.remove("show");

                speedMenu.classList.toggle("show");

            }
        );


        document
            .querySelectorAll(
                "#speedMenu button"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const speed =
                                parseFloat(
                                    button.dataset.speed
                                );

                            video.playbackRate =
                                speed;


                            document
                                .querySelectorAll(
                                    "#speedMenu button"
                                )
                                .forEach(
                                    function(item) {

                                        item.classList.remove(
                                            "active"
                                        );

                                    }
                                );


                            button.classList.add(
                                "active"
                            );


                            speedMenu.classList.remove(
                                "show"
                            );

                        }
                    );

                }
            );



        /* ==============================
           QUALITY MENU
        ============================== */

        qualityButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                speedMenu.classList.remove("show");

                qualityMenu.classList.toggle("show");

            }
        );



        /* ==============================
           CLOSE MENUS
        ============================== */

        document.addEventListener(
            "click",
            function() {

                speedMenu.classList.remove(
                    "show"
                );

                qualityMenu.classList.remove(
                    "show"
                );

            }
        );



        /* ==============================
           FULLSCREEN
        ============================== */

        fullscreenButton.addEventListener(
            "click",
            function() {

                if (!document.fullscreenElement) {

                    if (
                        wrapper.requestFullscreen
                    ) {

                        wrapper.requestFullscreen();

                    }

                } else {

                    document.exitFullscreen();

                }

            }
        );



        /* ==============================
           KEYBOARD SHORTCUTS
        ============================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.target.tagName ===
                    "INPUT"
                ) {
                    return;
                }


                if (event.code === "Space") {

                    event.preventDefault();

                    togglePlay();

                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    video.currentTime =
                        Math.max(
                            0,
                            video.currentTime - 10
                        );

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    video.currentTime =
                        Math.min(
                            video.duration,
                            video.currentTime + 10
                        );

                }


                if (
                    event.key.toLowerCase() ===
                    "f"
                ) {

                    fullscreenButton.click();

                }

            }
        );



        /* ==============================
           AUTO HIDE CONTROLS
        ============================== */

        let hideTimer;


        function resetControls() {

            wrapper.classList.remove(
                "hide-controls"
            );


            clearTimeout(hideTimer);


            if (!video.paused) {

                hideTimer =
                    setTimeout(
                        function() {

                            wrapper.classList.add(
                                "hide-controls"
                            );

                        },
                        3000
                    );

            }

        }


        wrapper.addEventListener(
            "mousemove",
            resetControls
        );


        wrapper.addEventListener(
            "touchstart",
            resetControls
        );


        video.addEventListener(
            "play",
            resetControls
        );


        video.addEventListener(
            "pause",
            function() {

                wrapper.classList.remove(
                    "hide-controls"
                );

            }
        );


    </script>

</body>

</html>
