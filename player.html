<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Now Playing</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

/* =========================
   HEADER
========================= */

.header {
    height: 72px;
    width: 100%;
    background: #050505;
    border-bottom: 1px solid #222;

    display: flex;
    align-items: center;

    padding: 0 35px;
    gap: 25px;

    position: relative;
    z-index: 20;
}

.back-button {
    background: #050505;
    color: white;

    border: 1px solid #333;
    border-radius: 6px;

    padding: 10px 17px;

    font-size: 15px;
    cursor: pointer;

    flex-shrink: 0;
}

.back-button:hover {
    background: #222;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.5px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.logo .current-label {
    color: #fff;
}

.logo .movie-name {
    color: #e50914;
}

/* =========================
   PLAYER
========================= */

.player-area {
    position: relative;

    width: 100%;
    height: calc(100vh - 72px);

    background: #000;
    overflow: hidden;
}

.video-wrapper {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    background: #000;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: block;
}

video.fit-contain {
    object-fit: contain;
}

video.fit-cover {
    object-fit: cover;
}

video.fit-fill {
    object-fit: fill;
}

/* =========================
   CONTROLS
========================= */

.controls {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 115px;

    padding: 0 20px 12px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,0.98),
            rgba(0,0,0,0.75),
            rgba(0,0,0,0)
        );

    z-index: 10;
}

/* =========================
   TIMELINE
========================= */

.timeline-area {
    position: relative;

    width: 100%;
    height: 50px;

    display: flex;
    align-items: flex-end;

    padding-bottom: 8px;
}

#timeline {
    width: 100%;
    height: 5px;

    appearance: none;
    -webkit-appearance: none;

    background: #666;

    border-radius: 10px;

    cursor: pointer;

    margin: 0;
}

#timeline::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;

    width: 14px;
    height: 14px;

    background: #e50914;

    border-radius: 50%;

    cursor: pointer;
}

#timeline::-moz-range-thumb {
    width: 14px;
    height: 14px;

    background: #e50914;

    border: none;

    border-radius: 50%;

    cursor: pointer;
}

/* =========================
   TIMELINE PREVIEW
========================= */

.preview-box {
    position: absolute;

    bottom: 42px;
    left: 0;

    width: 180px;
    height: 100px;

    background: #111;

    border: 1px solid #444;
    border-radius: 5px;

    overflow: hidden;

    display: none;

    pointer-events: none;

    transform: translateX(-50%);

    box-shadow: 0 5px 20px rgba(0,0,0,0.8);

    z-index: 50;
}

.preview-box video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}

.preview-time {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    text-align: center;

    background: rgba(0,0,0,0.8);

    font-size: 12px;

    padding: 3px;
}

/* =========================
   CONTROL ROW
========================= */

.control-row {
    width: 100%;
    height: 48px;

    display: flex;
    align-items: center;

    gap: 10px;
}

.control-button {
    border: none;

    background: transparent;

    color: white;

    font-size: 18px;

    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    border-radius: 5px;

    flex-shrink: 0;
}

.control-button:hover {
    background: rgba(255,255,255,0.15);
}

.skip-button {
    font-size: 13px;
    font-weight: bold;
}

.time-display {
    font-size: 13px;

    color: #ddd;

    white-space: nowrap;

    min-width: 90px;
}

/* =========================
   VOLUME
========================= */

.volume-container {
    display: flex;

    align-items: center;

    gap: 5px;
}

#volume {
    width: 80px;
    cursor: pointer;
}

/* =========================
   SPACER
========================= */

.spacer {
    flex: 1;
}

/* =========================
   SPEED
========================= */

.speed-container {
    position: relative;
}

.speed-menu {
    position: absolute;

    bottom: 42px;
    right: 0;

    width: 120px;

    background: #181818;

    border: 1px solid #333;
    border-radius: 5px;

    display: none;

    overflow: hidden;

    box-shadow: 0 5px 20px rgba(0,0,0,0.8);

    z-index: 100;
}

.speed-menu button {
    width: 100%;

    background: transparent;

    color: white;

    border: none;

    padding: 9px;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.speed-menu button:hover {
    background: #333;
}

/* =========================
   FIT MENU
========================= */

.fit-container {
    position: relative;
}

.fit-menu {
    position: absolute;

    bottom: 42px;
    right: 0;

    width: 130px;

    background: #181818;

    border: 1px solid #333;
    border-radius: 5px;

    display: none;

    overflow: hidden;

    box-shadow: 0 5px 20px rgba(0,0,0,0.8);

    z-index: 100;
}

.fit-menu button {
    width: 100%;

    background: transparent;

    color: white;

    border: none;

    padding: 9px;

    text-align: left;

    cursor: pointer;

    font-size: 14px;
}

.fit-menu button:hover {
    background: #333;
}

/* =========================
   ERROR
========================= */

.error-message {
    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    text-align: center;

    color: #aaa;

    font-size: 18px;

    z-index: 5;

    display: none;
}

/* =========================
   FULLSCREEN
========================= */

.player-area:fullscreen {
    width: 100vw;
    height: 100vh;
}

.player-area:fullscreen .video-wrapper {
    width: 100vw;
    height: 100vh;
}

.player-area:fullscreen .controls {
    bottom: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        height: 60px;
        padding: 0 15px;
        gap: 12px;
    }

    .logo {
        font-size: 17px;
    }

    .player-area {
        height: calc(100vh - 60px);
    }

    .volume-container {
        display: none;
    }

    .controls {
        height: 105px;
        padding-left: 10px;
        padding-right: 10px;
    }

    .control-row {
        gap: 4px;
    }

    .time-display {
        font-size: 11px;
        min-width: 75px;
    }

    .preview-box {
        width: 140px;
        height: 78px;

        bottom: 40px;
    }

    .speed-container,
    .fit-container {
        margin-left: 0;
    }

}

/* =========================
   VERY SMALL SCREENS
========================= */

@media (max-width: 430px) {

    .back-button {
        padding: 8px 12px;
        font-size: 13px;
    }

    .logo {
        font-size: 15px;
    }

    .control-button {
        width: 30px;
        height: 30px;
    }

    .time-display {
        min-width: 65px;
        font-size: 10px;
    }

}

</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<div class="header">

    <button
        class="back-button"
        onclick="goBack()"
    >
        ← Back
    </button>

    <div class="logo">

        <span class="current-label">
            CURRENTLY PLAYING —
        </span>

        <span
            class="movie-name"
            id="movieTitle"
        >
            Now Playing
        </span>

    </div>

</div>


<!-- =========================
     PLAYER
========================= -->

<div
    class="player-area"
    id="playerArea"
>

    <div class="video-wrapper">

        <video
            id="video"
            preload="metadata"
            playsinline
        ></video>

    </div>


    <div
        class="error-message"
        id="errorMessage"
    >
        No video was supplied.<br>
        Please open a movie from your library.
    </div>


    <!-- =========================
         CONTROLS
    ========================= -->

    <div class="controls">

        <!-- TIMELINE -->

        <div class="timeline-area">

            <div
                class="preview-box"
                id="previewBox"
            >

                <video
                    id="previewVideo"
                    muted
                    preload="metadata"
                ></video>

                <div
                    class="preview-time"
                    id="previewTime"
                >
                    00:00
                </div>

            </div>

            <input
                type="range"
                id="timeline"
                min="0"
                max="100"
                value="0"
                step="0.01"
            >

        </div>


        <!-- BUTTON ROW -->

        <div class="control-row">

            <!-- BACK 10 -->

            <button
                class="control-button skip-button"
                id="back10"
                title="Back 10 seconds"
            >
                ↶10
            </button>


            <!-- PLAY -->

            <button
                class="control-button"
                id="playButton"
                title="Play / Pause"
            >
                ▶
            </button>


            <!-- FORWARD 10 -->

            <button
                class="control-button skip-button"
                id="forward10"
                title="Forward 10 seconds"
            >
                10↷
            </button>


            <!-- VOLUME -->

            <div class="volume-container">

                <button
                    class="control-button"
                    id="muteButton"
                    title="Mute"
                >
                    🔊
                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

            </div>


            <!-- TIME -->

            <div
                class="time-display"
                id="timeDisplay"
            >
                00:00 / 00:00
            </div>


            <div class="spacer"></div>


            <!-- SPEED -->

            <div class="speed-container">

                <button
                    class="control-button"
                    id="speedButton"
                    title="Playback speed"
                >
                    1×
                </button>

                <div
                    class="speed-menu"
                    id="speedMenu"
                >

                    <button data-speed="0.5">
                        0.5×
                    </button>

                    <button data-speed="0.75">
                        0.75×
                    </button>

                    <button data-speed="1">
                        Normal
                    </button>

                    <button data-speed="1.25">
                        1.25×
                    </button>

                    <button data-speed="1.5">
                        1.5×
                    </button>

                    <button data-speed="1.75">
                        1.75×
                    </button>

                    <button data-speed="2">
                        2×
                    </button>

                </div>

            </div>


            <!-- FIT -->

            <div class="fit-container">

                <button
                    class="control-button"
                    id="fitButton"
                    title="Adjust video display"
                >
                    ◈
                </button>

                <div
                    class="fit-menu"
                    id="fitMenu"
                >

                    <button data-fit="contain">
                        Fit
                    </button>

                    <button data-fit="cover">
                        Fill
                    </button>

                    <button data-fit="fill">
                        Stretch
                    </button>

                </div>

            </div>


            <!-- FULLSCREEN -->

            <button
                class="control-button"
                id="fullscreenButton"
                title="Fullscreen"
            >
                ⛶
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const previewVideo =
    document.getElementById("previewVideo");

const timeline =
    document.getElementById("timeline");

const previewBox =
    document.getElementById("previewBox");

const previewTime =
    document.getElementById("previewTime");

const playButton =
    document.getElementById("playButton");

const back10 =
    document.getElementById("back10");

const forward10 =
    document.getElementById("forward10");

const volume =
    document.getElementById("volume");

const muteButton =
    document.getElementById("muteButton");

const timeDisplay =
    document.getElementById("timeDisplay");

const speedButton =
    document.getElementById("speedButton");

const speedMenu =
    document.getElementById("speedMenu");

const fitButton =
    document.getElementById("fitButton");

const fitMenu =
    document.getElementById("fitMenu");

const fullscreenButton =
    document.getElementById("fullscreenButton");

const playerArea =
    document.getElementById("playerArea");

const errorMessage =
    document.getElementById("errorMessage");

const movieTitleElement =
    document.getElementById("movieTitle");


/* =========================
   GET INFORMATION FROM URL
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const videoSource =
    params.get("video") ||
    params.get("src");

const movieTitle =
    params.get("title") ||
    "Now Playing";


/* =========================
   SHOW CURRENT MOVIE NAME
========================= */

movieTitleElement.textContent =
    movieTitle;

document.title =
    movieTitle + " - My Library";


/* =========================
   LOAD VIDEO
========================= */

if (videoSource) {

    video.src = videoSource;

    previewVideo.src =
        videoSource;

} else {

    errorMessage.style.display =
        "block";

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

}

playButton.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚";

    }
);


video.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

    }
);


/* =========================
   SPACEBAR
========================= */

document.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Space" &&
            e.target.tagName !== "INPUT"
        ) {

            e.preventDefault();

            togglePlay();

        }

    }
);


/* =========================
   SKIP
========================= */

back10.addEventListener(
    "click",
    function() {

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );

    }
);


forward10.addEventListener(
    "click",
    function() {

        video.currentTime =
            Math.min(
                video.duration || 0,
                video.currentTime + 10
            );

    }
);


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds) {

    if (
        !seconds ||
        isNaN(seconds)
    ) {

        return "00:00";

    }

    seconds =
        Math.floor(seconds);

    const hours =
        Math.floor(
            seconds / 3600
        );

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;


    if (hours > 0) {

        return (
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }


    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
    );

}


/* =========================
   UPDATE TIMELINE
========================= */

video.addEventListener(
    "timeupdate",
    function() {

        if (!video.duration)
            return;

        timeline.value =
            (
                video.currentTime /
                video.duration
            ) * 100;

        timeDisplay.textContent =
            formatTime(
                video.currentTime
            ) +
            " / " +
            formatTime(
                video.duration
            );

    }
);


/* =========================
   VIDEO LOADED
========================= */

video.addEventListener(
    "loadedmetadata",
    function() {

        timeDisplay.textContent =
            "00:00 / " +
            formatTime(
                video.duration
            );

    }
);


/* =========================
   SEEK
========================= */

timeline.addEventListener(
    "input",
    function() {

        if (!video.duration)
            return;

        const percentage =
            timeline.value / 100;

        video.currentTime =
            percentage *
            video.duration;

    }
);


/* =========================
   TIMELINE PREVIEW
========================= */

function showPreview(e) {

    if (!video.duration)
        return;

    const rect =
        timeline.getBoundingClientRect();

    let percent =
        (
            e.clientX -
            rect.left
        ) / rect.width;

    percent =
        Math.max(
            0,
            Math.min(
                1,
                percent
            )
        );

    const previewTimeValue =
        percent *
        video.duration;


    previewBox.style.display =
        "block";


    previewBox.style.left =
        (
            percent * 100
        ) + "%";


    previewTime.textContent =
        formatTime(
            previewTimeValue
        );


    if (
        Math.abs(
            previewVideo.currentTime -
            previewTimeValue
        ) > 0.5
    ) {

        try {

            previewVideo.currentTime =
                previewTimeValue;

        } catch(e) {}

    }

}


timeline.addEventListener(
    "mousemove",
    showPreview
);


timeline.addEventListener(
    "mouseleave",
    function() {

        previewBox.style.display =
            "none";

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    function() {

        video.volume =
            volume.value;

        video.muted = false;

        updateMuteIcon();

    }
);


muteButton.addEventListener(
    "click",
    function() {

        video.muted =
            !video.muted;

        updateMuteIcon();

    }
);


function updateMuteIcon() {

    if (
        video.muted ||
        video.volume === 0
    ) {

        muteButton.textContent =
            "🔇";

    } else {

        muteButton.textContent =
            "🔊";

    }

}


/* =========================
   SPEED MENU
========================= */

speedButton.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        fitMenu.style.display =
            "none";

        speedMenu.style.display =
            speedMenu.style.display ===
            "block"
                ? "none"
                : "block";

    }
);


document.querySelectorAll(
    "#speedMenu button"
).forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const speed =
                    parseFloat(
                        button.dataset.speed
                    );

                video.playbackRate =
                    speed;

                speedButton.textContent =
                    speed + "×";

                speedMenu.style.display =
                    "none";

            }
        );

    }
);


/* =========================
   FIT MENU
========================= */

fitButton.addEventListener(
    "click",
    function(e) {

        e.stopPropagation();

        speedMenu.style.display =
            "none";

        fitMenu.style.display =
            fitMenu.style.display ===
            "block"
                ? "none"
                : "block";

    }
);


document.querySelectorAll(
    "#fitMenu button"
).forEach(
    function(button) {

        button.addEventListener(
            "click",
            function() {

                const fit =
                    button.dataset.fit;

                video.classList.remove(
                    "fit-contain",
                    "fit-cover",
                    "fit-fill"
                );

                video.classList.add(
                    "fit-" + fit
                );

                fitMenu.style.display =
                    "none";

            }
        );

    }
);


/* =========================
   CLOSE MENUS
========================= */

document.addEventListener(
    "click",
    function() {

        speedMenu.style.display =
            "none";

        fitMenu.style.display =
            "none";

    }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenButton.addEventListener(
    "click",
    function() {

        if (
            !document.fullscreenElement
        ) {

            if (
                playerArea.requestFullscreen
            ) {

                playerArea.requestFullscreen();

            }

        } else {

            document.exitFullscreen();

        }

    }
);


/* =========================
   DOUBLE CLICK FULLSCREEN
========================= */

video.addEventListener(
    "dblclick",
    function() {

        if (
            !document.fullscreenElement
        ) {

            playerArea.requestFullscreen();

        } else {

            document.exitFullscreen();

        }

    }
);


/* =========================
   GO BACK
========================= */

function goBack() {

    if (document.referrer) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}


/* =========================
   VIDEO ERROR
========================= */

video.addEventListener(
    "error",
    function() {

        if (videoSource) {

            errorMessage.innerHTML =
                "Unable to play this video.<br>" +
                "Check the video file or its URL.";

            errorMessage.style.display =
                "block";

        }

    }
);

</script>

</body>
</html>
