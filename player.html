<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Now Playing - My Library</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =========================
   PLAYER PAGE
========================= */

.player-page {

    width: 100%;
    height: 100vh;

    background: #000;

    display: flex;
    flex-direction: column;
}


/* =========================
   HEADER
========================= */

.header {

    height: 72px;
    width: 100%;

    background: #050505;

    border-bottom: 1px solid #202020;

    display: flex;

    align-items: center;

    padding: 0 35px;

    gap: 25px;

    position: relative;

    z-index: 10;
}


.back-btn {

    background: #080808;

    color: white;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 10px 18px;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}


.back-btn:hover {

    background: #181818;

}


.logo {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: -0.5px;
}


.logo span {

    color: #e50914;
}


/* =========================
   PLAYER AREA
========================= */

.player-area {

    width: 100%;

    flex: 1;

    min-height: 0;

    background: #000;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


.drive-player {

    width: 100%;
    height: 100%;

    border: none;

    display: block;

    background: #000;
}


/* =========================
   BOTTOM INFORMATION
========================= */

.bottom-area {

    width: 100%;

    background: #000;

    border-top: 1px solid #111;

    padding: 14px 35px;

    min-height: 72px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 25px;
}


/* =========================
   TITLE
========================= */

.movie-title {

    font-size: 20px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

    flex: 1;

    min-width: 0;
}


/* =========================
   SERIES CONTROLS
========================= */

.series-controls {

    display: none;

    align-items: center;

    gap: 10px;

    flex-shrink: 0;
}


.series-control {

    background: #111;

    color: #fff;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 9px 12px;

    font-size: 14px;

    outline: none;

    cursor: pointer;
}


.series-control:hover {

    background: #1c1c1c;
}


.series-control option {

    background: #111;

    color: #fff;
}


/* =========================
   LOADING
========================= */

.loading {

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    color: #777;

    font-size: 15px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {

        height: 60px;

        padding: 0 15px;
    }


    .logo {

        font-size: 17px;
    }


    .back-btn {

        padding: 8px 12px;
    }


    .bottom-area {

        padding: 10px 15px;

        min-height: 65px;

        gap: 10px;

        align-items: center;
    }


    .movie-title {

        font-size: 15px;
    }


    .series-controls {

        gap: 5px;
    }


    .series-control {

        padding: 8px 7px;

        font-size: 12px;

        max-width: 105px;
    }

}

</style>

</head>


<body>


<div class="player-page">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>


        <div class="logo">

            MY <span>LIBRARY</span>

        </div>

    </div>



    <!-- =========================
         PLAYER
    ========================== -->

    <div class="player-area">

        <iframe
            id="drivePlayer"
            class="drive-player"
            allow="autoplay; fullscreen"
            allowfullscreen
            frameborder="0"
        ></iframe>


        <div
            id="loadingMessage"
            class="loading"
        >
            Loading...
        </div>

    </div>



    <!-- =========================
         BOTTOM AREA
    ========================== -->

    <div class="bottom-area">


        <div
            class="movie-title"
            id="movieTitle"
        >
            Now Playing
        </div>



        <!-- =========================
             SERIES SELECTORS
        ========================== -->

        <div
            class="series-controls"
            id="seriesControls"
        >


            <select
                id="seasonSelect"
                class="series-control"
            ></select>


            <select
                id="episodeSelect"
                class="series-control"
            ></select>


        </div>

    </div>


</div>



<script>


/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */


/*
   USE THE SAME API KEY THAT YOU USE
   IN YOUR index.html
*/

const GOOGLE_API_KEY =
    "i'll paste my api key here";



/*
   YOUR WEB SERIES FOLDER
*/

const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";



/* ==================================================
   URL PARAMETERS
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const type =
    params.get("type") || "";


const seriesName =
    params.get("series") || "";


const videoURL =
    params.get("video") ||
    params.get("src") ||
    "";


const normalTitle =
    params.get("title") ||
    "Now Playing";



/* ==================================================
   ELEMENTS
================================================== */

const drivePlayer =
    document.getElementById(
        "drivePlayer"
    );


const movieTitle =
    document.getElementById(
        "movieTitle"
    );


const loadingMessage =
    document.getElementById(
        "loadingMessage"
    );


const seriesControls =
    document.getElementById(
        "seriesControls"
    );


const seasonSelect =
    document.getElementById(
        "seasonSelect"
    );


const episodeSelect =
    document.getElementById(
        "episodeSelect"
    );



/* ==================================================
   SERIES DATA
================================================== */

let seriesEpisodes = [];

let selectedSeason = 1;



/* ==================================================
   CLEAN NAME
================================================== */

function cleanName(name) {

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /_/g,
            " "
        )

        .replace(
            /\./g,
            " "
        )

        .trim();

}



/* ==================================================
   NORMALIZE NAME
================================================== */

function normalizeName(name) {

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* ==================================================
   GET DRIVE FILES
================================================== */

async function getDriveFiles(
    folderId
) {

    const query =
        `'${folderId}' in parents and trashed = false`;


    const url =
        "https://www.googleapis.com/drive/v3/files"
        +
        "?q="
        +
        encodeURIComponent(query)
        +
        "&fields="
        +
        encodeURIComponent(
            "files(id,name,mimeType,size,modifiedTime)"
        )
        +
        "&pageSize=1000"
        +
        "&orderBy=name"
        +
        "&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Google Drive API error: "
            +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];

}



/* ==================================================
   CREATE DRIVE PLAYER URL
================================================== */

function getDrivePlayerURL(
    file
) {

    return (
        "https://drive.google.com/file/d/"
        +
        file.id
        +
        "/preview"
    );

}



/* ==================================================
   PARSE EPISODE INFORMATION
================================================== */

function parseEpisode(
    file
) {

    const originalName =
        cleanName(
            file.name
        );


    /*
       Expected examples:

       Bhay S01EP01
       Bhay S01EP02
       Bhay S01EP05 Chintu Badmash

       Also works with:

       Bhay - S01E05 - Chintu Badmash
    */


    const match =
        originalName.match(
            /S(\d{1,2})\s*E(?:P)?(\d{1,3})/i
        )
        ||
        originalName.match(
            /S(\d{1,2})\s*EP(\d{1,3})/i
        );


    if (!match) {

        return null;

    }


    const season =
        parseInt(
            match[1],
            10
        );


    const episode =
        parseInt(
            match[2],
            10
        );


    /*
       Everything after S01EP01
       becomes the episode name.
    */

    let episodeName =
        originalName
            .substring(
                match.index +
                match[0].length
            )
            .replace(
                /^[-_\s]+/,
                ""
            )
            .trim();


    /*
       Remove the series name if it
       somehow appears after the episode code.
    */

    if (
        episodeName.toLowerCase()
            === seriesName.toLowerCase()
    ) {

        episodeName = "";

    }


    return {

        file: file,

        season: season,

        episode: episode,

        episodeName:
            episodeName ||
            "Episode " + episode

    };

}



/* ==================================================
   LOAD SERIES
================================================== */

async function loadSeries() {

    try {

        loadingMessage.textContent =
            "Loading series...";


        const files =
            await getDriveFiles(
                SERIES_FOLDER
            );


        /*
           Find only files belonging
           to the selected series.
        */

        const wantedSeries =
            normalizeName(
                seriesName
            );


        seriesEpisodes =
            files

                .filter(
                    function(file) {

                        if (
                            file.mimeType ===
                            "application/vnd.google-apps.folder"
                        ) {

                            return false;

                        }


                        const parsed =
                            parseEpisode(
                                file
                            );


                        if (!parsed) {

                            return false;

                        }


                        const filename =
                            normalizeName(
                                file.name
                            );


                        /*
                           Check that the filename
                           starts with the series name.
                        */

                        return (
                            filename.startsWith(
                                wantedSeries
                            )
                        );

                    }
                )

                .map(
                    function(file) {

                        return parseEpisode(
                            file
                        );

                    }
                )

                .filter(
                    function(item) {

                        return item !== null;

                    }
                )

                .sort(
                    function(a, b) {

                        if (
                            a.season !==
                            b.season
                        ) {

                            return (
                                a.season -
                                b.season
                            );

                        }


                        return (
                            a.episode -
                            b.episode
                        );

                    }
                );


        if (
            seriesEpisodes.length === 0
        ) {

            throw new Error(
                "No episodes found for " +
                seriesName
            );

        }


        /*
           Show series controls.
        */

        seriesControls.style.display =
            "flex";


        buildSeasonSelector();


        /*
           Load first episode.
        */

        selectedSeason =
            seriesEpisodes[0].season;


        seasonSelect.value =
            String(
                selectedSeason
            );


        buildEpisodeSelector();


        const firstEpisode =
            seriesEpisodes.find(
                function(item) {

                    return (
                        item.season ===
                        selectedSeason
                    );

                }
            );


        if (firstEpisode) {

            episodeSelect.value =
                String(
                    firstEpisode.episode
                );


            playEpisode(
                firstEpisode
            );

        }


        loadingMessage.style.display =
            "none";


    } catch (error) {

        console.error(
            error
        );


        loadingMessage.style.display =
            "none";


        movieTitle.textContent =
            "Unable to load series";

    }

}



/* ==================================================
   BUILD SEASON SELECTOR
================================================== */

function buildSeasonSelector() {

    seasonSelect.innerHTML =
        "";


    const seasons = [];


    seriesEpisodes.forEach(
        function(item) {

            if (
                !seasons.includes(
                    item.season
                )
            ) {

                seasons.push(
                    item.season
                );

            }

        }
    );


    seasons.sort(
        function(a, b) {

            return a - b;

        }
    );


    seasons.forEach(
        function(season) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                String(
                    season
                );


            option.textContent =
                "Season " +
                season;


            seasonSelect.appendChild(
                option
            );

        }
    );

}



/* ==================================================
   BUILD EPISODE SELECTOR
================================================== */

function buildEpisodeSelector() {

    episodeSelect.innerHTML =
        "";


    const episodes =
        seriesEpisodes.filter(
            function(item) {

                return (
                    item.season ===
                    selectedSeason
                );

            }
        );


    episodes.forEach(
        function(item) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                String(
                    item.episode
                );


            option.textContent =
                "Episode " +
                item.episode
                +
                " — "
                +
                item.episodeName;


            episodeSelect.appendChild(
                option
            );

        }
    );

}



/* ==================================================
   PLAY EPISODE
================================================== */

function playEpisode(
    episodeData
) {

    if (!episodeData) {

        return;

    }


    drivePlayer.src =
        getDrivePlayerURL(
            episodeData.file
        );


    /*
       This creates:

       Chintu Badmash
       - Season 1
       - Episode 5
    */

    movieTitle.textContent =
        episodeData.episodeName
        +
        " - Season "
        +
        episodeData.season
        +
        " - Episode "
        +
        episodeData.episode;


    document.title =
        episodeData.episodeName
        +
        " - "
        +
        seriesName
        +
        " - My Library";

}



/* ==================================================
   SEASON CHANGED
================================================== */

seasonSelect.addEventListener(
    "change",
    function() {

        selectedSeason =
            parseInt(
                seasonSelect.value,
                10
            );


        buildEpisodeSelector();


        const firstEpisode =
            seriesEpisodes.find(
                function(item) {

                    return (
                        item.season ===
                        selectedSeason
                    );

                }
            );


        if (firstEpisode) {

            episodeSelect.value =
                String(
                    firstEpisode.episode
                );


            playEpisode(
                firstEpisode
            );

        }

    }
);



/* ==================================================
   EPISODE CHANGED
================================================== */

episodeSelect.addEventListener(
    "change",
    function() {

        const episodeNumber =
            parseInt(
                episodeSelect.value,
                10
            );


        const selectedEpisode =
            seriesEpisodes.find(
                function(item) {

                    return (
                        item.season ===
                        selectedSeason
                        &&
                        item.episode ===
                        episodeNumber
                    );

                }
            );


        if (selectedEpisode) {

            playEpisode(
                selectedEpisode
            );

        }

    }
);



/* ==================================================
   MOVIE PLAYER
================================================== */

function loadMovie() {

    movieTitle.textContent =
        normalTitle;


    document.title =
        normalTitle +
        " - My Library";


    if (!videoURL) {

        loadingMessage.style.display =
            "none";

        movieTitle.textContent =
            "Unable to load video";

        return;

    }


    let playerURL =
        videoURL;


    /*
       Convert Drive API URL
       into Drive preview URL.
    */

    if (
        videoURL.includes(
            "googleapis.com/drive/v3/files/"
        )
    ) {

        const match =
            videoURL.match(
                /drive\/v3\/files\/([^/?]+)/
            );


        if (
            match &&
            match[1]
        ) {

            playerURL =
                "https://drive.google.com/file/d/"
                +
                match[1]
                +
                "/preview";

        }

    }


    /*
       Convert normal Drive URL.
    */

    if (
        videoURL.includes(
            "drive.google.com/file/d/"
        )
    ) {

        const match =
            videoURL.match(
                /drive\.google\.com\/file\/d\/([^/]+)/
            );


        if (
            match &&
            match[1]
        ) {

            playerURL =
                "https://drive.google.com/file/d/"
                +
                match[1]
                +
                "/preview";

        }

    }


    drivePlayer.src =
        playerURL;


    loadingMessage.style.display =
        "none";

}



/* ==================================================
   BACK BUTTON
================================================== */

function goBack() {

    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}



/* ==================================================
   START
================================================== */

if (
    type.toLowerCase() ===
    "series"
    &&
    seriesName
) {

    loadSeries();

} else {

    loadMovie();

}

</script>


</body>

</html>
