<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing - My Library</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */
.header{
    height:72px;
    width:100%;
    background:#050505;
    border-bottom:1px solid #202020;
    display:flex;
    align-items:center;
    padding:0 35px;
    gap:25px;
    position:relative;
    z-index:20;
}

.back-btn{
    background:#080808;
    color:#fff;
    border:1px solid #333;
    border-radius:6px;
    padding:10px 18px;
    font-size:15px;
    cursor:pointer;
}

.back-btn:hover{
    background:#181818;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.logo span{
    color:#e50914;
}

/* PAGE */
.player-page{
    width:100%;
    min-height:calc(100vh - 72px);
    background:#000;
}

/* VIDEO AREA */
.video-section{
    width:100%;
    background:#000;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
}

.video-container{
    position:relative;
    width:100%;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
}

/*
    IMPORTANT:
    Video keeps its real aspect ratio.
    No forced 100% height.
*/
video{
    width:100%;
    height:auto;
    max-height:calc(100vh - 72px);
    object-fit:contain;
    background:#000;
    display:block;
}

/* CONTROLS */
.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:0 20px 12px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.9)
    );
    z-index:10;
    opacity:1;
    transition:opacity .25s ease;
}

.video-container:hover .controls{
    opacity:1;
}

.timeline-area{
    width:100%;
    position:relative;
    padding-top:65px;
}

.preview-box{
    position:absolute;
    bottom:18px;
    left:0;
    width:180px;
    height:102px;
    background:#111;
    border:2px solid #333;
    border-radius:4px;
    overflow:hidden;
    display:none;
    pointer-events:none;
    z-index:50;
    box-shadow:0 5px 20px rgba(0,0,0,.8);
}

.preview-box canvas{
    width:100%;
    height:100%;
    display:block;
}

.preview-time{
    position:absolute;
    bottom:3px;
    left:0;
    right:0;
    text-align:center;
    font-size:11px;
    font-weight:bold;
    text-shadow:0 1px 3px #000;
}

.timeline{
    position:relative;
    width:100%;
    height:5px;
    background:#666;
    border-radius:10px;
    cursor:pointer;
}

.timeline-buffer{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    width:0;
    background:#999;
    border-radius:10px;
    pointer-events:none;
}

.timeline-progress{
    position:absolute;
    top:0;
    left:0;
    height:100%;
    width:0;
    background:#e50914;
    border-radius:10px;
    pointer-events:none;
}

.timeline-thumb{
    position:absolute;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#e50914;
    top:50%;
    transform:translate(-50%,-50%);
    left:0;
    pointer-events:none;
}

.control-row{
    height:50px;
    display:flex;
    align-items:center;
    gap:18px;
}

.control-btn{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
    cursor:pointer;
    width:30px;
    height:35px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0;
}

.control-btn:hover{
    color:#e50914;
}

.time{
    font-size:13px;
    white-space:nowrap;
    color:#ddd;
}

.volume-container{
    display:flex;
    align-items:center;
    gap:8px;
}

.volume-slider{
    width:80px;
}

.control-spacer{
    flex:1;
}

.speed-wrapper,
.quality-wrapper{
    position:relative;
}

.menu{
    position:absolute;
    bottom:45px;
    right:0;
    background:#181818;
    border:1px solid #333;
    border-radius:6px;
    min-width:130px;
    padding:6px 0;
    display:none;
    z-index:100;
}

.menu button{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:#fff;
    text-align:left;
    padding:9px 14px;
    cursor:pointer;
    font-size:13px;
}

.menu button:hover{
    background:#333;
}

/* TITLE */
.movie-title{
    padding:18px 35px 12px;
    font-size:26px;
    font-weight:700;
    background:#000;
}

/* SEASONS / EPISODES */
.series-panel{
    display:none;
    padding:10px 35px 30px;
    background:#000;
}

.series-panel.visible{
    display:block;
}

.season-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
}

.season-label{
    font-size:14px;
    color:#aaa;
}

.season-btn,
.episode-btn{
    background:#151515;
    color:#fff;
    border:1px solid #333;
    border-radius:6px;
    padding:9px 14px;
    cursor:pointer;
}

.season-btn:hover,
.episode-btn:hover{
    background:#252525;
}

.season-btn.active,
.episode-btn.active{
    background:#e50914;
    border-color:#e50914;
}

.episode-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.episode-btn{
    min-width:70px;
}

/* ERROR */
.error-message{
    display:none;
    padding:40px;
    color:#aaa;
    text-align:center;
    font-size:18px;
}

/* MOBILE */
@media(max-width:700px){

    .header{
        height:60px;
        padding:0 15px;
    }

    .logo{
        font-size:17px;
    }

    video{
        width:100%;
        height:auto;
        max-height:none;
    }

    .controls{
        padding-left:10px;
        padding-right:10px;
    }

    .volume-slider{
        display:none;
    }

    .quality-btn{
        display:none;
    }

    .movie-title{
        padding:12px 15px;
        font-size:20px;
    }

    .series-panel{
        padding:8px 15px 20px;
    }

    .preview-box{
        width:140px;
        height:79px;
    }

    .control-row{
        gap:8px;
    }
}
</style>
</head>

<body>

<div class="player-page">

    <!-- HEADER -->
    <div class="header">

        <button class="back-btn" onclick="goBack()">
            ← Back
        </button>

        <div class="logo">
            MY <span>LIBRARY</span>
        </div>

    </div>


    <!-- VIDEO -->
    <div class="video-section">

        <div class="video-container" id="videoContainer">

            <video
                id="video"
                preload="metadata"
                playsinline
                controlslist="nodownload"
            ></video>


            <!-- CONTROLS -->
            <div class="controls">

                <div class="timeline-area">

                    <div class="preview-box" id="previewBox">

                        <canvas
                            id="previewCanvas"
                            width="180"
                            height="102"
                        ></canvas>

                        <div
                            class="preview-time"
                            id="previewTime"
                        >
                            00:00
                        </div>

                    </div>


                    <div
                        class="timeline"
                        id="timeline"
                    >

                        <div
                            class="timeline-buffer"
                            id="buffer"
                        ></div>

                        <div
                            class="timeline-progress"
                            id="progress"
                        ></div>

                        <div
                            class="timeline-thumb"
                            id="thumb"
                        ></div>

                    </div>

                </div>


                <div class="control-row">

                    <button
                        class="control-btn"
                        id="rewindBtn"
                        title="Rewind 10 seconds"
                    >
                        ↶
                    </button>


                    <button
                        class="control-btn"
                        id="playBtn"
                        title="Play / Pause"
                    >
                        ▶
                    </button>


                    <button
                        class="control-btn"
                        id="forwardBtn"
                        title="Forward 10 seconds"
                    >
                        ↷
                    </button>


                    <div class="volume-container">

                        <button
                            class="control-btn"
                            id="muteBtn"
                            title="Mute"
                        >
                            🔊
                        </button>

                        <input
                            class="volume-slider"
                            id="volumeSlider"
                            type="range"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1"
                        >

                    </div>


                    <div class="time">

                        <span id="currentTime">
                            00:00
                        </span>

                        /

                        <span id="duration">
                            00:00
                        </span>

                    </div>


                    <div class="control-spacer"></div>


                    <!-- SPEED -->
                    <div class="speed-wrapper">

                        <button
                            class="control-btn"
                            id="speedBtn"
                            title="Playback speed"
                        >
                            ⚡
                        </button>

                        <div
                            class="menu"
                            id="speedMenu"
                        >

                            <button data-speed="0.5">
                                0.5×
                            </button>

                            <button data-speed="0.75">
                                0.75×
                            </button>

                            <button data-speed="1">
                                Normal
                            </button>

                            <button data-speed="1.25">
                                1.25×
                            </button>

                            <button data-speed="1.5">
                                1.5×
                            </button>

                            <button data-speed="2">
                                2×
                            </button>

                        </div>

                    </div>


                    <!-- QUALITY -->
                    <div class="quality-wrapper">

                        <button
                            class="control-btn quality-btn"
                            id="qualityBtn"
                            title="Quality"
                        >
                            ⚙
                        </button>

                        <div
                            class="menu"
                            id="qualityMenu"
                        >

                            <button data-quality="auto">
                                Auto
                            </button>

                            <button data-quality="1080">
                                1080p
                            </button>

                            <button data-quality="720">
                                720p
                            </button>

                            <button data-quality="480">
                                480p
                            </button>

                        </div>

                    </div>


                    <!-- FULLSCREEN -->
                    <button
                        class="control-btn"
                        id="fullscreenBtn"
                        title="Fullscreen"
                    >
                        ⛶
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- TITLE -->
    <div
        class="movie-title"
        id="movieTitle"
    >
        Now Playing
    </div>


    <!-- SEASONS / EPISODES -->
    <div
        class="series-panel"
        id="seriesPanel"
    >

        <div
            class="season-row"
            id="seasonRow"
        ></div>

        <div
            class="episode-row"
            id="episodeRow"
        ></div>

    </div>


    <!-- ERROR -->
    <div
        class="error-message"
        id="errorMessage"
    >
        No video was supplied.
        <br>
        Please open a movie from your library.
    </div>

</div>


<script>

/* =========================
   URL PARAMETERS
========================= */

const params =
    new URLSearchParams(window.location.search);

const type =
    params.get("type") || "movie";

const videoURL =
    params.get("video");

const title =
    params.get("title") || "Now Playing";

const seriesTitle =
    params.get("series") || title;


/* =========================
   EPISODES
========================= */

let episodes = [];

try{

    episodes =
        JSON.parse(
            params.get("episodes") || "[]"
        );

}catch(e){

    episodes = [];

}


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById("video");

const videoContainer =
    document.getElementById("videoContainer");

const playBtn =
    document.getElementById("playBtn");

const rewindBtn =
    document.getElementById("rewindBtn");

const forwardBtn =
    document.getElementById("forwardBtn");

const muteBtn =
    document.getElementById("muteBtn");

const volumeSlider =
    document.getElementById("volumeSlider");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const timeline =
    document.getElementById("timeline");

const progress =
    document.getElementById("progress");

const buffer =
    document.getElementById("buffer");

const thumb =
    document.getElementById("thumb");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const movieTitle =
    document.getElementById("movieTitle");

const speedBtn =
    document.getElementById("speedBtn");

const speedMenu =
    document.getElementById("speedMenu");

const qualityBtn =
    document.getElementById("qualityBtn");

const qualityMenu =
    document.getElementById("qualityMenu");

const seriesPanel =
    document.getElementById("seriesPanel");

const seasonRow =
    document.getElementById("seasonRow");

const episodeRow =
    document.getElementById("episodeRow");

const errorMessage =
    document.getElementById("errorMessage");

const previewBox =
    document.getElementById("previewBox");

const previewCanvas =
    document.getElementById("previewCanvas");

const previewTime =
    document.getElementById("previewTime");


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds){

    if(!isFinite(seconds)){
        return "00:00";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);


    if(hours > 0){

        return (
            String(hours).padStart(2,"0")
            + ":" +
            String(minutes).padStart(2,"0")
            + ":" +
            String(secs).padStart(2,"0")
        );

    }


    return (
        String(minutes).padStart(2,"0")
        + ":" +
        String(secs).padStart(2,"0")
    );
}


/* =========================
   LOAD VIDEO
========================= */

function loadVideo(url,name){

    if(!url){

        errorMessage.style.display =
            "block";

        return;
    }


    errorMessage.style.display =
        "none";


    video.pause();

    video.src = url;

    video.load();


    movieTitle.textContent =
        name || seriesTitle;


    document.title =
        (name || seriesTitle)
        + " - My Library";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   SERIES
========================= */

if(type === "series" && episodes.length){

    seriesPanel.classList.add("visible");


    episodes.sort((a,b)=>{

        if(
            Number(a.season)
            !==
            Number(b.season)
        ){

            return (
                Number(a.season)
                -
                Number(b.season)
            );
        }


        return (
            Number(a.episode)
            -
            Number(b.episode)
        );

    });


    const seasons =
        [
            ...new Set(
                episodes.map(
                    e => Number(e.season) || 1
                )
            )
        ];


    let activeSeason =
        seasons[0];


    /* SEASONS */

    function renderSeasons(){

        seasonRow.innerHTML = "";


        const label =
            document.createElement("span");

        label.className =
            "season-label";

        label.textContent =
            "Season:";

        seasonRow.appendChild(label);


        seasons.forEach(season=>{

            const btn =
                document.createElement("button");

            btn.className =
                "season-btn"
                +
                (
                    season === activeSeason
                    ? " active"
                    : ""
                );


            btn.textContent =
                "Season " + season;


            btn.onclick = ()=>{

                activeSeason =
                    season;

                renderSeasons();

                renderEpisodes();

            };


            seasonRow.appendChild(btn);

        });

    }


    /* EPISODES */

    function renderEpisodes(){

        episodeRow.innerHTML =
            "";


        const current =
            episodes.filter(
                e =>
                    (Number(e.season) || 1)
                    ===
                    activeSeason
            );


        current.forEach(ep=>{

            const btn =
                document.createElement("button");

            btn.className =
                "episode-btn";


            btn.textContent =
                "Episode "
                +
                ep.episode;


            btn.onclick = ()=>{

                document
                    .querySelectorAll(
                        ".episode-btn"
                    )
                    .forEach(x =>
                        x.classList.remove(
                            "active"
                        )
                    );


                btn.classList.add(
                    "active"
                );


                loadVideo(
                    ep.video,
                    ep.name
                );

            };


            episodeRow.appendChild(btn);

        });


        /* AUTO OPEN FIRST EPISODE */

        if(current.length){

            const first =
                current[0];


            const firstButton =
                episodeRow.querySelector(
                    ".episode-btn"
                );


            if(firstButton){

                firstButton.classList.add(
                    "active"
                );

            }


            loadVideo(
                first.video,
                first.name
            );

        }

    }


    renderSeasons();

    renderEpisodes();


}else{

    /* MOVIE */

    loadVideo(
        videoURL,
        title
    );

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

    if(video.paused){

        video.play().catch(()=>{});

    }else{

        video.pause();

    }

}


playBtn.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "play",
    ()=>{
        playBtn.textContent =
            "❚❚";
    }
);


video.addEventListener(
    "pause",
    ()=>{
        playBtn.textContent =
            "▶";
    }
);


/* =========================
   REWIND / FORWARD
========================= */

rewindBtn.addEventListener(
    "click",
    ()=>{
        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );
    }
);


forwardBtn.addEventListener(
    "click",
    ()=>{
        video.currentTime =
            Math.min(
                video.duration || 0,
                video.currentTime + 10
            );
    }
);


/* =========================
   PROGRESS
========================= */

video.addEventListener(
    "timeupdate",
    ()=>{

        if(!video.duration){
            return;
        }


        const p =
            (
                video.currentTime
                /
                video.duration
            ) * 100;


        progress.style.width =
            p + "%";


        thumb.style.left =
            p + "%";


        currentTime.textContent =
            formatTime(
                video.currentTime
            );

    }
);


video.addEventListener(
    "loadedmetadata",
    ()=>{

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);


/* =========================
   SEEK
========================= */

timeline.addEventListener(
    "click",
    e=>{

        if(!video.duration){
            return;
        }


        const rect =
            timeline.getBoundingClientRect();


        const p =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        e.clientX
                        -
                        rect.left
                    )
                    /
                    rect.width
                )
            );


        video.currentTime =
            p * video.duration;

    }
);


/* =========================
   BUFFER
========================= */

video.addEventListener(
    "progress",
    ()=>{

        if(
            !video.duration
            ||
            !video.buffered.length
        ){

            return;
        }


        const end =
            video.buffered.end(
                video.buffered.length - 1
            );


        buffer.style.width =
            Math.min(
                100,
                (
                    end
                    /
                    video.duration
                ) * 100
            ) + "%";

    }
);


/* =========================
   VOLUME
========================= */

volumeSlider.addEventListener(
    "input",
    ()=>{

        video.volume =
            Number(
                volumeSlider.value
            );


        muteBtn.textContent =
            video.volume === 0
            ? "🔇"
            : "🔊";

    }
);


muteBtn.addEventListener(
    "click",
    ()=>{

        video.muted =
            !video.muted;


        muteBtn.textContent =
            video.muted
            ? "🔇"
            : "🔊";

    }
);


/* =========================
   FULLSCREEN
========================= */

fullscreenBtn.addEventListener(
    "click",
    async()=>{

        try{

            if(!document.fullscreenElement){

                await videoContainer.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(e){}

    }
);


/* =========================
   SPEED MENU
========================= */

speedBtn.addEventListener(
    "click",
    e=>{

        e.stopPropagation();


        speedMenu.style.display =
            speedMenu.style.display === "block"
            ? "none"
            : "block";


        qualityMenu.style.display =
            "none";

    }
);


document
    .querySelectorAll(
        "#speedMenu button"
    )
    .forEach(btn=>{

        btn.onclick = ()=>{

            video.playbackRate =
                Number(
                    btn.dataset.speed
                );


            speedMenu.style.display =
                "none";

        };

    });


/* =========================
   QUALITY MENU
========================= */

qualityBtn.addEventListener(
    "click",
    e=>{

        e.stopPropagation();


        qualityMenu.style.display =
            qualityMenu.style.display === "block"
            ? "none"
            : "block";


        speedMenu.style.display =
            "none";

    }
);


document
    .querySelectorAll(
        "#qualityMenu button"
    )
    .forEach(btn=>{

        btn.onclick = ()=>{

            qualityMenu.style.display =
                "none";


            if(
                btn.dataset.quality
                !==
                "auto"
            ){

                alert(
                    "Quality switching needs separate video files for each quality."
                );

            }

        };

    });


/* =========================
   CLOSE MENUS
========================= */

document.addEventListener(
    "click",
    ()=>{

        speedMenu.style.display =
            "none";

        qualityMenu.style.display =
            "none";

    }
);


/* =========================
   TIMELINE PREVIEW
========================= */

let previewVideo = null;


function createPreview(){

    previewVideo =
        document.createElement(
            "video"
        );


    previewVideo.preload =
        "metadata";


    previewVideo.muted =
        true;


    previewVideo.playsInline =
        true;


    previewVideo.style.display =
        "none";


    document.body.appendChild(
        previewVideo
    );

}


video.addEventListener(
    "loadedmetadata",
    ()=>{

        if(previewVideo){

            previewVideo.src =
                video.currentSrc
                ||
                video.src;


            previewVideo.load();

        }

    }
);


timeline.addEventListener(
    "mousemove",
    e=>{

        if(!video.duration){
            return;
        }


        const rect =
            timeline.getBoundingClientRect();


        const p =
            Math.max(
                0,
                Math.min(
                    1,
                    (
                        e.clientX
                        -
                        rect.left
                    )
                    /
                    rect.width
                )
            );


        const seconds =
            p * video.duration;


        const w =
            previewBox.offsetWidth;


        let left =
            e.clientX
            -
            rect.left
            -
            w / 2;


        left =
            Math.max(
                0,
                Math.min(
                    rect.width - w,
                    left
                )
            );


        previewBox.style.left =
            left + "px";


        previewBox.style.display =
            "block";


        previewTime.textContent =
            formatTime(seconds);

    }
);


timeline.addEventListener(
    "mouseleave",
    ()=>{
        previewBox.style.display =
            "none";
    }
);


createPreview();


/* =========================
   KEYBOARD CONTROLS
========================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName ===
            "INPUT"
        ){

            return;
        }


        if(e.code === "Space"){

            e.preventDefault();

            togglePlay();

        }


        if(e.key === "ArrowLeft"){

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }


        if(e.key === "ArrowRight"){

            video.currentTime =
                Math.min(
                    video.duration || 0,
                    video.currentTime + 5
                );

        }


        if(
            e.key.toLowerCase()
            ===
            "f"
        ){

            fullscreenBtn.click();

        }

    }
);


/* =========================
   BACK BUTTON
========================= */

function goBack(){

    if(
        document.referrer
        &&
        document.referrer
        !==
        window.location.href
    ){

        history.back();

    }else{

        window.location.href =
            "index.html";

    }

}

</script>
