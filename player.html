<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing - My Library</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.header{
    height:72px;
    width:100%;
    background:#050505;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    padding:0 35px;
    gap:25px;
    position:relative;
    z-index:20;
}

.back-button{
    background:#050505;
    color:#fff;
    border:1px solid #333;
    border-radius:6px;
    padding:10px 17px;
    font-size:15px;
    cursor:pointer;
}

.back-button:hover{
    background:#222;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:#e50914;
}

.player-area{
    position:relative;
    width:100%;
    height:calc(100vh - 72px);
    background:#000;
    overflow:hidden;
}

.video-wrapper{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    display:block;
}

video.fit-contain{
    object-fit:contain;
}

video.fit-cover{
    object-fit:cover;
}

video.fit-fill{
    object-fit:fill;
}


/* =========================
   PLAYER CONTROLS
   ========================= */

.controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:105px;
    padding:0 20px 15px;

    background:linear-gradient(
        to top,
        rgba(0,0,0,.95),
        rgba(0,0,0,.65),
        rgba(0,0,0,0)
    );

    z-index:10;

    opacity:1;
    visibility:visible;
    transform:translateY(0);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s ease;

    pointer-events:auto;
}


/* Controls hidden while playing */
.player-area.controls-hidden .controls{
    opacity:0;
    visibility:hidden;
    transform:translateY(20px);
    pointer-events:none;
}


/* Controls always visible while paused */
.player-area.paused .controls{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
    pointer-events:auto;
}


/* =========================
   TIMELINE
   ========================= */

.timeline-area{
    position:relative;
    width:100%;
    height:45px;
    display:flex;
    align-items:flex-end;
    padding-bottom:5px;
}

#timeline{
    width:100%;
    height:5px;
    appearance:none;
    -webkit-appearance:none;
    background:#666;
    border-radius:10px;
    cursor:pointer;
    margin:0;
}

#timeline::-webkit-slider-thumb{
    appearance:none;
    -webkit-appearance:none;
    width:14px;
    height:14px;
    background:#e50914;
    border-radius:50%;
    cursor:pointer;
}

#timeline::-moz-range-thumb{
    width:14px;
    height:14px;
    background:#e50914;
    border:0;
    border-radius:50%;
    cursor:pointer;
}


/* =========================
   PREVIEW
   ========================= */

.preview-box{
    position:absolute;
    bottom:13px;
    left:0;

    width:180px;
    height:100px;

    background:#111;
    border:1px solid #444;
    border-radius:5px;

    overflow:hidden;
    display:none;

    pointer-events:none;

    transform:translateX(-50%);

    box-shadow:0 5px 20px rgba(0,0,0,.8);
}

.preview-box video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.preview-time{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    text-align:center;

    background:rgba(0,0,0,.75);

    font-size:12px;

    padding:3px;
}


/* =========================
   CONTROL ROW
   ========================= */

.control-row{
    width:100%;
    height:45px;

    display:flex;
    align-items:center;

    gap:12px;
}

.control-button{
    border:0;
    background:transparent;
    color:#fff;

    font-size:18px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    border-radius:4px;
}

.control-button:hover{
    background:rgba(255,255,255,.15);
}

.skip-button{
    font-size:13px;
    font-weight:bold;
}

.time-display{
    font-size:13px;
    color:#ddd;
    white-space:nowrap;
    min-width:90px;
}


/* =========================
   VOLUME
   ========================= */

.volume-container{
    display:flex;
    align-items:center;
    gap:6px;
}

#volume{
    width:80px;
    cursor:pointer;
}

.spacer{
    flex:1;
}


/* =========================
   SPEED / FIT MENUS
   ========================= */

.speed-container,
.fit-container{
    position:relative;
}

.speed-menu,
.fit-menu{
    position:absolute;

    bottom:42px;
    right:0;

    background:#181818;
    border:1px solid #333;
    border-radius:5px;

    display:none;
    overflow:hidden;

    box-shadow:0 5px 20px rgba(0,0,0,.8);
}

.speed-menu{
    width:120px;
}

.fit-menu{
    width:130px;
}

.speed-menu button,
.fit-menu button{
    width:100%;

    background:transparent;
    color:#fff;

    border:0;

    padding:9px;

    text-align:left;

    cursor:pointer;

    font-size:14px;
}

.speed-menu button:hover,
.fit-menu button:hover{
    background:#333;
}


/* =========================
   ERROR MESSAGE
   ========================= */

.error-message{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    text-align:center;

    color:#aaa;

    font-size:18px;

    z-index:5;

    display:none;
}


/* =========================
   FULLSCREEN
   ========================= */

.player-area:fullscreen{
    width:100vw;
    height:100vh;
    background:#000;
}

.player-area:fullscreen .video-wrapper{
    width:100vw;
    height:100vh;
}


/* =========================
   MOBILE
   ========================= */

@media(max-width:700px){

    .header{
        height:60px;
        padding:0 15px;
    }

    .logo{
        font-size:18px;
    }

    .player-area{
        height:calc(100vh - 60px);
    }

    .volume-container{
        display:none;
    }

    .controls{
        padding-left:10px;
        padding-right:10px;
    }

    .control-row{
        gap:5px;
    }

    .time-display{
        font-size:11px;
        min-width:75px;
    }

    .preview-box{
        width:140px;
        height:78px;
    }
}
</style>
</head>


<body>

<div class="header">

    <button class="back-button" onclick="goBack()">
        ← Back
    </button>

    <div class="logo">
        MY <span>LIBRARY</span>
    </div>

</div>


<div class="player-area paused" id="playerArea">

    <div class="video-wrapper">

        <video
            id="video"
            preload="metadata"
            playsinline>
        </video>

    </div>


    <div class="error-message" id="errorMessage">
        No video was supplied.<br>
        Please open a movie from your library.
    </div>


    <div class="controls" id="controls">

        <div class="timeline-area">

            <div class="preview-box" id="previewBox">

                <video
                    id="previewVideo"
                    muted
                    preload="metadata">
                </video>

                <div
                    class="preview-time"
                    id="previewTime">
                    00:00
                </div>

            </div>


            <input
                type="range"
                id="timeline"
                min="0"
                max="100"
                value="0"
                step="0.01">

        </div>


        <div class="control-row">


            <button
                class="control-button skip-button"
                id="back10"
                title="Back 10 seconds">
                ↶10
            </button>


            <button
                class="control-button"
                id="playButton"
                title="Play / Pause">
                ▶
            </button>


            <button
                class="control-button skip-button"
                id="forward10"
                title="Forward 10 seconds">
                10↷
            </button>


            <div class="volume-container">

                <button
                    class="control-button"
                    id="muteButton"
                    title="Mute">
                    🔊
                </button>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">

            </div>


            <div
                class="time-display"
                id="timeDisplay">
                00:00 / 00:00
            </div>


            <div class="spacer"></div>


            <div class="speed-container">

                <button
                    class="control-button"
                    id="speedButton">
                    1×
                </button>

                <div
                    class="speed-menu"
                    id="speedMenu">

                    <button data-speed="0.5">
                        0.5×
                    </button>

                    <button data-speed="0.75">
                        0.75×
                    </button>

                    <button data-speed="1">
                        Normal
                    </button>

                    <button data-speed="1.25">
                        1.25×
                    </button>

                    <button data-speed="1.5">
                        1.5×
                    </button>

                    <button data-speed="1.75">
                        1.75×
                    </button>

                    <button data-speed="2">
                        2×
                    </button>

                </div>

            </div>


            <div class="fit-container">

                <button
                    class="control-button"
                    id="fitButton">
                    ⛶
                </button>

                <div
                    class="fit-menu"
                    id="fitMenu">

                    <button data-fit="contain">
                        Fit
                    </button>

                    <button data-fit="cover">
                        Fill
                    </button>

                    <button data-fit="fill">
                        Stretch
                    </button>

                </div>

            </div>


            <button
                class="control-button"
                id="fullscreenButton">
                ⛶
            </button>

        </div>

    </div>

</div>


<script>

const video =
    document.getElementById('video');

const previewVideo =
    document.getElementById('previewVideo');

const timeline =
    document.getElementById('timeline');

const previewBox =
    document.getElementById('previewBox');

const previewTime =
    document.getElementById('previewTime');

const playButton =
    document.getElementById('playButton');

const back10 =
    document.getElementById('back10');

const forward10 =
    document.getElementById('forward10');

const volume =
    document.getElementById('volume');

const muteButton =
    document.getElementById('muteButton');

const timeDisplay =
    document.getElementById('timeDisplay');

const speedButton =
    document.getElementById('speedButton');

const speedMenu =
    document.getElementById('speedMenu');

const fitButton =
    document.getElementById('fitButton');

const fitMenu =
    document.getElementById('fitMenu');

const fullscreenButton =
    document.getElementById('fullscreenButton');

const playerArea =
    document.getElementById('playerArea');

const errorMessage =
    document.getElementById('errorMessage');


/* =========================
   GET VIDEO URL
   ========================= */

const params =
    new URLSearchParams(location.search);

const videoSource =
    params.get('video') ||
    params.get('src');

const movieTitle =
    params.get('title') ||
    'Now Playing';


/* =========================
   LOAD VIDEO
   ========================= */

if(videoSource){

    video.src = videoSource;

    previewVideo.src = videoSource;

    document.title =
        movieTitle + ' - My Library';

}
else{

    errorMessage.style.display =
        'block';

}


/* =========================
   AUTO HIDE CONTROLS
   ========================= */

let hideTimer = null;


function showControls(){

    playerArea.classList.remove(
        'controls-hidden'
    );

    clearTimeout(hideTimer);


    if(!video.paused){

        hideTimer =
            setTimeout(
                hideControls,
                3000
            );

    }

}


function hideControls(){

    if(
        !video.paused &&
        speedMenu.style.display !== 'block' &&
        fitMenu.style.display !== 'block'
    ){

        playerArea.classList.add(
            'controls-hidden'
        );

    }

}


/* Mouse movement */

playerArea.addEventListener(
    'mousemove',
    showControls
);


/* Mouse enters player */

playerArea.addEventListener(
    'mouseenter',
    showControls
);


/* Touch */

playerArea.addEventListener(
    'touchstart',
    showControls,
    {passive:true}
);

playerArea.addEventListener(
    'touchmove',
    showControls,
    {passive:true}
);


/* =========================
   PLAY / PAUSE
   ========================= */

function togglePlay(){

    if(video.paused){

        video.play().catch(()=>{});

    }
    else{

        video.pause();

    }

}


playButton.onclick = function(e){

    e.stopPropagation();

    togglePlay();

};


video.addEventListener(
    'play',
    function(){

        playButton.textContent =
            '❚❚';

        playerArea.classList.remove(
            'paused'
        );

        showControls();

    }
);


video.addEventListener(
    'pause',
    function(){

        playButton.textContent =
            '▶';

        playerArea.classList.add(
            'paused'
        );

        clearTimeout(hideTimer);

        playerArea.classList.remove(
            'controls-hidden'
        );

    }
);


/* =========================
   KEYBOARD CONTROLS
   ========================= */

document.addEventListener(
    'keydown',
    function(e){

        if(
            e.code === 'Space' &&
            e.target.tagName !== 'INPUT'
        ){

            e.preventDefault();

            togglePlay();

        }


        if(e.key === 'ArrowLeft'){

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }


        if(e.key === 'ArrowRight'){

            video.currentTime =
                Math.min(
                    video.duration || 0,
                    video.currentTime + 5
                );

        }


        if(e.key.toLowerCase() === 'f'){

            fullscreenButton.click();

        }

    }
);


/* =========================
   SKIP BUTTONS
   ========================= */

back10.onclick = function(e){

    e.stopPropagation();

    video.currentTime =
        Math.max(
            0,
            video.currentTime - 10
        );

    showControls();

};


forward10.onclick = function(e){

    e.stopPropagation();

    video.currentTime =
        Math.min(
            video.duration || 0,
            video.currentTime + 10
        );

    showControls();

};


/* =========================
   TIME FORMAT
   ========================= */

function formatTime(s){

    if(!s || isNaN(s))
        return '00:00';

    s = Math.floor(s);

    const h =
        Math.floor(s / 3600);

    const m =
        Math.floor((s % 3600) / 60);

    const sec =
        s % 60;


    if(h > 0){

        return (
            String(h).padStart(2,'0') +
            ':' +
            String(m).padStart(2,'0') +
            ':' +
            String(sec).padStart(2,'0')
        );

    }


    return (
        String(m).padStart(2,'0') +
        ':' +
        String(sec).padStart(2,'0')
    );

}


/* =========================
   VIDEO TIME
   ========================= */

video.addEventListener(
    'timeupdate',
    function(){

        if(video.duration){

            timeline.value =
                video.currentTime /
                video.duration *
                100;


            timeDisplay.textContent =
                formatTime(video.currentTime) +
                ' / ' +
                formatTime(video.duration);

        }

    }
);


video.addEventListener(
    'loadedmetadata',
    function(){

        timeDisplay.textContent =
            '00:00 / ' +
            formatTime(video.duration);

    }
);


/* =========================
   TIMELINE
   ========================= */

timeline.addEventListener(
    'input',
    function(){

        showControls();

        if(video.duration){

            video.currentTime =
                timeline.value /
                100 *
                video.duration;

        }

    }
);


/* =========================
   TIMELINE PREVIEW
   ========================= */

timeline.addEventListener(
    'mousemove',
    function(e){

        if(!video.duration)
            return;


        const r =
            timeline.getBoundingClientRect();


        let p =
            (e.clientX - r.left) /
            r.width;


        p =
            Math.max(
                0,
                Math.min(1,p)
            );


        previewBox.style.display =
            'block';


        previewBox.style.left =
            p * 100 + '%';


        previewTime.textContent =
            formatTime(
                p * video.duration
            );


        try{

            previewVideo.currentTime =
                p * video.duration;

        }
        catch(_){}

    }
);


timeline.addEventListener(
    'mouseleave',
    function(){

        previewBox.style.display =
            'none';

    }
);


/* =========================
   VOLUME
   ========================= */

volume.oninput =
    function(){

        video.volume =
            volume.value;

        video.muted = false;

        updateMuteIcon();

        showControls();

    };


muteButton.onclick =
    function(e){

        e.stopPropagation();

        video.muted =
            !video.muted;

        updateMuteIcon();

        showControls();

    };


function updateMuteIcon(){

    muteButton.textContent =
        video.muted ||
        video.volume === 0
        ? '🔇'
        : '🔊';

}


/* =========================
   SPEED MENU
   ========================= */

speedButton.onclick =
    function(e){

        e.stopPropagation();

        fitMenu.style.display =
            'none';


        speedMenu.style.display =
            speedMenu.style.display === 'block'
            ? 'none'
            : 'block';


        showControls();

    };


document.querySelectorAll(
    '#speedMenu button'
).forEach(
    function(b){

        b.onclick =
            function(e){

                e.stopPropagation();

                video.playbackRate =
                    parseFloat(
                        b.dataset.speed
                    );


                speedButton.textContent =
                    b.dataset.speed + '×';


                speedMenu.style.display =
                    'none';


                showControls();

            };

    }
);


/* =========================
   FIT MENU
   ========================= */

fitButton.onclick =
    function(e){

        e.stopPropagation();

        speedMenu.style.display =
            'none';


        fitMenu.style.display =
            fitMenu.style.display === 'block'
            ? 'none'
            : 'block';


        showControls();

    };


document.querySelectorAll(
    '#fitMenu button'
).forEach(
    function(b){

        b.onclick =
            function(e){

                e.stopPropagation();


                video.classList.remove(
                    'fit-contain',
                    'fit-cover',
                    'fit-fill'
                );


                video.classList.add(
                    'fit-' +
                    b.dataset.fit
                );


                fitMenu.style.display =
                    'none';


                showControls();

            };

    }
);


/* =========================
   CLOSE MENUS
   ========================= */

document.addEventListener(
    'click',
    function(){

        speedMenu.style.display =
            'none';

        fitMenu.style.display =
            'none';

    }
);


/* =========================
   FULLSCREEN
   ========================= */

fullscreenButton.onclick =
    function(e){

        e.stopPropagation();


        if(!document.fullscreenElement){

            if(playerArea.requestFullscreen){

                playerArea.requestFullscreen();

            }

        }
        else{

            document.exitFullscreen();

        }


        showControls();

    };


document.addEventListener(
    'fullscreenchange',
    showControls
);


/* Double-click fullscreen */

video.ondblclick =
    function(){

        if(!document.fullscreenElement){

            playerArea.requestFullscreen();

        }
        else{

            document.exitFullscreen();

        }

    };


/* =========================
   BACK BUTTON
   ========================= */

function goBack(){

    if(document.referrer){

        history.back();

    }
    else{

        location.href =
            'index.html';

    }

}


/* =========================
   VIDEO ERROR
   ========================= */

video.addEventListener(
    'error',
    function(){

        if(videoSource){

            errorMessage.innerHTML =
                'Unable to play this video.<br>' +
                'Check the video file or its URL.';

            errorMessage.style.display =
                'block';

        }

    }
);

</script>

</body>
</html>
