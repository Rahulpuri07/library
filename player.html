<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Now Playing - My Library</title>


<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    padding: 0;

    background: #000;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =========================
   HEADER
========================= */

.header {

    height: 72px;

    background: #050505;

    border-bottom:
        1px solid #1b1b1b;

    display: flex;

    align-items: center;

    padding:
        0 35px;

    gap: 25px;

}


.back-button {

    background: #050505;

    color: #fff;

    border:
        1px solid #333;

    border-radius: 5px;

    padding:
        10px 18px;

    cursor: pointer;

    font-size: 14px;

}

.back-button:hover {

    background: #151515;

}


.logo {

    font-size: 22px;

    font-weight: 900;

}

.logo span {

    color: #e50914;

}


/* =========================
   PLAYER AREA
========================= */

.player-page {

    width: 100%;

    min-height:
        calc(100vh - 72px);

    background: #000;

    padding:
        35px 35px 60px;

}


.video-wrapper {

    position: relative;

    width: 100%;

    max-width: 1400px;

    margin: 0 auto;

    background: #000;

}


/* VIDEO */

video {

    display: block;

    width: 100%;

    max-height: 78vh;

    background: #000;

}


/* =========================
   CUSTOM CONTROLS
========================= */

.controls {

    position: relative;

    width: 100%;

    background: #000;

    padding:
        8px 5px 5px;

}


/* TIMELINE */

.timeline-area {

    position: relative;

    width: 100%;

    height: 55px;

    display: flex;

    align-items: flex-end;

}


/* PREVIEW */

.preview {

    position: absolute;

    bottom: 27px;

    left: 0;

    width: 160px;

    height: 90px;

    display: none;

    pointer-events: none;

    overflow: hidden;

    border:
        2px solid #fff;

    border-radius: 4px;

    background: #111;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.8);

}

.preview video {

    width: 100%;

    height: 100%;

    object-fit: cover;

}


/* RANGE */

#timeline {

    width: 100%;

    cursor: pointer;

    appearance: none;

    height: 5px;

    background: #555;

    border-radius: 10px;

    outline: none;

}


/* RANGE THUMB */

#timeline::-webkit-slider-thumb {

    appearance: none;

    width: 14px;

    height: 14px;

    border-radius: 50%;

    background: #e50914;

    cursor: pointer;

}

#timeline::-moz-range-thumb {

    width: 14px;

    height: 14px;

    border: none;

    border-radius: 50%;

    background: #e50914;

    cursor: pointer;

}


/* BUTTON ROW */

.control-row {

    height: 48px;

    display: flex;

    align-items: center;

    gap: 18px;

}


/* BUTTONS */

.control-button {

    border: none;

    background: none;

    color: #fff;

    cursor: pointer;

    font-size: 18px;

    padding: 5px;

}

.control-button:hover {

    color: #e50914;

}


/* TIME */

.time {

    color: #bbb;

    font-size: 13px;

    min-width: 95px;

}


/* VOLUME */

.volume {

    width: 90px;

}


/* SPACER */

.spacer {

    flex: 1;

}


/* SPEED */

.speed {

    color: #fff;

    font-size: 13px;

}


/* =========================
   TITLE
========================= */

.movie-title {

    max-width: 1400px;

    margin:
        25px auto 0;

    font-size: 25px;

    font-weight: 700;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {

        padding:
            0 15px;

        gap: 15px;

    }

    .player-page {

        padding:
            20px 10px 40px;

    }

    video {

        max-height:
            70vh;

    }

    .volume {

        display: none;

    }

    .movie-title {

        font-size: 20px;

    }

    .preview {

        width: 130px;

        height: 73px;

    }

}

</style>

</head>


<body>


<header class="header">

    <button
        class="back-button"
        onclick="history.back()">

        ← Back

    </button>


    <div class="logo">

        MY <span>LIBRARY</span>

    </div>

</header>



<main class="player-page">


    <div class="video-wrapper">


        <video
            id="video"
            preload="metadata">

        </video>


        <div class="controls">


            <div class="timeline-area">


                <div
                    class="preview"
                    id="preview">

                    <video
                        id="previewVideo"
                        muted>
                    </video>

                </div>


                <input
                    type="range"
                    id="timeline"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1">

            </div>



            <div class="control-row">


                <button
                    class="control-button"
                    id="back10">

                    ↶

                </button>


                <button
                    class="control-button"
                    id="playButton">

                    ▶

                </button>


                <button
                    class="control-button"
                    id="forward10">

                    ↷

                </button>


                <button
                    class="control-button"
                    id="muteButton">

                    🔊

                </button>


                <input
                    class="volume"
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    value="1">


                <span
                    class="time"
                    id="time">

                    00:00 / 00:00

                </span>


                <div class="spacer"></div>


                <span
                    class="speed">

                    1×

                </span>


                <button
                    class="control-button"
                    id="fullscreen">

                    ⛶

                </button>


            </div>

        </div>

    </div>


    <div
        class="movie-title"
        id="movieTitle">

        Now Playing

    </div>


</main>



<script>


/* =========================
   GET URL DATA
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const videoURL =
    params.get("video");


const title =
    params.get("title")
    || "Unknown Title";


/* =========================
   ELEMENTS
========================= */

const video =
    document.getElementById(
        "video"
    );

const previewVideo =
    document.getElementById(
        "previewVideo"
    );

const timeline =
    document.getElementById(
        "timeline"
    );

const playButton =
    document.getElementById(
        "playButton"
    );

const time =
    document.getElementById(
        "time"
    );

const preview =
    document.getElementById(
        "preview"
    );

const volume =
    document.getElementById(
        "volume"
    );


/* =========================
   TITLE
========================= */

document.getElementById(
    "movieTitle"
).textContent =
    "Currently Playing — " +
    title;


document.title =
    title +
    " - My Library";


/* =========================
   LOAD VIDEO
========================= */

if (videoURL) {

    video.src =
        videoURL;

    previewVideo.src =
        videoURL;

    video.load();

    previewVideo.load();

}


/* =========================
   PLAY / PAUSE
========================= */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }

}


playButton.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚";

    }
);


video.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

    }
);


/* =========================
   TIME
========================= */

function formatTime(seconds) {

    if (!isFinite(seconds)) {

        return "00:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return String(minutes)
        .padStart(2, "0")
        + ":" +
        String(secs)
        .padStart(2, "0");

}


video.addEventListener(
    "loadedmetadata",
    function() {

        timeline.max =
            video.duration;

        updateTime();

    }
);


video.addEventListener(
    "timeupdate",
    updateTime
);


function updateTime() {

    timeline.value =
        video.currentTime;

    time.textContent =
        formatTime(
            video.currentTime
        )
        + " / " +
        formatTime(
            video.duration
        );

}


/* =========================
   TIMELINE
========================= */

timeline.addEventListener(
    "input",
    function() {

        video.currentTime =
            Number(
                timeline.value
            );

    }
);


/* =========================
   PREVIEW
========================= */

timeline.addEventListener(
    "mousemove",
    function(event) {

        if (
            !video.duration ||
            !isFinite(video.duration)
        ) {

            return;

        }


        const rect =
            timeline.getBoundingClientRect();


        let percent =
            (
                event.clientX -
                rect.left
            ) /
            rect.width;


        percent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );


        const previewTime =
            percent *
            video.duration;


        preview.style.display =
            "block";


        const previewWidth =
            preview.offsetWidth;


        let left =
            event.clientX -
            rect.left -
            previewWidth / 2;


        left =
            Math.max(
                0,
                Math.min(
                    rect.width -
                    previewWidth,
                    left
                )
            );


        preview.style.left =
            left + "px";


        previewVideo.currentTime =
            previewTime;

    }
);


timeline.addEventListener(
    "mouseleave",
    function() {

        preview.style.display =
            "none";

    }
);


/* =========================
   SKIP
========================= */

document.getElementById(
    "back10"
).addEventListener(
    "click",
    function() {

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );

    }
);


document.getElementById(
    "forward10"
).addEventListener(
    "click",
    function() {

        video.currentTime =
            Math.min(
                video.duration,
                video.currentTime + 10
            );

    }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
    "input",
    function() {

        video.volume =
            this.value;

        video.muted =
            this.value == 0;

    }
);


/* =========================
   MUTE
========================= */

document.getElementById(
    "muteButton"
).addEventListener(
    "click",
    function() {

        video.muted =
            !video.muted;

        this.textContent =
            video.muted
                ? "🔇"
                : "🔊";

    }
);


/* =========================
   FULLSCREEN
========================= */

document.getElementById(
    "fullscreen"
).addEventListener(
    "click",
    function() {

        if (
            video.requestFullscreen
        ) {

            video.requestFullscreen();

        }

    }
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        if (
            event.key === "ArrowLeft"
        ) {

            video.currentTime -= 10;

        }


        if (
            event.key === "ArrowRight"
        ) {

            video.currentTime += 10;

        }

    }
);

</script>


</body>

</html>
