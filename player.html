<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    overflow-x: hidden;
}

.topbar {
    height: 65px;
    background: #080808;
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 1px solid #222;
}

.back-btn {
    background: none;
    border: none;
    color: white;
    font-size: 25px;
    cursor: pointer;
    margin-right: 18px;
}

.title {
    font-size: 20px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-page {
    width: 100%;
    padding: 25px;
}

.video-container {
    position: relative;
    width: 100%;
    max-width: 1400px;
    margin: auto;
    background: #000;
    overflow: visible;
}

video {
    width: 100%;
    display: block;
    background: #000;
}

/* CONTROLS */

.controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 55px 18px 15px;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.timeline {
    position: relative;
    width: 100%;
    height: 6px;
    background: #555;
    cursor: pointer;
    border-radius: 10px;
    margin-bottom: 12px;
}

.buffer {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0;
    background: #888;
    border-radius: 10px;
}

.progress {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0;
    background: #e50914;
    border-radius: 10px;
}

.thumb {
    position: absolute;
    top: 50%;
    width: 13px;
    height: 13px;
    background: white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
}

.control-row {
    display: flex;
    align-items: center;
    gap: 12px;
}

.control-btn {
    background: none;
    border: none;
    color: white;
    font-size: 21px;
    cursor: pointer;
    padding: 5px;
}

.control-btn:hover {
    opacity: .7;
}

.time {
    font-size: 13px;
    color: #ddd;
    white-space: nowrap;
}

.spacer {
    flex: 1;
}

.volume-slider {
    width: 90px;
}

/* SPEED */

.menu-container {
    position: relative;
}

.speed-menu {
    display: none;
    position: absolute;
    bottom: 42px;
    right: 0;
    background: #181818;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
    min-width: 120px;
}

.speed-menu button {
    display: block;
    width: 100%;
    padding: 9px 14px;
    border: none;
    background: none;
    color: white;
    text-align: left;
    cursor: pointer;
}

.speed-menu button:hover {
    background: #333;
}

/* PREVIEW */

.preview-box {
    display: none;
    position: absolute;
    bottom: 80px;
    width: 180px;
    background: #111;
    border: 1px solid #444;
    border-radius: 5px;
    overflow: hidden;
    pointer-events: none;
    z-index: 50;
}

.preview-box canvas {
    display: block;
    width: 180px;
    height: 100px;
}

.preview-time {
    text-align: center;
    padding: 4px;
    font-size: 11px;
}

/* EPISODES */

.episodes-container {
    max-width: 1400px;
    margin: 30px auto 0;
}

.season-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 15px;
}

.season-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 25px;
}

.season-button {
    background: #181818;
    border: 1px solid #333;
    color: white;
    padding: 10px 16px;
    border-radius: 5px;
    cursor: pointer;
}

.season-button.active {
    background: #e50914;
    border-color: #e50914;
}

.episode-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.episode-button {
    background: #151515;
    border: 1px solid #333;
    color: white;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}

.episode-button:hover {
    background: #292929;
}

.episode-button.active {
    background: #e50914;
    border-color: #e50914;
}

/* MOBILE */

@media (max-width: 700px) {

    .topbar {
        padding: 0 15px;
    }

    .player-page {
        padding: 0;
    }

    .video-container {
        width: 100%;
    }

    .controls {
        padding: 45px 10px 8px;
    }

    .volume-slider {
        width: 60px;
    }

    .control-btn {
        font-size: 18px;
    }

    .episodes-container {
        padding: 0 15px;
    }

    .preview-box {
        display: none !important;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ←
    </button>

    <div
        class="title"
        id="movieTitle"
    >
        Loading...
    </div>

</header>


<main class="player-page">

    <div
        class="video-container"
        id="videoContainer"
    >

        <video
            id="video"
            playsinline
            preload="metadata"
        ></video>


        <div
            class="preview-box"
            id="previewBox"
        >

            <canvas
                id="previewCanvas"
                width="180"
                height="100"
            ></canvas>

            <div
                class="preview-time"
                id="previewTime"
            >
                0:00
            </div>

        </div>


        <div class="controls">

            <div
                class="timeline"
                id="timeline"
            >

                <div
                    class="buffer"
                    id="buffer"
                ></div>

                <div
                    class="progress"
                    id="progress"
                ></div>

                <div
                    class="thumb"
                    id="thumb"
                ></div>

            </div>


            <div class="control-row">

                <button
                    class="control-btn"
                    id="playBtn"
                >
                    ▶
                </button>


                <button
                    class="control-btn"
                    id="backBtn"
                >
                    ↶
                </button>


                <button
                    class="control-btn"
                    id="forwardBtn"
                >
                    ↷
                </button>


                <span
                    class="time"
                    id="currentTime"
                >
                    0:00
                </span>

                <span class="time">
                    /
                </span>

                <span
                    class="time"
                    id="duration"
                >
                    0:00
                </span>


                <div class="spacer"></div>


                <button
                    class="control-btn"
                    id="muteBtn"
                >
                    🔊
                </button>


                <input
                    type="range"
                    class="volume-slider"
                    id="volumeSlider"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >


                <div class="menu-container">

                    <button
                        class="control-btn"
                        id="speedBtn"
                    >
                        ⚙
                    </button>

                    <div
                        class="speed-menu"
                        id="speedMenu"
                    >

                        <button data-speed="0.5">
                            0.5x
                        </button>

                        <button data-speed="0.75">
                            0.75x
                        </button>

                        <button data-speed="1">
                            1x
                        </button>

                        <button data-speed="1.25">
                            1.25x
                        </button>

                        <button data-speed="1.5">
                            1.5x
                        </button>

                        <button data-speed="2">
                            2x
                        </button>

                    </div>

                </div>


                <button
                    class="control-btn"
                    id="fullscreenBtn"
                >
                    ⛶
                </button>

            </div>

        </div>

    </div>


    <!-- SEASONS / EPISODES -->

    <div
        class="episodes-container"
        id="episodesContainer"
        style="display:none;"
    >

        <div class="season-title">
            Seasons
        </div>

        <div
            class="season-buttons"
            id="seasonButtons"
        ></div>

        <div
            class="episode-list"
            id="episodeList"
        ></div>

    </div>

</main>


<script>

/* ==================================================
   GET URL PARAMETERS
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

let videoURL =
    params.get("video");

let movieTitle =
    params.get("title") ||
    "Untitled";


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById("video");

const videoContainer =
    document.getElementById("videoContainer");

const movieTitleElement =
    document.getElementById("movieTitle");

const playBtn =
    document.getElementById("playBtn");

const backBtn =
    document.getElementById("backBtn");

const forwardBtn =
    document.getElementById("forwardBtn");

const muteBtn =
    document.getElementById("muteBtn");

const fullscreenBtn =
    document.getElementById("fullscreenBtn");

const volumeSlider =
    document.getElementById("volumeSlider");

const timeline =
    document.getElementById("timeline");

const progress =
    document.getElementById("progress");

const buffer =
    document.getElementById("buffer");

const thumb =
    document.getElementById("thumb");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const speedBtn =
    document.getElementById("speedBtn");

const speedMenu =
    document.getElementById("speedMenu");

const previewBox =
    document.getElementById("previewBox");

const previewCanvas =
    document.getElementById("previewCanvas");

const previewTime =
    document.getElementById("previewTime");


/* ==================================================
   TITLE
================================================== */

movieTitleElement.textContent =
    movieTitle;


/* ==================================================
   LOAD VIDEO
================================================== */

if (videoURL) {

    video.src = videoURL;

    video.load();

} else {

    movieTitleElement.textContent =
        "No video selected";

}


/* ==================================================
   TIME FORMAT
================================================== */

function formatTime(seconds) {

    if (!isFinite(seconds)) {
        return "0:00";
    }

    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        Math.floor(seconds % 60);

    if (hours > 0) {

        return (
            hours +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );

    }

    return (
        minutes +
        ":" +
        String(secs).padStart(2, "0")
    );
}


/* ==================================================
   PLAY / PAUSE
================================================== */

function togglePlay() {

    if (video.paused) {

        video.play();

    } else {

        video.pause();

    }
}


playBtn.addEventListener(
    "click",
    togglePlay
);


video.addEventListener(
    "play",
    () => {

        playBtn.textContent =
            "❚❚";

    }
);


video.addEventListener(
    "pause",
    () => {

        playBtn.textContent =
            "▶";

    }
);


/* ==================================================
   BACK 10 SEC
================================================== */

backBtn.addEventListener(
    "click",
    () => {

        video.currentTime =
            Math.max(
                0,
                video.currentTime - 10
            );

    }
);


/* ==================================================
   FORWARD 10 SEC
================================================== */

forwardBtn.addEventListener(
    "click",
    () => {

        video.currentTime =
            Math.min(
                video.duration || 0,
                video.currentTime + 10
            );

    }
);


/* ==================================================
   TIMELINE
================================================== */

video.addEventListener(
    "timeupdate",
    () => {

        if (!video.duration) {
            return;
        }

        const percent =
            (
                video.currentTime /
                video.duration
            ) * 100;

        progress.style.width =
            percent + "%";

        thumb.style.left =
            percent + "%";

        currentTime.textContent =
            formatTime(
                video.currentTime
            );

    }
);


video.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                video.duration
            );

    }
);


timeline.addEventListener(
    "click",
    event => {

        if (!video.duration) {
            return;
        }

        const rect =
            timeline.getBoundingClientRect();

        const percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        video.currentTime =
            percent * video.duration;

    }
);


/* ==================================================
   BUFFER
================================================== */

video.addEventListener(
    "progress",
    () => {

        if (
            !video.duration ||
            !video.buffered.length
        ) {
            return;
        }

        const end =
            video.buffered.end(
                video.buffered.length - 1
            );

        const percent =
            (end / video.duration) * 100;

        buffer.style.width =
            Math.min(
                percent,
                100
            ) + "%";

    }
);


/* ==================================================
   VOLUME
================================================== */

volumeSlider.addEventListener(
    "input",
    () => {

        video.volume =
            volumeSlider.value;

        muteBtn.textContent =
            video.volume == 0
            ? "🔇"
            : "🔊";

    }
);


/* ==================================================
   MUTE
================================================== */

muteBtn.addEventListener(
    "click",
    () => {

        video.muted =
            !video.muted;

        muteBtn.textContent =
            video.muted
            ? "🔇"
            : "🔊";

    }
);


/* ==================================================
   FULLSCREEN
================================================== */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await videoContainer.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* ==================================================
   SPEED MENU
================================================== */

speedBtn.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        speedMenu.style.display =
            speedMenu.style.display === "block"
            ? "none"
            : "block";

    }
);


document
.querySelectorAll(
    "#speedMenu button"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                video.playbackRate =
                    parseFloat(
                        button.dataset.speed
                    );

                speedMenu.style.display =
                    "none";

            }
        );

    }
);


/* ==================================================
   CLOSE SPEED MENU
================================================== */

document.addEventListener(
    "click",
    () => {

        speedMenu.style.display =
            "none";

    }
);


/* ==================================================
   PREVIEW VIDEO
================================================== */

let previewVideo = null;


function createPreviewVideo() {

    if (!videoURL) {
        return;
    }

    previewVideo =
        document.createElement("video");

    previewVideo.src =
        videoURL;

    previewVideo.preload =
        "metadata";

    previewVideo.muted =
        true;

    previewVideo.playsInline =
        true;

    previewVideo.style.display =
        "none";

    document.body.appendChild(
        previewVideo
    );
}


createPreviewVideo();


if (previewVideo) {

    previewVideo.addEventListener(
        "seeked",
        () => {

            const ctx =
                previewCanvas.getContext(
                    "2d"
                );

            ctx.clearRect(
                0,
                0,
                previewCanvas.width,
                previewCanvas.height
            );

            ctx.drawImage(
                previewVideo,
                0,
                0,
                previewCanvas.width,
                previewCanvas.height
            );

        }
    );

}


/* ==================================================
   TIMELINE PREVIEW
================================================== */

timeline.addEventListener(
    "mousemove",
    event => {

        if (
            !video.duration ||
            !previewVideo
        ) {
            return;
        }

        const rect =
            timeline.getBoundingClientRect();

        let percent =
            (
                event.clientX -
                rect.left
            ) / rect.width;

        percent =
            Math.max(
                0,
                Math.min(
                    1,
                    percent
                )
            );

        const seconds =
            percent *
            video.duration;

        const previewWidth =
            previewBox.offsetWidth;

        let left =
            event.clientX -
            rect.left -
            previewWidth / 2;

        left =
            Math.max(
                0,
                Math.min(
                    rect.width -
                    previewWidth,
                    left
                )
            );

        previewBox.style.left =
            left + "px";

        previewBox.style.display =
            "block";

        previewTime.textContent =
            formatTime(seconds);

        if (
            previewVideo.readyState >= 2
        ) {

            previewVideo.currentTime =
                seconds;

        }

    }
);


timeline.addEventListener(
    "mouseleave",
    () => {

        previewBox.style.display =
            "none";

    }
);


/* ==================================================
   KEYBOARD CONTROLS
================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        if (
            event.key ===
            "ArrowLeft"
        ) {

            video.currentTime =
                Math.max(
                    0,
                    video.currentTime - 5
                );

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            video.currentTime =
                Math.min(
                    video.duration || 0,
                    video.currentTime + 5
                );

        }


        if (
            event.key.toLowerCase()
            === "f"
        ) {

            fullscreenBtn.click();

        }

    }
);


/* ==================================================
   BACK BUTTON
================================================== */

function goBack() {

    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}


/* ==================================================
   SEASON / EPISODE SYSTEM
================================================== */

/*
    The index page can send episode information
    through the URL.

    Example:

    player.html?
    video=VIDEO_URL
    &title=Breaking%20Bad
    &series=Breaking%20Bad
    &episodes=JSON_DATA
*/

const episodesParameter =
    params.get("episodes");

const episodesContainer =
    document.getElementById(
        "episodesContainer"
    );

const seasonButtons =
    document.getElementById(
        "seasonButtons"
    );

const episodeList =
    document.getElementById(
        "episodeList"
    );


let episodeData = [];

let selectedSeason = 1;


/* ==================================================
   READ EPISODES
================================================== */

if (episodesParameter) {

    try {

        episodeData =
            JSON.parse(
                decodeURIComponent(
                    episodesParameter
                )
            );

    } catch (error) {

        console.log(
            "Episode data error:",
            error
        );

    }

}


/* ==================================================
   DISPLAY SEASONS
================================================== */

function displaySeasons() {

    if (
        !episodeData ||
        episodeData.length === 0
    ) {

        return;

    }

    episodesContainer.style.display =
        "block";

    const seasons =
        [
            ...new Set(
                episodeData.map(
                    episode =>
                        Number(
                            episode.season
                        )
                )
            )
        ]
        .sort(
            (a, b) => a - b
        );


    seasonButtons.innerHTML =
        "";


    seasons.forEach(
        season => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "season-button";

            button.textContent =
                "Season " +
                season;


            if (
                season ===
                selectedSeason
            ) {

                button.classList.add(
                    "active"
                );

            }


            button.onclick =
                () => {

                    selectedSeason =
                        season;

                    displaySeasons();

                };


            seasonButtons.appendChild(
                button
            );

        }
    );


    displayEpisodes();

}


/* ==================================================
   DISPLAY EPISODES
================================================== */

function displayEpisodes() {

    episodeList.innerHTML =
        "";


    const episodes =
        episodeData
        .filter(
            episode =>
                Number(
                    episode.season
                ) ===
                selectedSeason
        )
        .sort(
            (a, b) =>
                Number(a.episode) -
                Number(b.episode)
        );


    episodes.forEach(
        episode => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "episode-button";

            button.textContent =
                "Episode " +
                episode.episode;


            button.onclick =
                () => {

                    const newURL =
                        "player.html" +
                        "?video=" +
                        encodeURIComponent(
                            episode.video
                        ) +
                        "&title=" +
                        encodeURIComponent(
                            episode.title
                        ) +
                        "&episodes=" +
                        encodeURIComponent(
                            JSON.stringify(
                                episodeData
                            )
                        );


                    window.location.href =
                        newURL;

                };


            episodeList.appendChild(
                button
            );

        }
    );

}


displaySeasons();

</script>

</body>
</html>
