<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Now Playing - My Library</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}


/* =========================
   HEADER
========================= */

.header {

    height: 72px;
    width: 100%;

    background: #050505;

    border-bottom: 1px solid #202020;

    display: flex;

    align-items: center;

    padding: 0 35px;

    gap: 25px;

    position: relative;

    z-index: 20;
}


.back-btn {

    background: #080808;

    color: white;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 10px 18px;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}


.back-btn:hover {

    background: #181818;

}


.logo {

    font-size: 20px;

    font-weight: 800;

    letter-spacing: -0.5px;
}


.logo span {

    color: #e50914;
}


/* =========================
   PLAYER PAGE
========================= */

.player-page {

    width: 100%;

    height: 100vh;

    background: #000;

    display: flex;

    flex-direction: column;
}


/* =========================
   PLAYER AREA
========================= */

.player-area {

    width: 100%;

    flex: 1;

    min-height: 0;

    background: #000;

    display: flex;

    justify-content: center;

    align-items: center;

    position: relative;
}


.drive-player {

    width: 100%;

    height: 100%;

    border: none;

    display: block;

    background: #000;
}


/* =========================
   BOTTOM INFORMATION BAR
========================= */

.bottom-bar {

    min-height: 72px;

    background: #050505;

    border-top: 1px solid #181818;

    display: flex;

    align-items: center;

    padding: 10px 35px;

    gap: 18px;

    position: relative;

    z-index: 30;
}


/* =========================
   TITLE
========================= */

.title-area {

    flex: 1;

    min-width: 0;
}


.movie-title {

    font-size: 19px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================
   SERIES CONTROLS
========================= */

.series-controls {

    display: none;

    align-items: center;

    gap: 10px;
}


/* =========================
   SELECTORS
========================= */

.selector {

    position: relative;
}


.selector-button {

    min-width: 145px;

    height: 42px;

    padding: 0 15px;

    background: #111;

    color: white;

    border: 1px solid #333;

    border-radius: 6px;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    font-size: 14px;

    white-space: nowrap;
}


.selector-button:hover {

    background: #1b1b1b;

    border-color: #555;
}


.arrow {

    font-size: 11px;

    color: #aaa;
}


/* =========================
   DROPDOWN
========================= */

.dropdown {

    position: absolute;

    right: 0;

    bottom: calc(100% + 8px);

    min-width: 220px;

    max-height: 300px;

    overflow-y: auto;

    background: #101010;

    border: 1px solid #333;

    border-radius: 7px;

    box-shadow:
        0 10px 30px
        rgba(0, 0, 0, .7);

    display: none;

    z-index: 100;
}


.dropdown.open {

    display: block;
}


.dropdown-item {

    padding: 12px 15px;

    color: #ddd;

    cursor: pointer;

    font-size: 14px;

    border-bottom: 1px solid #1d1d1d;

}


.dropdown-item:last-child {

    border-bottom: none;
}


.dropdown-item:hover {

    background: #222;

    color: white;
}


.dropdown-item.active {

    background: #e50914;

    color: white;
}


/* =========================
   NO EPISODES
========================= */

.no-episodes {

    color: #777;

    padding: 10px 15px;

    font-size: 13px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {

        height: 60px;

        padding: 0 15px;
    }


    .logo {

        font-size: 17px;
    }


    .back-btn {

        padding: 8px 12px;
    }


    .bottom-bar {

        min-height: auto;

        padding: 10px 15px;

        flex-wrap: wrap;

        gap: 10px;
    }


    .title-area {

        width: 100%;

        flex-basis: 100%;

        order: 1;
    }


    .movie-title {

        font-size: 16px;
    }


    .series-controls {

        width: 100%;

        order: 2;

        justify-content: flex-start;
    }


    .selector {

        flex: 1;
    }


    .selector-button {

        width: 100%;

        min-width: 0;

        font-size: 13px;
    }


    .dropdown {

        left: 0;

        right: auto;

        width: 100%;

        max-height: 250px;
    }

}

</style>

</head>


<body>


<div class="player-page">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <button
            class="back-btn"
            onclick="goBack()"
        >
            ← Back
        </button>


        <div class="logo">

            MY <span>LIBRARY</span>

        </div>

    </div>



    <!-- =========================
         DRIVE PLAYER
    ========================== -->

    <div class="player-area">

        <iframe
            id="drivePlayer"
            class="drive-player"
            allow="autoplay; fullscreen"
            allowfullscreen
            frameborder="0"
        ></iframe>

    </div>



    <!-- =========================
         BOTTOM BAR
    ========================== -->

    <div class="bottom-bar">


        <!-- TITLE -->

        <div class="title-area">

            <div
                class="movie-title"
                id="movieTitle"
            >
                Now Playing
            </div>

        </div>



        <!-- SERIES CONTROLS -->

        <div
            class="series-controls"
            id="seriesControls"
        >


            <!-- =====================
                 SEASON
            ====================== -->

            <div
                class="selector"
                id="seasonSelector"
            >

                <button
                    class="selector-button"
                    id="seasonButton"
                    onclick="toggleSeasonDropdown()"
                >

                    <span id="seasonButtonText">
                        Season 1
                    </span>

                    <span class="arrow">
                        ▲
                    </span>

                </button>


                <div
                    class="dropdown"
                    id="seasonDropdown"
                ></div>

            </div>



            <!-- =====================
                 EPISODE
            ====================== -->

            <div
                class="selector"
                id="episodeSelector"
            >

                <button
                    class="selector-button"
                    id="episodeButton"
                    onclick="toggleEpisodeDropdown()"
                >

                    <span id="episodeButtonText">
                        Episode 1
                    </span>

                    <span class="arrow">
                        ▲
                    </span>

                </button>


                <div
                    class="dropdown"
                    id="episodeDropdown"
                ></div>

            </div>


        </div>


    </div>


</div>



<script>


/* ==================================================
   URL PARAMETERS
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const type =
    params.get("type") ||
    "movie";


const title =
    params.get("title") ||
    "Now Playing";


const videoURL =
    params.get("video") ||
    params.get("src") ||
    "";


const seriesName =
    params.get("series") ||
    title;



/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */


/*
   USE THE SAME API KEY
   YOU USE IN index.html.
*/

const GOOGLE_API_KEY =
    "i'll paste my api key here";



/*
   SAME WEB SERIES FOLDER
   USED BY index.html.
*/

const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";



/* ==================================================
   ELEMENTS
================================================== */

const drivePlayer =
    document.getElementById(
        "drivePlayer"
    );


const movieTitle =
    document.getElementById(
        "movieTitle"
    );


const seriesControls =
    document.getElementById(
        "seriesControls"
    );


const seasonButtonText =
    document.getElementById(
        "seasonButtonText"
    );


const episodeButtonText =
    document.getElementById(
        "episodeButtonText"
    );


const seasonDropdown =
    document.getElementById(
        "seasonDropdown"
    );


const episodeDropdown =
    document.getElementById(
        "episodeDropdown"
    );



/* ==================================================
   SERIES DATA
================================================== */

let allEpisodes = [];

let seasons = {};

let currentSeason = 1;

let currentEpisode = 1;



/* ==================================================
   CLEAN FILE NAME
================================================== */

function cleanName(name) {

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /\./g,
            " "
        )

        .replace(
            /_/g,
            " "
        )

        .trim();

}



/* ==================================================
   NORMALIZE NAME
================================================== */

function normalizeName(name) {

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* ==================================================
   GET SERIES NAME
================================================== */

function getSeriesName(
    filename
) {

    let name =
        cleanName(
            filename
        );


    /*
       Find:

       S01E01
       S01EP01
       S02E05
       S02EP05
    */

    const match =
        name.match(
            /\bS\d{1,2}\s*E(?:P)?\s*\d{1,3}\b/i
        );


    if (match) {

        name =
            name.substring(
                0,
                match.index
            )
            .trim();

    }


    /*
       Your example:

       Bhay Test S01EP02

       should belong to:

       Bhay
    */

    name =
        name.replace(
            /\s+test$/i,
            ""
        )
        .trim();


    return name;

}



/* ==================================================
   GET SEASON / EPISODE
================================================== */

function getEpisodeInfo(
    filename
) {

    const name =
        cleanName(
            filename
        );


    const match =
        name.match(
            /\bS(\d{1,2})\s*E(?:P)?\s*(\d{1,3})\b/i
        );


    if (!match) {

        return null;

    }


    return {

        season:
            parseInt(
                match[1],
                10
            ),

        episode:
            parseInt(
                match[2],
                10
            )

    };

}



/* ==================================================
   GET EPISODE TITLE
================================================== */

function getEpisodeTitle(
    filename,
    series
) {

    let name =
        cleanName(
            filename
        );


    /*
       Remove the series name
       from the beginning.
    */

    const seriesRegex =
        new RegExp(
            "^" +
            series.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            ) +
            "\\s*",
            "i"
        );


    name =
        name.replace(
            seriesRegex,
            ""
        );


    /*
       Remove S01EP01 / S01E01
    */

    name =
        name.replace(
            /\bS\d{1,2}\s*E(?:P)?\s*\d{1,3}\b/i,
            ""
        )
        .trim();


    /*
       Remove the special "Test"
       word from your example.
    */

    name =
        name.replace(
            /^test\s*/i,
            ""
        )
        .trim();


    /*
       If there is no extra name,
       use Episode X.
    */

    if (!name) {

        const info =
            getEpisodeInfo(
                filename
            );


        return (
            "Episode " +
            (
                info
                ? info.episode
                : 1
            )
        );

    }


    return name;

}



/* ==================================================
   GET DRIVE FILES
================================================== */

async function getDriveFiles() {


    const query =
        `'${SERIES_FOLDER}' in parents and trashed = false`;


    const fields =
        "files(id,name,mimeType,size,modifiedTime)";


    const url =
        "https://www.googleapis.com/drive/v3/files"
        +
        "?q="
        +
        encodeURIComponent(
            query
        )
        +
        "&fields="
        +
        encodeURIComponent(
            fields
        )
        +
        "&pageSize=1000"
        +
        "&orderBy=name"
        +
        "&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(
            url
        );


    if (!response.ok) {

        throw new Error(
            "Google Drive API error: "
            +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];

}



/* ==================================================
   BUILD EPISODE LIST
================================================== */

function buildEpisodeList(
    files
) {


    allEpisodes = [];


    files.forEach(
        function(file) {


            if (
                file.mimeType ===
                "application/vnd.google-apps.folder"
            ) {

                return;

            }


            const info =
                getEpisodeInfo(
                    file.name
                );


            if (!info) {

                return;

            }


            const fileSeries =
                getSeriesName(
                    file.name
                );


            if (
                normalizeName(
                    fileSeries
                ) !==
                normalizeName(
                    seriesName
                )
            ) {

                return;

            }


            allEpisodes.push({

                file:
                    file,

                season:
                    info.season,

                episode:
                    info.episode,

                title:
                    getEpisodeTitle(
                        file.name,
                        seriesName
                    )

            });

        }
    );


    /*
       Sort:

       Season 1
       Episode 1
       Episode 2
       Episode 3

       then Season 2...
    */

    allEpisodes.sort(
        function(a, b) {

            if (
                a.season !==
                b.season
            ) {

                return (
                    a.season -
                    b.season
                );

            }


            return (
                a.episode -
                b.episode
            );

        }
    );


    /*
       Create season groups.
    */

    seasons = {};


    allEpisodes.forEach(
        function(item) {

            if (
                !seasons[
                    item.season
                ]
            ) {

                seasons[
                    item.season
                ] = [];

            }


            seasons[
                item.season
            ].push(
                item
            );

        }
    );

}



/* ==================================================
   GET VIDEO URL
================================================== */

function getVideoURL(
    file
) {

    return (
        "https://www.googleapis.com/drive/v3/files/"
        +
        file.id
        +
        "?alt=media&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        )
    );

}



/* ==================================================
   CREATE DRIVE PLAYER URL
================================================== */

function getDrivePlayerURL(
    url
) {


    /*
       Drive preview URL
    */

    if (
        url.includes(
            "drive.google.com/file/d/"
        )
    ) {

        const match =
            url.match(
                /drive\.google\.com\/file\/d\/([^/]+)/
            );


        if (
            match &&
            match[1]
        ) {

            return (
                "https://drive.google.com/file/d/" +
                match[1] +
                "/preview"
            );

        }

    }



    /*
       Google Drive API URL
    */

    if (
        url.includes(
            "googleapis.com/drive/v3/files/"
        )
    ) {

        const match =
            url.match(
                /drive\/v3\/files\/([^/?]+)/
            );


        if (
            match &&
            match[1]
        ) {

            return (
                "https://drive.google.com/file/d/" +
                match[1] +
                "/preview"
            );

        }

    }



    /*
       Plain file ID
    */

    if (
        /^[a-zA-Z0-9_-]+$/.test(
            url
        )
    ) {

        return (
            "https://drive.google.com/file/d/" +
            url +
            "/preview"
        );

    }


    return url;

}



/* ==================================================
   LOAD VIDEO
================================================== */

function loadVideo(
    file
) {


    const url =
        getDrivePlayerURL(
            getVideoURL(
                file
            )
        );


    drivePlayer.src =
        url;

}



/* ==================================================
   UPDATE TITLE
================================================== */

function updateTitle(
    item
) {


    movieTitle.textContent =
        item.title
        +
        " - Season "
        +
        item.season
        +
        " - Episode "
        +
        item.episode;


    document.title =
        movieTitle.textContent
        +
        " - My Library";


    seasonButtonText.textContent =
        "Season "
        +
        item.season;


    episodeButtonText.textContent =
        "Episode "
        +
        item.episode;

}



/* ==================================================
   PLAY EPISODE
================================================== */

function playEpisode(
    item
) {


    currentSeason =
        item.season;


    currentEpisode =
        item.episode;


    loadVideo(
        item.file
    );


    updateTitle(
        item
    );


    renderEpisodeDropdown();


    closeDropdowns();

}



/* ==================================================
   FIND EPISODE
================================================== */

function findEpisode(
    season,
    episode
) {


    const list =
        seasons[
            season
        ] || [];


    return list.find(
        function(item) {

            return (
                item.episode ===
                episode
            );

        }
    );

}



/* ==================================================
   RENDER SEASON DROPDOWN
================================================== */

function renderSeasonDropdown() {


    seasonDropdown.innerHTML =
        "";


    const seasonNumbers =
        Object.keys(
            seasons
        )
        .map(
            Number
        )
        .sort(
            function(a, b) {

                return a - b;

            }
        );


    if (
        seasonNumbers.length === 0
    ) {

        seasonDropdown.innerHTML =
            '<div class="no-episodes">' +
            'No seasons found' +
            '</div>';

        return;

    }


    seasonNumbers.forEach(
        function(season) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "dropdown-item";


            if (
                season ===
                currentSeason
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.textContent =
                "Season " +
                season;


            item.onclick =
                function() {


                    currentSeason =
                        season;


                    /*
                       When changing season,
                       automatically select
                       the first episode.
                    */

                    const firstEpisode =
                        seasons[
                            season
                        ][0];


                    if (
                        firstEpisode
                    ) {

                        playEpisode(
                            firstEpisode
                        );

                    }

                };


            seasonDropdown.appendChild(
                item
            );

        }
    );

}



/* ==================================================
   RENDER EPISODE DROPDOWN
================================================== */

function renderEpisodeDropdown() {


    episodeDropdown.innerHTML =
        "";


    const list =
        seasons[
            currentSeason
        ] || [];


    if (
        list.length === 0
    ) {

        episodeDropdown.innerHTML =
            '<div class="no-episodes">' +
            'No episodes found' +
            '</div>';

        return;

    }


    list.forEach(
        function(item) {


            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "dropdown-item";


            if (
                item.episode ===
                currentEpisode
            ) {

                element.classList.add(
                    "active"
                );

            }


            element.textContent =
                "Episode " +
                item.episode
                +
                " — "
                +
                item.title;


            element.onclick =
                function() {

                    playEpisode(
                        item
                    );

                };


            episodeDropdown.appendChild(
                element
            );

        }
    );

}



/* ==================================================
   TOGGLE SEASON
================================================== */

function toggleSeasonDropdown() {


    episodeDropdown.classList.remove(
        "open"
    );


    renderSeasonDropdown();


    seasonDropdown.classList.toggle(
        "open"
    );

}



/* ==================================================
   TOGGLE EPISODE
================================================== */

function toggleEpisodeDropdown() {


    seasonDropdown.classList.remove(
        "open"
    );


    renderEpisodeDropdown();


    episodeDropdown.classList.toggle(
        "open"
    );

}



/* ==================================================
   CLOSE DROPDOWNS
================================================== */

function closeDropdowns() {

    seasonDropdown.classList.remove(
        "open"
    );


    episodeDropdown.classList.remove(
        "open"
    );

}



/* ==================================================
   CLICK OUTSIDE
================================================== */

document.addEventListener(
    "click",
    function(event) {


        const clickedInsideSeason =
            document
                .getElementById(
                    "seasonSelector"
                )
                .contains(
                    event.target
                );


        const clickedInsideEpisode =
            document
                .getElementById(
                    "episodeSelector"
                )
                .contains(
                    event.target
                );


        if (
            !clickedInsideSeason &&
            !clickedInsideEpisode
        ) {

            closeDropdowns();

        }

    }
);



/* ==================================================
   LOAD SERIES
================================================== */

async function loadSeries() {


    try {


        const files =
            await getDriveFiles();


        buildEpisodeList(
            files
        );


        seriesControls.style.display =
            "flex";


        renderSeasonDropdown();


        renderEpisodeDropdown();


        /*
           Start with:

           Season 1
           Episode 1

           if it exists.
        */

        const firstSeason =
            Object.keys(
                seasons
            )
            .map(
                Number
            )
            .sort(
                function(a, b) {

                    return a - b;

                }
            )[0];


        if (
            firstSeason === undefined
        ) {

            movieTitle.textContent =
                seriesName;

            return;

        }


        const firstEpisode =
            seasons[
                firstSeason
            ][0];


        playEpisode(
            firstEpisode
        );


    } catch (error) {


        console.error(
            error
        );


        movieTitle.textContent =
            "Unable to load series";


    }

}



/* ==================================================
   LOAD MOVIE
================================================== */

function loadMovie() {


    movieTitle.textContent =
        title;


    document.title =
        title
        +
        " - My Library";


    if (
        videoURL
    ) {

        drivePlayer.src =
            getDrivePlayerURL(
                videoURL
            );

    } else {

        drivePlayer.src =
            "about:blank";

        movieTitle.textContent =
            "Unable to load video";

    }

}



/* ==================================================
   BACK BUTTON
================================================== */

function goBack() {


    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}



/* ==================================================
   START
================================================== */

if (
    type ===
    "series"
) {

    loadSeries();

} else {

    loadMovie();

}

</script>

</body>

</html>
