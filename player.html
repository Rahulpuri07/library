<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Now Playing - My Library</title>


<style>

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #000;
    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    overflow-x: hidden;

}


/* =========================
   HEADER
========================= */

.header {

    height: 72px;

    width: 100%;

    background: #050505;

    border-bottom: 1px solid #202020;

    display: flex;

    align-items: center;

    padding: 0 35px;

    gap: 25px;

    position: sticky;

    top: 0;

    z-index: 100;

}


.back-btn {

    background: #080808;

    color: white;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 10px 18px;

    font-size: 15px;

    cursor: pointer;

}


.back-btn:hover {

    background: #181818;

}


.logo {

    font-size: 20px;

    font-weight: 800;

}


.logo span {

    color: #e50914;

}


/* =========================
   PLAYER
========================= */

.player-area {

    width: 100%;

    height: calc(100vh - 72px);

    min-height: 500px;

    background: #000;

    position: relative;

}


.drive-player {

    width: 100%;

    height: 100%;

    border: none;

    display: block;

    background: #000;

}


/* =========================
   SERIES CONTROLS
========================= */

.series-controls {

    display: none;

    background: #080808;

    border-top: 1px solid #222;

    border-bottom: 1px solid #222;

    padding: 18px 35px;

}


.series-controls.show {

    display: block;

}


.selector-row {

    display: flex;

    align-items: center;

    gap: 12px;

    flex-wrap: wrap;

}


.selector {

    background: #151515;

    color: white;

    border: 1px solid #333;

    border-radius: 6px;

    padding: 11px 16px;

    font-size: 14px;

    cursor: pointer;

}


.selector:hover {

    background: #202020;

}


.selector.active {

    border-color: #e50914;

}


/* =========================
   SEASON LIST
========================= */

.season-list {

    max-height: 0;

    overflow: hidden;

    opacity: 0;

    transition:
        max-height .35s ease,
        opacity .25s ease;

}


.season-list.open {

    max-height: 300px;

    opacity: 1;

    margin-top: 15px;

    overflow-y: auto;

}


.season-item {

    display: block;

    width: 100%;

    background: #111;

    border: 1px solid #222;

    color: white;

    padding: 13px 15px;

    margin-bottom: 7px;

    border-radius: 5px;

    cursor: pointer;

    text-align: left;

    font-size: 14px;

}


.season-item:hover {

    background: #1c1c1c;

}


.season-item.active {

    background: #1b1b1b;

    border-color: #e50914;

}


/* =========================
   EPISODE LIST
========================= */

.episode-list {

    max-height: 0;

    overflow: hidden;

    opacity: 0;

    transition:
        max-height .35s ease,
        opacity .25s ease;

}


.episode-list.open {

    max-height: 500px;

    opacity: 1;

    margin-top: 15px;

    overflow-y: auto;

}


.episode-item {

    display: flex;

    align-items: center;

    gap: 15px;

    width: 100%;

    background: #111;

    border: 1px solid #222;

    color: white;

    padding: 13px 15px;

    margin-bottom: 7px;

    border-radius: 5px;

    cursor: pointer;

    text-align: left;

}


.episode-item:hover {

    background: #1c1c1c;

}


.episode-item.active {

    background: #1b1b1b;

    border-color: #e50914;

}


.episode-number {

    color: #999;

    min-width: 65px;

    font-size: 13px;

}


.episode-name {

    font-size: 14px;

    font-weight: 600;

}


/* =========================
   TITLE
========================= */

.movie-title {

    min-height: 58px;

    padding: 17px 35px;

    background: #000;

    font-size: 20px;

    font-weight: 700;

    border-top: 1px solid #111;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* =========================
   MESSAGE
========================= */

.message {

    padding: 25px 35px;

    color: #777;

    background: #000;

}


.error {

    color: #e50914;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {

        height: 60px;

        padding: 0 15px;

    }


    .logo {

        font-size: 17px;

    }


    .back-btn {

        padding: 8px 12px;

    }


    .player-area {

        height: 55vh;

        min-height: 250px;

    }


    .series-controls {

        padding: 15px;

    }


    .movie-title {

        padding: 13px 15px;

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ← Back
    </button>


    <div class="logo">

        MY <span>LIBRARY</span>

    </div>

</header>



<!-- =========================
     PLAYER
========================= -->

<div class="player-area">

    <iframe
        id="drivePlayer"
        class="drive-player"
        allow="autoplay; fullscreen"
        allowfullscreen
        frameborder="0"
    ></iframe>

</div>



<!-- =========================
     SERIES CONTROLS
========================= -->

<div
    class="series-controls"
    id="seriesControls"
>

    <div class="selector-row">

        <!-- SEASON BUTTON -->

        <button
            class="selector"
            id="seasonButton"
        >
            Season 1 ▾
        </button>


        <!-- EPISODE BUTTON -->

        <button
            class="selector"
            id="episodeButton"
        >
            Episodes ▾
        </button>

    </div>


    <!-- SEASON LIST -->

    <div
        class="season-list"
        id="seasonList"
    ></div>


    <!-- EPISODE LIST -->

    <div
        class="episode-list"
        id="episodeList"
    ></div>

</div>



<!-- =========================
     TITLE
========================= -->

<div
    class="movie-title"
    id="movieTitle"
>
    Now Playing
</div>



<script>


/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */

const GOOGLE_API_KEY =
    "AIzaSyCX2HgwFLIgtOYw66bJh010TPIn3ibJ80w";


const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";



/* ==================================================
   URL PARAMETERS
================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const type =
    params.get("type") || "movie";


const seriesName =
    params.get("series") || "";


const videoURL =
    params.get("video") || "";


const originalTitle =
    params.get("title") ||
    "Now Playing";



/* ==================================================
   ELEMENTS
================================================== */

const drivePlayer =
    document.getElementById(
        "drivePlayer"
    );


const movieTitle =
    document.getElementById(
        "movieTitle"
    );


const seriesControls =
    document.getElementById(
        "seriesControls"
    );


const episodeButton =
    document.getElementById(
        "episodeButton"
    );


const episodeList =
    document.getElementById(
        "episodeList"
    );


const seasonButton =
    document.getElementById(
        "seasonButton"
    );


const seasonList =
    document.getElementById(
        "seasonList"
    );



/* ==================================================
   DATA
================================================== */

let seriesEpisodes = [];

let currentEpisode = null;

let currentSeason = 1;



/* ==================================================
   CLEAN NAME
================================================== */

function cleanName(name) {

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /\./g,
            " "
        )

        .replace(
            /_/g,
            " "
        )

        .trim();

}



/* ==================================================
   GET DRIVE FILES
================================================== */

async function getDriveFiles() {


    const query =
        `'${SERIES_FOLDER}' in parents and trashed = false`;


    const url =
        "https://www.googleapis.com/drive/v3/files"
        +
        "?q="
        +
        encodeURIComponent(query)
        +
        "&fields="
        +
        encodeURIComponent(
            "files(id,name,mimeType,size)"
        )
        +
        "&pageSize=1000"
        +
        "&orderBy=name"
        +
        "&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Google Drive API error: " +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];

}



/* ==================================================
   EXTRACT SEASON
================================================== */

function getSeason(fileName) {

    /*
       Supports:

       S01
       S1
       Season 1
       season1
       Season01
    */

    let match =
        fileName.match(
            /S(?:EASON)?\s*0*(\d+)/i
        );


    if (match) {

        return parseInt(
            match[1],
            10
        );

    }


    match =
        fileName.match(
            /SEASON\s*0*(\d+)/i
        );


    if (match) {

        return parseInt(
            match[1],
            10
        );

    }


    return 1;

}



/* ==================================================
   EXTRACT EPISODE NUMBER
================================================== */

function getEpisodeNumber(fileName) {

    /*
       Supports:

       EP01
       EP1
       Episode 1
       Episode01
    */

    let match =
        fileName.match(
            /EP(?:ISODE)?\s*0*(\d+)/i
        );


    if (match) {

        return parseInt(
            match[1],
            10
        );

    }


    return 0;

}



/* ==================================================
   EXTRACT EPISODE NAME
================================================== */

function getEpisodeName(fileName) {


    let name =
        cleanName(
            fileName
        );


    /*
       Remove the series name
    */

    if (seriesName) {

        const escapedSeries =
            seriesName.replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );


        name =
            name.replace(
                new RegExp(
                    "^" +
                    escapedSeries +
                    "\\s*",
                    "i"
                ),
                ""
            );

    }


    /*
       Remove season/episode information.

       Supports:

       S01EP01
       S1EP1
       Season 1 Episode 1
       season2
       episode2
    */

    name =
        name.replace(
            /\bS\d+\s*EP\d+\b/i,
            ""
        );


    name =
        name.replace(
            /\bSEASON\s*\d+\s*EPISODE\s*\d+\b/i,
            ""
        );


    name =
        name.replace(
            /\bSEASON\s*\d+\b/i,
            ""
        );


    name =
        name.replace(
            /\bEPISODE\s*\d+\b/i,
            ""
        );


    name =
        name

            .replace(
                /\s+/g,
                " "
            )

            .trim();


    /*
       If there is no custom episode name,
       use Episode X.
    */

    if (!name) {

        const ep =
            getEpisodeNumber(
                fileName
            );


        if (ep > 0) {

            return "Episode " + ep;

        }


        return "Episode";

    }


    return name;

}



/* ==================================================
   GET DRIVE PLAYER URL
================================================== */

function getDrivePlayerURL(
    file
) {

    return (
        "https://drive.google.com/file/d/"
        +
        file.id
        +
        "/preview"
    );

}



/* ==================================================
   UPDATE TITLE
================================================== */

function updateTitle(
    episode
) {

    const season =
        getSeason(
            episode.name
        );


    const episodeName =
        getEpisodeName(
            episode.name
        );


    /*
       NEW FORMAT:

       Bhay - Season 1 - Chintu Badmash

       No "Episode 1" at the end.
    */

    movieTitle.textContent =
        seriesName
        +
        " - Season "
        +
        season
        +
        " - "
        +
        episodeName;


    document.title =
        seriesName
        +
        " - Season "
        +
        season
        +
        " - "
        +
        episodeName
        +
        " - My Library";

}



/* ==================================================
   LOAD EPISODE
================================================== */

function loadEpisode(
    episode
) {


    currentEpisode =
        episode;


    currentSeason =
        getSeason(
            episode.name
        );


    /*
       SAME GOOGLE DRIVE PLAYER.

       Nothing else is added.
    */

    drivePlayer.src =
        getDrivePlayerURL(
            episode
        );


    seasonButton.textContent =
        "Season "
        +
        currentSeason
        +
        " ▾";


    updateTitle(
        episode
    );


    updateActiveEpisode();

    updateActiveSeason();

}



/* ==================================================
   UPDATE ACTIVE EPISODE
================================================== */

function updateActiveEpisode() {


    const buttons =
        episodeList.querySelectorAll(
            ".episode-item"
        );


    buttons.forEach(
        function(button) {


            if (
                currentEpisode &&
                button.dataset.id ===
                currentEpisode.id
            ) {

                button.classList.add(
                    "active"
                );

            } else {

                button.classList.remove(
                    "active"
                );

            }

        }
    );

}



/* ==================================================
   UPDATE ACTIVE SEASON
================================================== */

function updateActiveSeason() {


    const buttons =
        seasonList.querySelectorAll(
            ".season-item"
        );


    buttons.forEach(
        function(button) {


            if (
                parseInt(
                    button.dataset.season,
                    10
                ) ===
                currentSeason
            ) {

                button.classList.add(
                    "active"
                );

            } else {

                button.classList.remove(
                    "active"
                );

            }

        }
    );

}



/* ==================================================
   DISPLAY EPISODES
================================================== */

function displayEpisodes(
    episodes
) {


    episodeList.innerHTML =
        "";


    episodes.forEach(
        function(
            episode
        ) {


            const number =
                getEpisodeNumber(
                    episode.name
                );


            const name =
                getEpisodeName(
                    episode.name
                );


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "episode-item";


            button.dataset.id =
                episode.id;


            const numberDiv =
                document.createElement(
                    "div"
                );


            numberDiv.className =
                "episode-number";


            numberDiv.textContent =
                "Episode " +
                number;


            const nameDiv =
                document.createElement(
                    "div"
                );


            nameDiv.className =
                "episode-name";


            nameDiv.textContent =
                name;


            button.appendChild(
                numberDiv
            );


            button.appendChild(
                nameDiv
            );


            button.onclick =
                function() {

                    loadEpisode(
                        episode
                    );


                    episodeList.classList.remove(
                        "open"
                    );


                    episodeButton.textContent =
                        "Episodes ▾";

                };


            episodeList.appendChild(
                button
            );

        }
    );


    updateActiveEpisode();

}



/* ==================================================
   DISPLAY SEASONS
================================================== */

function displaySeasons() {


    seasonList.innerHTML =
        "";


    /*
       Find every unique season.
    */

    const seasons =
        [
            ...
            new Set(
                seriesEpisodes.map(
                    function(episode) {

                        return getSeason(
                            episode.name
                        );

                    }
                )
            )
        ]
        .sort(
            function(a, b) {

                return a - b;

            }
        );


    seasons.forEach(
        function(season) {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "season-item";


            button.dataset.season =
                season;


            button.textContent =
                "Season " +
                season;


            button.onclick =
                function() {


                    currentSeason =
                        season;


                    seasonButton.textContent =
                        "Season " +
                        season +
                        " ▾";


                    /*
                       Get episodes belonging
                       to selected season.
                    */

                    const seasonEpisodes =
                        seriesEpisodes.filter(
                            function(episode) {

                                return (
                                    getSeason(
                                        episode.name
                                    ) ===
                                    season
                                );

                            }
                        );


                    displayEpisodes(
                        seasonEpisodes
                    );


                    /*
                       Close season list.
                    */

                    seasonList.classList.remove(
                        "open"
                    );


                    /*
                       Close episode list too.
                    */

                    episodeList.classList.remove(
                        "open"
                    );


                    episodeButton.textContent =
                        "Episodes ▾";


                    updateActiveSeason();

                };


            seasonList.appendChild(
                button
            );

        }
    );


    updateActiveSeason();

}



/* ==================================================
   LOAD SERIES
================================================== */

async function loadSeries() {


    seriesControls.classList.add(
        "show"
    );


    movieTitle.textContent =
        "Loading " +
        seriesName +
        "...";


    try {


        const files =
            await getDriveFiles();


        /*
           Only video files
        */

        seriesEpisodes =
            files.filter(
                function(file) {

                    return (
                        file.mimeType &&
                        file.mimeType.startsWith(
                            "video/"
                        ) &&
                        cleanName(
                            file.name
                        )
                        .toLowerCase()
                        .startsWith(
                            seriesName.toLowerCase()
                        )
                    );

                }
            );


        /*
           Sort by season and episode
        */

        seriesEpisodes.sort(
            function(a, b) {


                const seasonA =
                    getSeason(
                        a.name
                    );


                const seasonB =
                    getSeason(
                        b.name
                    );


                if (
                    seasonA !==
                    seasonB
                ) {

                    return (
                        seasonA -
                        seasonB
                    );

                }


                return (
                    getEpisodeNumber(
                        a.name
                    )
                    -
                    getEpisodeNumber(
                        b.name
                    )
                );

            }
        );


        if (
            seriesEpisodes.length === 0
        ) {

            movieTitle.textContent =
                "No episodes found for " +
                seriesName;

            return;

        }


        /*
           CREATE SEASON LIST
        */

        displaySeasons();


        /*
           Show first available season
        */

        const firstEpisode =
            seriesEpisodes[0];


        const firstSeason =
            getSeason(
                firstEpisode.name
            );


        currentSeason =
            firstSeason;


        seasonButton.textContent =
            "Season " +
            firstSeason +
            " ▾";


        /*
           Display episodes from
           the first season.
        */

        const seasonEpisodes =
            seriesEpisodes.filter(
                function(episode) {

                    return (
                        getSeason(
                            episode.name
                        ) ===
                        firstSeason
                    );

                }
            );


        displayEpisodes(
            seasonEpisodes
        );


        /*
           Automatically play first episode.
        */

        loadEpisode(
            firstEpisode
        );


    } catch (error) {


        console.error(
            error
        );


        movieTitle.textContent =
            "Unable to load series";


    }

}



/* ==================================================
   SEASON BUTTON
================================================== */

seasonButton.onclick =
    function() {


        const isOpen =
            seasonList.classList.contains(
                "open"
            );


        if (isOpen) {

            seasonList.classList.remove(
                "open"
            );


            seasonButton.textContent =
                "Season " +
                currentSeason +
                " ▾";


        } else {

            /*
               Close episode list
            */

            episodeList.classList.remove(
                "open"
            );


            episodeButton.textContent =
                "Episodes ▾";


            /*
               Open season list
            */

            seasonList.classList.add(
                "open"
            );


            seasonButton.textContent =
                "Season " +
                currentSeason +
                " ▴";

        }

    };



/* ==================================================
   EPISODE BUTTON
================================================== */

episodeButton.onclick =
    function() {


        const isOpen =
            episodeList.classList.contains(
                "open"
            );


        if (isOpen) {

            episodeList.classList.remove(
                "open"
            );


            episodeButton.textContent =
                "Episodes ▾";


        } else {

            /*
               Close season list
            */

            seasonList.classList.remove(
                "open"
            );


            seasonButton.textContent =
                "Season " +
                currentSeason +
                " ▾";


            /*
               Open episode list
            */

            episodeList.classList.add(
                "open"
            );


            episodeButton.textContent =
                "Episodes ▴";

        }

    };



/* ==================================================
   BACK
================================================== */

function goBack() {


    if (
        document.referrer &&
        document.referrer !==
        window.location.href
    ) {

        history.back();

    } else {

        window.location.href =
            "index.html";

    }

}



/* ==================================================
   START
================================================== */

if (
    type === "series" &&
    seriesName
) {

    loadSeries();

} else if (videoURL) {


    /*
       Movie player
    */

    let movieFileId = "";


    const match =
        videoURL.match(
            /drive\/v3\/files\/([^/?]+)/
        );


    if (match) {

        movieFileId =
            match[1];

    }


    if (movieFileId) {

        drivePlayer.src =
            "https://drive.google.com/file/d/"
            +
            movieFileId
            +
            "/preview";

    } else {

        drivePlayer.src =
            videoURL;

    }


    movieTitle.textContent =
        originalTitle;


    document.title =
        originalTitle +
        " - My Library";

}

</script>

</body>

</html>
