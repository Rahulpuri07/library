<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Now Playing - My Library</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 72px;
            width: 100%;

            background: #050505;
            border-bottom: 1px solid #202020;

            display: flex;
            align-items: center;

            padding: 0 35px;
            gap: 25px;

            position: relative;
            z-index: 10;
        }

        .back-btn {
            background: #080808;
            color: white;

            border: 1px solid #333;
            border-radius: 6px;

            padding: 10px 18px;

            font-size: 15px;
            cursor: pointer;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #181818;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: #e50914;
        }


        /* =========================
           PLAYER PAGE
        ========================= */

        .player-page {
            width: 100%;
            height: 100vh;

            background: #000;

            display: flex;
            flex-direction: column;
        }


        /* =========================
           DRIVE PLAYER
        ========================= */

        .player-area {
            width: 100%;

            flex: 1;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .drive-player {
            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: #000;
        }


        /* =========================
           MOVIE TITLE
        ========================= */

        .movie-title {
            height: 58px;

            padding: 15px 35px;

            background: #000;

            font-size: 20px;
            font-weight: 700;

            border-top: 1px solid #111;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {
                height: 60px;
                padding: 0 15px;
            }

            .logo {
                font-size: 17px;
            }

            .back-btn {
                padding: 8px 12px;
            }

            .movie-title {
                height: 50px;
                padding: 13px 15px;
                font-size: 18px;
            }
        }

    </style>

</head>


<body>

    <div class="player-page">

        <!-- =========================
             HEADER
        ========================== -->

        <div class="header">

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back
            </button>

            <div class="logo">
                MY <span>LIBRARY</span>
            </div>

        </div>


        <!-- =========================
             GOOGLE DRIVE PLAYER
        ========================== -->

        <div class="player-area">

            <iframe
                id="drivePlayer"
                class="drive-player"
                allow="autoplay; fullscreen"
                allowfullscreen
                frameborder="0"
            ></iframe>

        </div>


        <!-- =========================
             TITLE
        ========================== -->

        <div
            class="movie-title"
            id="movieTitle"
        >
            Now Playing
        </div>

    </div>


    <script>

        /* ==========================================
           GET INFORMATION FROM URL
        ========================================== */

        const params =
            new URLSearchParams(
                window.location.search
            );


        const videoURL =
            params.get("video") ||
            params.get("src") ||
            "";


        const title =
            params.get("title") ||
            "Now Playing";


        /* ==========================================
           ELEMENTS
        ========================================== */

        const drivePlayer =
            document.getElementById(
                "drivePlayer"
            );


        const movieTitle =
            document.getElementById(
                "movieTitle"
            );


        /* ==========================================
           SET TITLE
        ========================================== */

        movieTitle.textContent =
            title;

        document.title =
            title + " - My Library";


        /* ==========================================
           CREATE GOOGLE DRIVE PLAYER URL
        ========================================== */

        function getDrivePlayerURL(url) {

            /*
               If the URL is already a
               Google Drive preview URL,
               use it directly.
            */

            if (
                url.includes(
                    "drive.google.com/file/d/"
                )
            ) {

                const match =
                    url.match(
                        /drive\.google\.com\/file\/d\/([^/]+)/
                    );

                if (match && match[1]) {

                    return (
                        "https://drive.google.com/file/d/" +
                        match[1] +
                        "/preview"
                    );
                }
            }


            /*
               If our website is currently
               receiving a Google Drive API URL:

               https://www.googleapis.com/drive/v3/files/FILE_ID?...

               extract FILE_ID and convert it
               into the normal Drive player.
            */

            if (
                url.includes(
                    "googleapis.com/drive/v3/files/"
                )
            ) {

                const match =
                    url.match(
                        /drive\/v3\/files\/([^/?]+)/
                    );

                if (match && match[1]) {

                    return (
                        "https://drive.google.com/file/d/" +
                        match[1] +
                        "/preview"
                    );
                }
            }


            /*
               If a plain Drive file ID was
               passed instead.
            */

            if (
                /^[a-zA-Z0-9_-]+$/.test(url)
            ) {

                return (
                    "https://drive.google.com/file/d/" +
                    url +
                    "/preview"
                );
            }


            return url;
        }


        /* ==========================================
           LOAD DRIVE PLAYER
        ========================================== */

        const driveURL =
            getDrivePlayerURL(
                videoURL
            );


        if (driveURL) {

            drivePlayer.src =
                driveURL;

        } else {

            drivePlayer.src =
                "about:blank";

            movieTitle.textContent =
                "Unable to load video";

        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        function goBack() {

            if (
                document.referrer &&
                document.referrer !==
                window.location.href
            ) {

                history.back();

            } else {

                window.location.href =
                    "index.html";

            }

        }

    </script>

</body>

</html>
