<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Library</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    min-height: 72px;

    background: #050505;
    border-bottom: 1px solid #1c1c1c;

    display: flex;
    align-items: center;

    padding: 0 40px;
    gap: 35px;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    white-space: nowrap;
}

.logo span {
    color: #e50914;
}

.nav {
    display: flex;
    gap: 25px;
}

.nav button {
    background: none;
    border: none;

    color: #888;

    font-size: 15px;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    color: #fff;
}

.search-container {
    margin-left: auto;
}

#search {
    width: 260px;
    height: 38px;

    padding: 0 15px;

    border: 1px solid #333;
    border-radius: 5px;

    background: #111;
    color: #fff;

    outline: none;
}

#search::placeholder {
    color: #777;
}

/* HERO */

.hero {
    min-height: 330px;

    padding: 80px 55px 50px;

    display: flex;
    align-items: flex-end;

    background:
        linear-gradient(
            to top,
            #000 0%,
            rgba(0,0,0,0.65) 45%,
            rgba(0,0,0,0.15) 100%
        ),
        radial-gradient(
            circle at 75% 30%,
            #292929,
            #050505 60%,
            #000 100%
        );
}

.hero-content {
    max-width: 700px;
}

.hero h1 {
    margin: 0 0 12px;

    font-size: 42px;
    font-weight: 900;
}

.hero p {
    margin: 0;

    color: #aaa;

    font-size: 15px;
    line-height: 1.6;
}

/* MAIN */

.main {
    padding: 25px 40px 60px;
}

.section {
    margin-bottom: 50px;
}

.section-title {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 18px;
}

.section-title h2 {
    margin: 0;
    font-size: 24px;
}

.section-title span {
    color: #777;
    font-size: 13px;
}

/* GRID */

.movie-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(170px, 1fr)
        );

    gap: 20px;
}

/* CARD */

.movie-card {
    position: relative;

    background: #111;

    border-radius: 6px;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}

.movie-card:hover {
    transform: scale(1.045);

    box-shadow:
        0 12px 35px
        rgba(0,0,0,0.75);

    z-index: 5;
}

.poster {
    width: 100%;

    aspect-ratio: 2 / 3;

    object-fit: cover;

    display: block;

    background: #181818;
}

.play-overlay {
    position: absolute;

    left: 50%;
    top: 42%;

    transform:
        translate(-50%, -50%);

    width: 54px;
    height: 54px;

    border-radius: 50%;

    background: #e50914;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 23px;

    opacity: 0;

    transition: opacity 0.2s ease;
}

.movie-card:hover .play-overlay {
    opacity: 1;
}

.movie-info {
    padding: 11px 12px 13px;
}

.movie-title {
    font-size: 15px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.movie-meta {
    margin-top: 6px;

    color: #777;

    font-size: 12px;
}

/* EMPTY */

.no-results {
    display: none;

    text-align: center;

    padding: 80px 20px;

    color: #777;

    font-size: 16px;
}

/* FOOTER */

.footer {
    text-align: center;

    padding: 30px;

    color: #444;

    border-top: 1px solid #151515;

    font-size: 12px;
}

/* MOBILE */

@media (max-width: 750px) {

    .header {
        padding: 12px 15px;

        flex-wrap: wrap;

        gap: 12px;
    }

    .logo {
        font-size: 21px;
    }

    .nav {
        order: 3;

        width: 100%;

        justify-content: center;

        gap: 30px;
    }

    .search-container {
        margin-left: auto;
    }

    #search {
        width: 180px;
    }

    .hero {
        min-height: 260px;

        padding:
            55px 25px 35px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .main {
        padding:
            20px 15px 50px;
    }

    .movie-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }
}

@media (max-width: 430px) {

    .logo {
        font-size: 19px;
    }

    #search {
        width: 145px;
    }

    .nav {
        gap: 22px;
    }

    .movie-grid {
        gap: 10px;
    }
}

</style>

</head>

<body>


<header class="header">

    <div class="logo">
        MY <span>LIBRARY</span>
    </div>

    <nav class="nav">

        <button
            class="active"
            onclick="showSection('all')">
            Home
        </button>

        <button
            onclick="showSection('movies')">
            Movies
        </button>

        <button
            onclick="showSection('series')">
            Web Series
        </button>

    </nav>

    <div class="search-container">

        <input
            type="text"
            id="search"
            placeholder="Search..."
            autocomplete="off">

    </div>

</header>


<section class="hero">

    <div class="hero-content">

        <h1>
            Welcome to your library.
        </h1>

        <p>
            Your private collection of movies
            and web series — all in one place.
        </p>

    </div>

</section>


<main class="main">


    <!-- MOVIES -->

    <section
        class="section"
        id="moviesSection">

        <div class="section-title">

            <h2>🎬 Movies</h2>

            <span id="movieCount">
                0 titles
            </span>

        </div>

        <div
            class="movie-grid"
            id="moviesGrid">
        </div>

    </section>


    <!-- WEB SERIES -->

    <section
        class="section"
        id="seriesSection">

        <div class="section-title">

            <h2>📺 Web Series</h2>

            <span id="seriesCount">
                0 titles
            </span>

        </div>

        <div
            class="movie-grid"
            id="seriesGrid">
        </div>

    </section>


    <div
        class="no-results"
        id="noResults">

        Nothing found 😶

    </div>

</main>


<footer class="footer">

    My Private Library

</footer>


<script>

/* =====================================================
   MOVIES

   Put DIRECT VIDEO URL here.

   Example:

   video:
   "https://example.com/movie.mp4"

===================================================== */

const movies = [

    {
        title: "Sample Video",

        year: "2026",

        poster:
        "https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=700&q=80",

        video:
        "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
    }

];


/* =====================================================
   WEB SERIES
===================================================== */

const series = [];


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(item) {

    const card =
        document.createElement("div");

    card.className =
        "movie-card";

    card.dataset.title =
        item.title.toLowerCase();


    card.innerHTML = `

        <img
            class="poster"
            src="${item.poster}"
            alt="${item.title}"
            loading="lazy"
        >

        <div class="play-overlay">
            ▶
        </div>

        <div class="movie-info">

            <div class="movie-title">
                ${item.title}
            </div>

            <div class="movie-meta">
                ${item.year || ""}
            </div>

        </div>

    `;


    card.addEventListener(
        "click",
        function() {

            openPlayer(item);

        }
    );


    return card;
}


/* =====================================================
   OPEN PLAYER
===================================================== */

function openPlayer(item) {

    const url =
        "player.html?video=" +
        encodeURIComponent(item.video) +
        "&title=" +
        encodeURIComponent(item.title);

    window.location.href =
        url;
}


/* =====================================================
   LOAD LIBRARY
===================================================== */

function loadLibrary() {

    const moviesGrid =
        document.getElementById(
            "moviesGrid"
        );

    const seriesGrid =
        document.getElementById(
            "seriesGrid"
        );


    moviesGrid.innerHTML = "";

    seriesGrid.innerHTML = "";


    movies.forEach(function(movie) {

        moviesGrid.appendChild(
            createCard(movie)
        );

    });


    series.forEach(function(show) {

        seriesGrid.appendChild(
            createCard(show)
        );

    });


    document.getElementById(
        "movieCount"
    ).textContent =
        movies.length +
        (
            movies.length === 1
                ? " title"
                : " titles"
        );


    document.getElementById(
        "seriesCount"
    ).textContent =
        series.length +
        (
            series.length === 1
                ? " title"
                : " titles"
        );

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
    "input",
    function() {

        const query =
            this.value
            .toLowerCase()
            .trim();


        const cards =
            document.querySelectorAll(
                ".movie-card"
            );


        let visible = 0;


        cards.forEach(function(card) {

            if (
                card.dataset.title
                .includes(query)
            ) {

                card.style.display = "";

                visible++;

            } else {

                card.style.display =
                    "none";

            }

        });


        document.getElementById(
            "noResults"
        ).style.display =
            visible === 0
                ? "block"
                : "none";

    }
);


/* =====================================================
   NAVIGATION
===================================================== */

function showSection(section) {

    const moviesSection =
        document.getElementById(
            "moviesSection"
        );

    const seriesSection =
        document.getElementById(
            "seriesSection"
        );


    const buttons =
        document.querySelectorAll(
            ".nav button"
        );


    buttons.forEach(function(button) {

        button.classList.remove(
            "active"
        );

    });


    if (section === "movies") {

        moviesSection.style.display =
            "block";

        seriesSection.style.display =
            "none";

        buttons[1].classList.add(
            "active"
        );

    }

    else if (section === "series") {

        moviesSection.style.display =
            "none";

        seriesSection.style.display =
            "block";

        buttons[2].classList.add(
            "active"
        );

    }

    else {

        moviesSection.style.display =
            "block";

        seriesSection.style.display =
            "block";

        buttons[0].classList.add(
            "active"
        );

    }

}


/* =====================================================
   START
===================================================== */

loadLibrary();

</script>

</body>

</html>
