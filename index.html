<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Library</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
    height: 72px;
    background: #050505;
    border-bottom: 1px solid #222;

    display: flex;
    align-items: center;

    padding: 0 40px;
    gap: 35px;

    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #e50914;
}

.nav {
    display: flex;
    gap: 25px;
}

.nav button {
    background: none;
    border: none;
    color: #aaa;

    font-size: 15px;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    color: white;
}

.search {
    margin-left: auto;
}

.search input {
    width: 260px;

    padding: 11px 15px;

    background: #151515;
    border: 1px solid #333;
    border-radius: 6px;

    color: white;
    outline: none;
}

/* =========================
   MAIN
========================= */

.main {
    padding: 50px 55px 80px;
}

.hero h1 {
    margin: 0 0 15px;

    font-size: 45px;
}

.hero p {
    margin: 0 0 60px;

    color: #888;
}

/* =========================
   SECTION
========================= */

.section {
    margin-bottom: 60px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.section-title {
    font-size: 25px;
    font-weight: 700;
}

.count {
    color: #777;
    font-size: 13px;
}

/* =========================
   GRID
========================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

    gap: 25px;
}

/* =========================
   CARD
========================= */

.card {
    background: #101010;

    border-radius: 7px;

    overflow: hidden;

    cursor: pointer;

    border: 1px solid #191919;

    transition:
        transform .2s,
        background .2s;
}

.card:hover {
    transform: scale(1.035);
    background: #181818;
}

.poster {
    width: 100%;
    height: 270px;

    background:
        linear-gradient(
            135deg,
            #1d1d1d,
            #050505
        );

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;
}

.card-info {
    padding: 14px;
}

.card-title {
    font-size: 15px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-type {
    margin-top: 7px;

    color: #777;
    font-size: 12px;
}

.card-episodes {
    margin-top: 5px;

    color: #aaa;
    font-size: 11px;
}

/* =========================
   LOADING
========================= */

.message {
    color: #777;
    padding: 30px 0;
}

.error {
    color: #e50914;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        padding: 0 15px;
        gap: 15px;
    }

    .logo {
        font-size: 19px;
    }

    .nav {
        gap: 10px;
    }

    .search input {
        width: 130px;
    }

    .main {
        padding: 35px 20px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .grid {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 15px;
    }

    .poster {
        height: 220px;
    }
}
</style>
</head>

<body>


<header class="header">

    <div class="logo">
        MY <span>LIBRARY</span>
    </div>


    <nav class="nav">

        <button
            id="homeBtn"
            class="active"
        >
            Home
        </button>

        <button id="moviesBtn">
            Movies
        </button>

        <button id="seriesBtn">
            Web Series
        </button>

    </nav>


    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Search..."
        >

    </div>

</header>



<main class="main">


    <section class="hero">

        <h1>
            Welcome to your library.
        </h1>

        <p>
            Your private collection of movies and web series — all in one place.
        </p>

    </section>



    <!-- =========================
         MOVIES
    ========================== -->

    <section
        class="section"
        id="moviesSection"
    >

        <div class="section-header">

            <div class="section-title">
                🎬 Movies
            </div>

            <div
                class="count"
                id="movieCount"
            >
                Loading...
            </div>

        </div>


        <div
            class="grid"
            id="moviesGrid"
        >

            <div class="message">
                Loading movies...
            </div>

        </div>

    </section>



    <!-- =========================
         WEB SERIES
    ========================== -->

    <section
        class="section"
        id="seriesSection"
    >

        <div class="section-header">

            <div class="section-title">
                📺 Web Series
            </div>

            <div
                class="count"
                id="seriesCount"
            >
                Loading...
            </div>

        </div>


        <div
            class="grid"
            id="seriesGrid"
        >

            <div class="message">
                Loading web series...
            </div>

        </div>

    </section>


</main>



<script>

/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */

const GOOGLE_API_KEY =
    "AIzaSyDj5VSHNGM4z9sR8f_YyZfBZvIwSkOnlfk";


const MOVIES_FOLDER =
    "1yXj9Ih39Omyic_Bf_qf86rta5DYbza7S";


const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";


/* ==================================================
   ELEMENTS
================================================== */

const moviesGrid =
    document.getElementById(
        "moviesGrid"
    );


const seriesGrid =
    document.getElementById(
        "seriesGrid"
    );


const movieCount =
    document.getElementById(
        "movieCount"
    );


const seriesCount =
    document.getElementById(
        "seriesCount"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const moviesSection =
    document.getElementById(
        "moviesSection"
    );


const seriesSection =
    document.getElementById(
        "seriesSection"
    );


let movies = [];

let series = [];


/* ==================================================
   GET DRIVE FILES
================================================== */

async function getDriveFiles(folderId) {

    const query =
        `'${folderId}' in parents and trashed = false`;


    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?q=" +
        encodeURIComponent(query) +
        "&fields=files(id,name,mimeType,size,modifiedTime)" +
        "&pageSize=1000" +
        "&orderBy=name" +
        "&key=" +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Google Drive API error: " +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];
}


/* ==================================================
   CLEAN NAME
================================================== */

function cleanName(name) {

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /[_\.]+/g,
            " "
        )

        .trim();

}


/* ==================================================
   CHECK VIDEO
================================================== */

function isVideo(file) {

    const name =
        file.name.toLowerCase();


    return (

        name.endsWith(".mp4") ||

        name.endsWith(".mkv") ||

        name.endsWith(".webm") ||

        name.endsWith(".mov") ||

        name.endsWith(".m4v") ||

        name.endsWith(".avi")

    );

}


/* ==================================================
   PARSE SEASON / EPISODE
================================================== */

function parseEpisode(file) {

    const name =
        file.name;


    const match =
        name.match(
            /s(\d{1,2})e(\d{1,3})/i
        );


    if (!match) {

        return null;

    }


    const season =
        Number(
            match[1]
        );


    const episode =
        Number(
            match[2]
        );


    let seriesName =
        name.substring(
            0,
            match.index
        );


    seriesName =
        seriesName
            .replace(
                /[\._\-]+$/,
                ""
            )
            .replace(
                /[\._]+/g,
                " "
            )
            .trim();


    return {

        season: season,

        episode: episode,

        seriesName: seriesName,

        file: file

    };

}


/* ==================================================
   DRIVE VIDEO URL
================================================== */

function getVideoURL(file) {

    return (
        "https://www.googleapis.com/drive/v3/files/" +
        file.id +
        "?alt=media&key=" +
        encodeURIComponent(
            GOOGLE_API_KEY
        )
    );

}


/* ==================================================
   CREATE MOVIE CARD
================================================== */

function createMovieCard(file) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const poster =
        document.createElement(
            "div"
        );


    poster.className =
        "poster";


    poster.textContent =
        "🎬";


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "card-info";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "card-title";


    title.textContent =
        cleanName(
            file.name
        );


    const type =
        document.createElement(
            "div"
        );


    type.className =
        "card-type";


    type.textContent =
        "Movie";


    info.appendChild(
        title
    );


    info.appendChild(
        type
    );


    card.appendChild(
        poster
    );


    card.appendChild(
        info
    );


    card.onclick =
        function() {

            const video =
                getVideoURL(
                    file
                );


            const url =
                "player.html" +

                "?video=" +
                encodeURIComponent(
                    video
                ) +

                "&title=" +
                encodeURIComponent(
                    cleanName(
                        file.name
                    )
                );


            window.location.href =
                url;

        };


    return card;
}


/* ==================================================
   CREATE WEB SERIES CARD
================================================== */

function createSeriesCard(
    seriesData
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const poster =
        document.createElement(
            "div"
        );


    poster.className =
        "poster";


    poster.textContent =
        "📺";


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "card-info";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "card-title";


    title.textContent =
        seriesData.name;


    const type =
        document.createElement(
            "div"
        );


    type.className =
        "card-type";


    type.textContent =
        "Web Series";


    const episodeText =
        document.createElement(
            "div"
        );


    episodeText.className =
        "card-episodes";


    episodeText.textContent =
        seriesData.episodes.length +
        " episodes";


    info.appendChild(
        title
    );


    info.appendChild(
        type
    );


    info.appendChild(
        episodeText
    );


    card.appendChild(
        poster
    );


    card.appendChild(
        info
    );


    card.onclick =
        function() {

            openSeries(
                seriesData
            );

        };


    return card;
}


/* ==================================================
   OPEN SERIES
================================================== */

function openSeries(
    seriesData
) {

    const sortedEpisodes =
        seriesData.episodes
            .sort(
                function(a, b) {

                    if (
                        a.season !==
                        b.season
                    ) {

                        return (
                            a.season -
                            b.season
                        );

                    }


                    return (
                        a.episode -
                        b.episode
                    );

                }
            );


    const firstEpisode =
        sortedEpisodes[0];


    const episodeData =
        sortedEpisodes.map(
            function(item) {

                return {

                    season:
                        item.season,

                    episode:
                        item.episode,

                    title:
                        seriesData.name +
                        " - S" +
                        String(
                            item.season
                        ).padStart(
                            2,
                            "0"
                        ) +
                        "E" +
                        String(
                            item.episode
                        ).padStart(
                            2,
                            "0"
                        ),

                    video:
                        getVideoURL(
                            item.file
                        )

                };

            }
        );


    const firstVideo =
        getVideoURL(
            firstEpisode.file
        );


    const url =
        "player.html" +

        "?video=" +
        encodeURIComponent(
            firstVideo
        ) +

        "&title=" +
        encodeURIComponent(
            seriesData.name +
            " - S" +
            String(
                firstEpisode.season
            ).padStart(
                2,
                "0"
            ) +
            "E" +
            String(
                firstEpisode.episode
            ).padStart(
                2,
                "0"
            )
        ) +

        "&episodes=" +
        encodeURIComponent(
            JSON.stringify(
                episodeData
            )
        );


    window.location.href =
        url;

}


/* ==================================================
   BUILD SERIES
================================================== */

function buildSeries(
    files
) {

    const seriesMap =
        {};


    files.forEach(
        function(file) {

            if (!isVideo(file)) {

                return;

            }


            const parsed =
                parseEpisode(
                    file
                );


            if (!parsed) {

                return;

            }


            const key =
                parsed.seriesName
                    .toLowerCase();


            if (
                !seriesMap[key]
            ) {

                seriesMap[key] = {

                    name:
                        parsed.seriesName,

                    episodes: []

                };

            }


            seriesMap[key]
                .episodes
                .push(
                    parsed
                );

        }
    );


    return Object.values(
        seriesMap
    );

}


/* ==================================================
   DISPLAY MOVIES
================================================== */

function displayMovies() {

    moviesGrid.innerHTML =
        "";


    movieCount.textContent =
        movies.length +
        (
            movies.length === 1
            ? " title"
            : " titles"
        );


    if (
        movies.length === 0
    ) {

        moviesGrid.innerHTML =
            '<div class="message">' +
            'No movies yet.' +
            '</div>';

        return;

    }


    movies.forEach(
        function(file) {

            moviesGrid.appendChild(
                createMovieCard(
                    file
                )
            );

        }
    );

}


/* ==================================================
   DISPLAY SERIES
================================================== */

function displaySeries() {

    seriesGrid.innerHTML =
        "";


    seriesCount.textContent =
        series.length +
        (
            series.length === 1
            ? " series"
            : " series"
        );


    if (
        series.length === 0
    ) {

        seriesGrid.innerHTML =
            '<div class="message">' +
            'No web series yet.' +
            '</div>';

        return;

    }


    series.forEach(
        function(item) {

            seriesGrid.appendChild(
                createSeriesCard(
                    item
                )
            );

        }
    );

}


/* ==================================================
   LOAD LIBRARY
================================================== */

async function loadLibrary() {

    try {

        const results =
            await Promise.all([

                getDriveFiles(
                    MOVIES_FOLDER
                ),

                getDriveFiles(
                    SERIES_FOLDER
                )

            ]);


        movies =
            results[0].filter(
                function(file) {

                    return (
                        file.mimeType !==
                        "application/vnd.google-apps.folder"
                    );

                }
            );


        series =
            buildSeries(
                results[1]
            );


        displayMovies();

        displaySeries();


    } catch (error) {

        console.error(
            error
        );


        moviesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load movies.' +
            '</div>';


        seriesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load web series.' +
            '</div>';

    }

}


/* ==================================================
   SEARCH
================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const search =
            searchInput.value
                .toLowerCase()
                .trim();


        const movieCards =
            moviesGrid.querySelectorAll(
                ".card"
            );


        const seriesCards =
            seriesGrid.querySelectorAll(
                ".card"
            );


        movieCards.forEach(
            function(card, index) {

                const name =
                    cleanName(
                        movies[index].name
                    )
                    .toLowerCase();


                card.style.display =
                    name.includes(
                        search
                    )
                    ? ""
                    : "none";

            }
        );


        seriesCards.forEach(
            function(card, index) {

                const name =
                    series[index]
                        .name
                        .toLowerCase();


                card.style.display =
                    name.includes(
                        search
                    )
                    ? ""
                    : "none";

            }
        );

    }
);


/* ==================================================
   NAVIGATION
================================================== */

document
    .getElementById(
        "homeBtn"
    )
    .onclick =
    function() {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };


document
    .getElementById(
        "moviesBtn"
    )
    .onclick =
    function() {

        moviesSection.scrollIntoView({
            behavior: "smooth"
        });

    };


document
    .getElementById(
        "seriesBtn"
    )
    .onclick =
    function() {

        seriesSection.scrollIntoView({
            behavior: "smooth"
        });

    };


/* ==================================================
   START
================================================== */

loadLibrary();

</script>

</body>
</html>
