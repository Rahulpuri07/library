/* ==================================================
   GET FILES FROM GOOGLE DRIVE
================================================== */

async function getDriveFiles(
    folderId,
    fields = "id,name,mimeType,size,modifiedTime"
) {


    const query =
        `'${folderId}' in parents and trashed = false`;


    const url =
        "https://www.googleapis.com/drive/v3/files"
        +
        "?q="
        +
        encodeURIComponent(query)
        +
        "&fields="
        +
        encodeURIComponent(
            "files(" + fields + ")"
        )
        +
        "&pageSize=1000"
        +
        "&orderBy=name"
        +
        "&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Google Drive API error: "
            +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];

}



/* ==================================================
   CLEAN FILE NAME
================================================== */

function cleanName(name) {

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /\./g,
            " "
        )

        .replace(
            /_/g,
            " "
        )

        .trim();

}



/* ==================================================
   NORMALIZE NAME
================================================== */

function normalizeName(name) {

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* ==================================================
   GET SERIES NAME
================================================== */

/*
   Examples:

   Bhay S01EP01
       ↓
   Bhay

   Bhay Test S01EP02
       ↓
   Bhay

   Bhay S02EP01
       ↓
   Bhay

   Everything before S01EP01 / S02E05 etc.
   is treated as the series name.

   "Test" is removed specifically because your
   current episode is named:

   Bhay Test S01EP02

   but you want it to belong to Bhay.
*/

function getSeriesName(
    filename
) {


    let name =
        cleanName(
            filename
        );


    /*
       Find S01E01,
       S01EP01,
       S02E05,
       etc.
    */

    const match =
        name.match(
            /\bS\d{1,2}\s*E(?:P)?\s*\d{1,3}\b/i
        );


    if (match) {

        name =
            name.substring(
                0,
                match.index
            ).trim();

    }


    /*
       Remove the word "Test"
       from the end.

       This makes:

       Bhay Test

       become:

       Bhay
    */

    name =
        name.replace(
            /\s+test$/i,
            ""
        ).trim();


    return name;

}



/* ==================================================
   GET SEASON / EPISODE NUMBER
================================================== */

function getEpisodeInfo(
    filename
) {


    const name =
        cleanName(
            filename
        );


    const match =
        name.match(
            /\bS(\d{1,2})\s*E(?:P)?\s*(\d{1,3})\b/i
        );


    if (!match) {

        return {

            season: 1,

            episode: 1

        };

    }


    return {

        season:
            parseInt(
                match[1],
                10
            ),

        episode:
            parseInt(
                match[2],
                10
            )

    };

}



/* ==================================================
   BUILD POSTER MAP
================================================== */

function buildPosterMap(
    posterFiles
) {

    posters = {};


    posterFiles.forEach(
        function(file) {

            if (
                !file.mimeType ||
                !file.mimeType.startsWith(
                    "image/"
                )
            ) {

                return;

            }


            const key =
                normalizeName(
                    file.name
                );


            posters[key] =
                file;

        }
    );

}



/* ==================================================
   GET POSTER URL
================================================== */

function getPosterURL(
    posterFile
) {

    if (!posterFile) {

        return null;

    }


    return (
        "https://drive.google.com/thumbnail"
        +
        "?id="
        +
        encodeURIComponent(
            posterFile.id
        )
        +
        "&sz=w1000"
    );

}



/* ==================================================
   FIND MOVIE POSTER
================================================== */

function findPoster(
    movieFile
) {

    const movieName =
        normalizeName(
            movieFile.name
        );


    if (
        posters[movieName]
    ) {

        return posters[movieName];

    }


    const simplified =
        movieName

            .replace(
                /\b(1080p|720p|2160p|4k|web[- ]?dl|webrip|bluray|x264|x265|hevc|h264|h265)\b/g,
                ""
            )

            .replace(
                /\s+/g,
                " "
            )

            .trim();


    if (
        posters[simplified]
    ) {

        return posters[simplified];

    }


    return null;

}



/* ==================================================
   FIND SERIES POSTER
================================================== */

function findSeriesPoster(
    seriesName
) {


    const key =
        normalizeName(
            seriesName
        );


    /*
       Exact match:

       Bhay
       Bhay.jpg
    */

    if (
        posters[key]
    ) {

        return posters[key];

    }


    /*
       Try all posters and compare their
       cleaned names.
    */

    for (
        const posterKey in posters
    ) {

        if (
            posterKey === key
        ) {

            return posters[
                posterKey
            ];

        }

    }


    return null;

}



/* ==================================================
   CREATE VIDEO URL
================================================== */

function getVideoURL(
    file
) {

    return (
        "https://www.googleapis.com/drive/v3/files/"
        +
        file.id
        +
        "?alt=media&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        )
    );

}

                );

/* ==================================================
   CREATE SERIES CARD
================================================== */

function createSeriesCard(

) {

        "card";



    /* =========================
       POSTER
    ========================== */

    const poster =

            );

        img.onerror =

                poster.textContent =
                    "📺";

            };


        poster.appendChild(
            img
        );


    } else {

        poster.textContent =
            "📺";

    }



    /* =========================
       CARD INFORMATION
    ========================== */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "card-info";



    const title =
        document.createElement(
            "div"
        );


    title.className =
        "card-title";


    title.textContent =
        show.name;



    const typeText =
        document.createElement(
            "div"
        );

    typeText.textContent =

    );


    info.appendChild(

    );

    );

    ========================== */

    card.onclick =

               For now we only send the series
               name to player.html.

               The new player.html will use this
               information to find all episodes.
            */

            const encodedSeries =
                encodeURIComponent(
                    show.name
                );


            const encodedTitle =
                encodeURIComponent(
                    show.name
                );


            window.location.href =
                "player.html"
                +
                "?type=series"
                +
                "&series="
                +
                encodedSeries
                +
                "&title="
                +
                encodedTitle;

        };


    return card;

}



/* ==================================================
   BUILD SERIES SHOWS
================================================== */

function buildSeriesShows(
    files
) {


    const groups = {};


    files.forEach(
        function(file) {


            /*
               Ignore folders.
            */

            if (
                file.mimeType ===
                "application/vnd.google-apps.folder"
            ) {

                return;

            }


            const showName =
                getSeriesName(
                    file.name
                );


            if (!showName) {

                return;

            }


            const key =
                normalizeName(
                    showName
                );


            if (
                !groups[key]
            ) {

                groups[key] = {

                    name:
                        showName,

                    episodes: []

                };

            }


            const episodeInfo =
                getEpisodeInfo(
                    file.name
                );


            groups[key].episodes.push({

                file:
                    file,

                season:
                    episodeInfo.season,

                episode:
                    episodeInfo.episode

            });

        }
    );


    /*
       Sort episodes.
    */

    Object.values(
        groups
    ).forEach(
        function(show) {

            show.episodes.sort(
                function(a, b) {

                    if (
                        a.season !==
                        b.season
                    ) {

                        return (
                            a.season -
                            b.season
                        );

                    }


                    return (
                        a.episode -
                        b.episode
                    );

                }
            );

        }
    );


    return Object.values(
        groups
    );

}



/* ==================================================
   DISPLAY FILES
================================================== */

function displayFiles() {


    moviesGrid.innerHTML =
        "";


    seriesGrid.innerHTML =
        "";



    movieCount.textContent =
        movies.length
        +
        (
            movies.length === 1
            ? " title"
            : " titles"
        );



    seriesCount.textContent =
        seriesShows.length
        +
        (
            seriesShows.length === 1
            ? " title"
            : " titles"
        );



    /* =========================
       MOVIES
    ========================== */

    if (
        movies.length === 0
    ) {

        moviesGrid.innerHTML =
            '<div class="message">' +
            'No movies yet.' +
            '</div>';

    } else {

        movies.forEach(
            function(file) {

                moviesGrid.appendChild(
                    createMovieCard(
                        file
                    )
                );

            }
        );

    }



    /* =========================
       WEB SERIES
    ========================== */

    if (
        seriesShows.length === 0
    ) {

        seriesGrid.innerHTML =
            '<div class="message">' +
            'No web series yet.' +
            '</div>';

    } else {

        seriesShows.forEach(
            function(show) {

                seriesGrid.appendChild(
                    createSeriesCard(
                        show
                    )
                );

            }
        );

    }

}



/* ==================================================
   LOAD LIBRARY
================================================== */

async function loadLibrary() {


    try {


        const results =
            await Promise.all([

                /*
                   Movies
                */

                getDriveFiles(
                    MOVIES_FOLDER
                ),


                /*
                   Web Series
                */

                getDriveFiles(
                    SERIES_FOLDER
                ),


                /*
                   Posters
                */

                getDriveFiles(
                    POSTERS_FOLDER
                )

            ]);



        /* =========================
           MOVIES
        ========================== */

        movies =
            results[0].filter(
                function(file) {

                    return (
                        file.mimeType !==
                        "application/vnd.google-apps.folder"
                    );

                }
            );



        /* =========================
           WEB SERIES EPISODES
        ========================== */

        seriesEpisodes =
            results[1].filter(
                function(file) {

                    return (
                        file.mimeType !==
                        "application/vnd.google-apps.folder"
                    );

                }
            );



        /* =========================
           POSTERS
        ========================== */

        buildPosterMap(
            results[2]
        );



        /* =========================
           BUILD SERIES LIST
        ========================== */

        seriesShows =
            buildSeriesShows(
                seriesEpisodes
            );



        /* =========================
           DISPLAY
        ========================== */

        displayFiles();


    } catch (error) {


        console.error(
            error
        );


        moviesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load movies.' +
            '</div>';


        seriesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load web series.' +
            '</div>';

    }

}

            seriesGrid.querySelectorAll(

                card,
                index

                    seriesShows[index].name
                        .toLowerCase();


                card.style.display =
                    name.includes(

    }
