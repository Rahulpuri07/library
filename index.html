<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Movie Library</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            background-color: #111111;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .hero {
            height: 450px;
            display: flex;
            align-items: center;
            padding: 50px;
            background: linear-gradient(
                to right,
                #111111 0%,
                rgba(17, 17, 17, 0.7) 50%,
                rgba(17, 17, 17, 0.2) 100%
            );
        }

        .hero-content {
            max-width: 600px;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #cccccc;
            line-height: 1.6;
        }

        .movies {
            padding: 40px;
        }

        .movies h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .movie-card {
            background-color: #181818;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .movie-card:hover {
            transform: scale(1.04);
        }

        .poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            background-color: #252525;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777777;
        }

        .movie-title {
            padding: 12px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">My Movie Library</div>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Welcome</h1>

            <p>
                Your personal movie collection.
                Browse your movies and watch them whenever you want.
            </p>
        </div>
    </section>

    <section class="movies">

        <h2>Recently Added</h2>

        <div class="movie-grid">

            <div class="movie-card">
                <div class="poster">
                    Poster
                </div>

                <div class="movie-title">
                    Movie 1
                </div>
            </div>

            <div class="movie-card">
                <div class="poster">
                    Poster
                </div>

                <div class="movie-title">
                    Movie 2
                </div>
            </div>

            <div class="movie-card">
                <div class="poster">
                    Poster
                </div>

                <div class="movie-title">
                    Movie 3
                </div>
            </div>

        </div>

    </section>

</body>

</html>
