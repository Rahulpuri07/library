<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rahul's Library</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    background:#000;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    height:72px;

    background:#050505;

    border-bottom:1px solid #222;

    display:flex;

    align-items:center;

    padding:0 40px;

    gap:35px;

    position:sticky;

    top:0;

    z-index:20;
}

.logo{
    font-size:25px;

    font-weight:800;
}

.logo span{
    color:#e50914;
}

.nav{
    display:flex;

    gap:30px;
}

.nav button{
    background:none;

    border:none;

    color:#aaa;

    font-size:15px;

    cursor:pointer;
}

.nav button:hover,
.nav button.active{
    color:#fff;
}

.search{
    margin-left:auto;
}

.search input{
    width:260px;

    padding:11px 15px;

    background:#151515;

    border:1px solid #333;

    border-radius:6px;

    color:#fff;

    outline:none;
}


/* =========================
   MAIN
========================= */

.main{
    padding:55px 55px 80px;
}

.hero h1{
    font-size:46px;

    margin:0 0 18px;
}

.hero p{
    color:#999;

    font-size:16px;

    margin-bottom:70px;
}


/* =========================
   SECTIONS
========================= */

.section{
    margin-bottom:60px;
}

.section-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.section-title{
    font-size:25px;

    font-weight:700;
}

.count{
    color:#777;

    font-size:13px;
}


/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:25px;
}


/* =========================
   CARD
========================= */

.card{
    background:#101010;

    border-radius:7px;

    overflow:hidden;

    cursor:pointer;

    transition:
        transform .2s,
        background .2s;

    border:1px solid #191919;
}

.card:hover{
    transform:scale(1.035);

    background:#181818;
}


/* =========================
   POSTER
========================= */

.poster{
    height:270px;

    background:
        linear-gradient(
            135deg,
            #181818,
            #050505
        );

    display:flex;

    align-items:center;

    justify-content:center;

    color:#666;

    font-size:42px;

    overflow:hidden;

    position:relative;
}

.poster img{
    width:100%;

    height:100%;

    object-fit:cover;

    display:block;
}


/* =========================
   CARD INFO
========================= */

.card-info{
    padding:14px;
}

.card-title{
    font-size:15px;

    font-weight:600;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-type{
    color:#777;

    font-size:12px;

    margin-top:7px;
}


/* =========================
   MESSAGES
========================= */

.message{
    color:#777;

    padding:30px 0;
}

.error{
    color:#e50914;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .header{
        padding:0 15px;

        gap:15px;
    }

    .logo{
        font-size:19px;
    }

    .nav{
        gap:10px;
    }

    .search input{
        width:130px;
    }

    .main{
        padding:35px 20px;
    }

    .hero h1{
        font-size:32px;
    }

    .grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:15px;
    }

    .poster{
        height:220px;
    }

}

</style>

</head>


<body>


<header class="header">

    <div class="logo">
        MY <span>LIBRARY</span>
    </div>


    <nav class="nav">

        <button
            id="homeBtn"
            class="active"
        >
            Home
        </button>


        <button
            id="moviesBtn"
        >
            Movies
        </button>


        <button
            id="seriesBtn"
        >
            Web Series
        </button>

    </nav>


    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="Search..."
        >

    </div>

</header>



<main class="main">


    <section class="hero">

        <h1>
            Welcome to your library.
        </h1>

        <p>
            Your private collection of movies and web series — all in one place.
        </p>

    </section>



    <!-- MOVIES -->

    <section
        class="section"
        id="moviesSection"
    >

        <div class="section-header">

            <div class="section-title">
                🎬 Movies
            </div>

            <div
                class="count"
                id="movieCount"
            >
                Loading...
            </div>

        </div>


        <div
            class="grid"
            id="moviesGrid"
        >

            <div class="message">
                Loading movies...
            </div>

        </div>

    </section>



    <!-- WEB SERIES -->

    <section
        class="section"
        id="seriesSection"
    >

        <div class="section-header">

            <div class="section-title">
                📺 Web Series
            </div>

            <div
                class="count"
                id="seriesCount"
            >
                Loading...
            </div>

        </div>


        <div
            class="grid"
            id="seriesGrid"
        >

            <div class="message">
                Loading web series...
            </div>

        </div>

    </section>


</main>



<script>


/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */


/*
   IMPORTANT:
   Paste YOUR Google API key here.

   Do NOT use anybody else's key.
*/

const GOOGLE_API_KEY =
    "AIzaSyDj5VSHNGM4z9sR8f_YyZfBZvIwSkOnlfk";


/*
   MOVIES FOLDER
*/

const MOVIES_FOLDER =
    "1yXj9Ih39Omyic_Bf_qf86rta5DYbza7S";


/*
   WEB SERIES FOLDER
*/

const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";


/*
   POSTERS FOLDER

   This is the folder you just gave me.
*/

const POSTERS_FOLDER =
    "1aX56KOU0ovn3VsDFSynovwtMlnVcmMDq";



/* ==================================================
   ELEMENTS
================================================== */

const moviesGrid =
    document.getElementById(
        "moviesGrid"
    );


const seriesGrid =
    document.getElementById(
        "seriesGrid"
    );


const movieCount =
    document.getElementById(
        "movieCount"
    );


const seriesCount =
    document.getElementById(
        "seriesCount"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const moviesSection =
    document.getElementById(
        "moviesSection"
    );


const seriesSection =
    document.getElementById(
        "seriesSection"
    );



/* ==================================================
   DATA
================================================== */

let movies = [];

let series = [];

let posters = {};



/* ==================================================
   GET FILES FROM GOOGLE DRIVE
================================================== */

async function getDriveFiles(folderId){

    const query =
        `'${folderId}' in parents and trashed = false`;


    const url =
        "https://www.googleapis.com/drive/v3/files"
        +
        "?q="
        +
        encodeURIComponent(query)
        +
        "&fields=files(id,name,mimeType,size,modifiedTime,webContentLink)"
        +
        "&pageSize=1000"
        +
        "&orderBy=name"
        +
        "&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        );


    const response =
        await fetch(url);


    if(!response.ok){

        throw new Error(
            "Google Drive API error: "
            +
            response.status
        );

    }


    const data =
        await response.json();


    return data.files || [];

}



/* ==================================================
   CLEAN FILE NAME
================================================== */

function cleanName(name){

    return name

        .replace(
            /\.[^/.]+$/,
            ""
        )

        .replace(
            /\./g,
            " "
        )

        .replace(
            /_/g,
            " "
        )

        .trim();

}



/* ==================================================
   NORMALIZE NAME

   Used for matching:

   Shaitaan.mp4
   Shaitaan.jpg

   Breaking Bad S01E01.mp4
   Breaking Bad.jpg
================================================== */

function normalizeName(name){

    return cleanName(name)

        .toLowerCase()

        .replace(
            /\s+/g,
            " "
        )

        .trim();

}



/* ==================================================
   REMOVE EPISODE INFORMATION
================================================== */

function getSeriesPosterName(name){

    const clean =
        cleanName(name);


    const match =
        clean.match(
            /^(.*?)[\s._-]*S\d{1,2}[\s._-]*E\d{1,3}\b/i
        );


    if(match){

        return match[1]
            .trim()
            .replace(
                /[\s._-]+$/,
                ""
            );

    }


    return clean;

}



/* ==================================================
   BUILD POSTER MAP
================================================== */

function buildPosterMap(files){

    posters = {};


    files.forEach(
        file => {

            if(
                file.mimeType
                &&
                file.mimeType.startsWith(
                    "image/"
                )
            ){

                const name =
                    normalizeName(
                        file.name
                    );


                posters[name] =
                    file;

            }

        }
    );

}



/* ==================================================
   GET POSTER URL
================================================== */

function getPosterURL(file){

    if(!file){

        return null;

    }


    return (
        "https://www.googleapis.com/drive/v3/files/"
        +
        file.id
        +
        "?alt=media&key="
        +
        encodeURIComponent(
            GOOGLE_API_KEY
        )
    );

}



/* ==================================================
   FIND POSTER FOR MOVIE
================================================== */

function findMoviePoster(file){

    const name =
        normalizeName(
            file.name
        );


    return posters[name] || null;

}



/* ==================================================
   FIND POSTER FOR SERIES
================================================== */

function findSeriesPoster(seriesTitle){

    const name =
        normalizeName(
            seriesTitle
        );


    return posters[name] || null;

}



/* ==================================================
   CREATE MOVIE CARD
================================================== */

function createMovieCard(file){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    const poster =
        findMoviePoster(
            file
        );


    let posterHTML =
        '<div class="poster">🎬</div>';


    if(poster){

        posterHTML =
            `
            <div class="poster">
                <img
                    src="${getPosterURL(poster)}"
                    alt=""
                >
            </div>
            `;

    }


    card.innerHTML =
        posterHTML
        +
        `
        <div class="card-info">

            <div class="card-title"></div>

            <div class="card-type">
                Movie
            </div>

        </div>
        `;


    card.querySelector(
        ".card-title"
    ).textContent =
        cleanName(
            file.name
        );



    /* =========================
       OPEN PLAYER
    ========================= */

    card.onclick =
        () => {

            const video =
                "https://www.googleapis.com/drive/v3/files/"
                +
                file.id
                +
                "?alt=media&key="
                +
                encodeURIComponent(
                    GOOGLE_API_KEY
                );


            window.location.href =
                "player.html?video="
                +
                encodeURIComponent(
                    video
                )
                +
                "&title="
                +
                encodeURIComponent(
                    cleanName(
                        file.name
                    )
                )
                +
                "&type=movie";

        };


    return card;

}



/* ==================================================
   PARSE EPISODE
================================================== */


/*
   Recognises:

   Show Name S01E01.mkv
   Show Name S1E2.mkv
   Show Name - S01E01.mkv
*/

function parseEpisode(
    name,
    index
){

    const clean =
        cleanName(
            name
        );


    const match =
        clean.match(
            /^(.*?)[\s._-]*S(\d{1,2})[\s._-]*E(\d{1,3})\b/i
        );


    if(match){

        return {

            show:
                match[1]
                    .trim()
                    .replace(
                        /[\s._-]+$/,
                        ""
                    ),

            season:
                Number(
                    match[2]
                ),

            episode:
                Number(
                    match[3]
                )

        };

    }


    return {

        show:
            clean,

        season:
            1,

        episode:
            index + 1

    };

}



/* ==================================================
   CREATE SERIES GROUPS
================================================== */

function createSeriesCards(
    files
){

    const groups = {};


    files.forEach(
        (
            file,
            index
        ) => {


            const info =
                parseEpisode(
                    file.name,
                    index
                );


            const key =
                info.show
                    .toLowerCase()
                ||
                "web series";


            if(
                !groups[key]
            ){

                groups[key] = {

                    title:
                        info.show
                        ||
                        cleanName(
                            file.name
                        ),

                    episodes:
                        [],

                    poster:
                        findSeriesPoster(
                            info.show
                        )

                };

            }



            const video =
                "https://www.googleapis.com/drive/v3/files/"
                +
                file.id
                +
                "?alt=media&key="
                +
                encodeURIComponent(
                    GOOGLE_API_KEY
                );



            groups[key]
                .episodes
                .push({

                    id:
                        file.id,

                    name:
                        cleanName(
                            file.name
                        ),

                    video:
                        video,

                    season:
                        info.season,

                    episode:
                        info.episode

                });

        }
    );


    return Object.values(
        groups
    );

}



/* ==================================================
   CREATE SERIES CARD
================================================== */

function createSeriesCard(
    seriesData
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card";


    let posterHTML =
        '<div class="poster">📺</div>';


    if(
        seriesData.poster
    ){

        posterHTML =
            `
            <div class="poster">
                <img
                    src="${getPosterURL(seriesData.poster)}"
                    alt=""
                >
            </div>
            `;

    }


    card.innerHTML =
        posterHTML
        +
        `
        <div class="card-info">

            <div class="card-title"></div>

            <div class="card-type"></div>

        </div>
        `;


    card.querySelector(
        ".card-title"
    ).textContent =
        seriesData.title;


    card.querySelector(
        ".card-type"
    ).textContent =
        seriesData.episodes.length
        +
        " episode"
        +
        (
            seriesData.episodes.length === 1
            ?
            ""
            :
            "s"
        );



    /* =========================
       OPEN SERIES PLAYER
    ========================= */

    card.onclick =
        () => {

            const episodes =
                encodeURIComponent(
                    JSON.stringify(
                        seriesData.episodes
                    )
                );


            window.location.href =
                "player.html?type=series"
                +
                "&series="
                +
                encodeURIComponent(
                    seriesData.title
                )
                +
                "&episodes="
                +
                episodes;

        };


    return card;

}



/* ==================================================
   DISPLAY FILES
================================================== */

function displayFiles(){

    moviesGrid.innerHTML =
        "";

    seriesGrid.innerHTML =
        "";



    /* =========================
       MOVIE COUNT
    ========================= */

    movieCount.textContent =
        movies.length
        +
        (
            movies.length === 1
            ?
            " title"
            :
            " titles"
        );



    /* =========================
       SERIES
    ========================= */

    const seriesGroups =
        createSeriesCards(
            series
        );


    seriesCount.textContent =
        seriesGroups.length
        +
        (
            seriesGroups.length === 1
            ?
            " title"
            :
            " titles"
        );



    /* =========================
       MOVIES
    ========================= */

    if(
        !movies.length
    ){

        moviesGrid.innerHTML =
            `
            <div class="message">
                No movies yet.
            </div>
            `;

    }else{

        movies.forEach(
            file => {

                moviesGrid.appendChild(
                    createMovieCard(
                        file
                    )
                );

            }
        );

    }



    /* =========================
       SERIES
    ========================= */

    if(
        !seriesGroups.length
    ){

        seriesGrid.innerHTML =
            `
            <div class="message">
                No web series yet.
            </div>
            `;

    }else{

        seriesGroups.forEach(
            group => {

                seriesGrid.appendChild(
                    createSeriesCard(
                        group
                    )
                );

            }
        );

    }

}



/* ==================================================
   LOAD LIBRARY
================================================== */

async function loadLibrary(){

    try{


        /*
           Load:

           1. Movies
           2. Web Series
           3. Posters

           all together.
        */

        const results =
            await Promise.all([

                getDriveFiles(
                    MOVIES_FOLDER
                ),

                getDriveFiles(
                    SERIES_FOLDER
                ),

                getDriveFiles(
                    POSTERS_FOLDER
                )

            ]);



        /* =========================
           MOVIES
        ========================= */

        movies =
            results[0]
                .filter(
                    file =>
                        file.mimeType
                        !==
                        "application/vnd.google-apps.folder"
                );



        /* =========================
           SERIES
        ========================= */

        series =
            results[1]
                .filter(
                    file =>
                        file.mimeType
                        !==
                        "application/vnd.google-apps.folder"
                );



        /* =========================
           POSTERS
        ========================= */

        buildPosterMap(
            results[2]
        );



        /* =========================
           DISPLAY
        ========================= */

        displayFiles();


    }catch(error){

        console.error(
            error
        );


        moviesGrid.innerHTML =
            `
            <div class="message error">
                Unable to load movies.
            </div>
            `;


        seriesGrid.innerHTML =
            `
            <div class="message error">
                Unable to load web series.
            </div>
            `;

    }

}



/* ==================================================
   SEARCH
================================================== */

searchInput.addEventListener(
    "input",
    () => {

        const search =
            searchInput
                .value
                .toLowerCase()
                .trim();



        /* =========================
           MOVIES
        ========================= */

        moviesGrid
            .querySelectorAll(
                ".card"
            )
            .forEach(
                (
                    card,
                    index
                ) => {

                    const name =
                        cleanName(
                            movies[index]
                                .name
                        )
                        .toLowerCase();


                    card.style.display =
                        name.includes(
                            search
                        )
                        ?
                        ""
                        :
                        "none";

                }
            );



        /* =========================
           SERIES
        ========================= */

        const groups =
            createSeriesCards(
                series
            );


        seriesGrid
            .querySelectorAll(
                ".card"
            )
            .forEach(
                (
                    card,
                    index
                ) => {

                    const name =
                        (
                            groups[index]
                                ?.title
                            ||
                            ""
                        )
                        .toLowerCase();


                    card.style.display =
                        name.includes(
                            search
                        )
                        ?
                        ""
                        :
                        "none";

                }
            );

    }
);



/* ==================================================
   NAVIGATION
================================================== */

document
    .getElementById(
        "homeBtn"
    )
    .onclick =
        () => {

            window.scrollTo({

                top:0,

                behavior:
                    "smooth"

            });

        };



document
    .getElementById(
        "moviesBtn"
    )
    .onclick =
        () => {

            moviesSection.scrollIntoView({

                behavior:
                    "smooth"

            });

        };



document
    .getElementById(
        "seriesBtn"
    )
    .onclick =
        () => {

            seriesSection.scrollIntoView({

                behavior:
                    "smooth"

            });

        };



/* ==================================================
   START
================================================== */

loadLibrary();


</script>


</body>

</html>
