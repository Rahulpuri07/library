<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rahul's Library</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

/* HEADER */
.header {
    height: 72px;
    background: #050505;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    padding: 0 40px;
    gap: 35px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #e50914;
}

.nav {
    display: flex;
    gap: 30px;
}

.nav button {
    background: none;
    border: none;
    color: #aaa;
    font-size: 15px;
    cursor: pointer;
}

.nav button:hover,
.nav button.active {
    color: white;
}

.search {
    margin-left: auto;
}

.search input {
    width: 260px;
    padding: 11px 15px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 6px;
    color: white;
    outline: none;
}

/* MAIN */
.main {
    padding: 55px 55px 80px;
}

.hero h1 {
    font-size: 46px;
    margin: 0 0 18px;
}

.hero p {
    color: #999;
    font-size: 16px;
    margin-bottom: 70px;
}

/* SECTIONS */
.section {
    margin-bottom: 60px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.section-title {
    font-size: 25px;
    font-weight: 700;
}

.count {
    color: #777;
    font-size: 13px;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 25px;
}

.card {
    background: #101010;
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .2s, background .2s;
    border: 1px solid #191919;
}

.card:hover {
    transform: scale(1.035);
    background: #181818;
}

.poster {
    height: 270px;
    background: linear-gradient(135deg, #181818, #050505);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 42px;
}

.card-info {
    padding: 14px;
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-type {
    color: #777;
    font-size: 12px;
    margin-top: 7px;
}

/* EMPTY / LOADING */
.message {
    color: #777;
    padding: 30px 0;
}

.error {
    color: #e50914;
}

/* MOBILE */
@media (max-width: 700px) {

    .header {
        padding: 0 15px;
        gap: 15px;
    }

    .logo {
        font-size: 19px;
    }

    .nav {
        gap: 10px;
    }

    .search input {
        width: 130px;
    }

    .main {
        padding: 35px 20px;
    }

    .hero h1 {
        font-size: 32px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .poster {
        height: 220px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        MY <span>LIBRARY</span>
    </div>

    <nav class="nav">
        <button id="homeBtn" class="active">Home</button>
        <button id="moviesBtn">Movies</button>
        <button id="seriesBtn">Web Series</button>
    </nav>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search..."
        >
    </div>

</header>


<main class="main">

    <section class="hero">
        <h1>Welcome to your library.</h1>
        <p>
            Your private collection of movies and web series — all in one place.
        </p>
    </section>


    <!-- MOVIES -->

    <section class="section" id="moviesSection">

        <div class="section-header">
            <div class="section-title">🎬 Movies</div>
            <div class="count" id="movieCount">Loading...</div>
        </div>

        <div class="grid" id="moviesGrid">
            <div class="message">Loading movies...</div>
        </div>

    </section>


    <!-- WEB SERIES -->

    <section class="section" id="seriesSection">

        <div class="section-header">
            <div class="section-title">📺 Web Series</div>
            <div class="count" id="seriesCount">Loading...</div>
        </div>

        <div class="grid" id="seriesGrid">
            <div class="message">Loading web series...</div>
        </div>

    </section>

</main>


<script>

/* ==================================================
   GOOGLE DRIVE SETTINGS
================================================== */

const GOOGLE_API_KEY = "AIzaSyDj5VSHNGM4z9sR8f_YyZfBZvIwSkOnlfk";


const MOVIES_FOLDER =
    "1yXj9Ih39Omyic_Bf_qf86rta5DYbza7S";


const SERIES_FOLDER =
    "1ltCVLmorFbWGEt8kx547kDjwSBxJxAGf";


/* ==================================================
   ELEMENTS
================================================== */

const moviesGrid =
    document.getElementById("moviesGrid");

const seriesGrid =
    document.getElementById("seriesGrid");

const movieCount =
    document.getElementById("movieCount");

const seriesCount =
    document.getElementById("seriesCount");

const searchInput =
    document.getElementById("searchInput");

const moviesSection =
    document.getElementById("moviesSection");

const seriesSection =
    document.getElementById("seriesSection");


let movies = [];
let series = [];


/* ==================================================
   GET FILES FROM GOOGLE DRIVE
================================================== */

async function getDriveFiles(folderId) {

    const query =
        `'${folderId}' in parents and trashed = false`;

    const url =
        "https://www.googleapis.com/drive/v3/files" +
        "?q=" + encodeURIComponent(query) +
        "&fields=files(id,name,mimeType,size,modifiedTime)" +
        "&pageSize=1000" +
        "&orderBy=name" +
        "&key=" + encodeURIComponent(GOOGLE_API_KEY);

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            "Google Drive API error: " +
            response.status
        );
    }

    const data =
        await response.json();

    return data.files || [];
}


/* ==================================================
   CLEAN MOVIE NAME
================================================== */

function cleanName(name) {

    return name
        .replace(/\.[^/.]+$/, "")
        .replace(/\./g, " ")
        .replace(/_/g, " ")
        .trim();
}


/* ==================================================
   CREATE CARD
================================================== */

function createCard(file, type) {

    const card =
        document.createElement("div");

    card.className = "card";

    const poster =
        document.createElement("div");

    poster.className = "poster";
    poster.textContent =
        type === "movie" ? "🎬" : "📺";


    const info =
        document.createElement("div");

    info.className = "card-info";


    const title =
        document.createElement("div");

    title.className = "card-title";

    title.textContent =
        cleanName(file.name);


    const typeText =
        document.createElement("div");

    typeText.className = "card-type";

    typeText.textContent =
        type === "movie"
        ? "Movie"
        : "Web Series";


    info.appendChild(title);
    info.appendChild(typeText);

    card.appendChild(poster);
    card.appendChild(info);


    card.onclick = function() {

        const encodedVideo =
            encodeURIComponent(
                "https://www.googleapis.com/drive/v3/files/" +
                file.id +
                "?alt=media&key=" +
                GOOGLE_API_KEY
            );

        const encodedTitle =
            encodeURIComponent(
                cleanName(file.name)
            );


        window.location.href =
            "player.html?video=" +
            encodedVideo +
            "&title=" +
            encodedTitle;
    };


    return card;
}


/* ==================================================
   DISPLAY FILES
================================================== */

function displayFiles() {

    moviesGrid.innerHTML = "";
    seriesGrid.innerHTML = "";


    movieCount.textContent =
        movies.length +
        (movies.length === 1 ? " title" : " titles");


    seriesCount.textContent =
        series.length +
        (series.length === 1 ? " title" : " titles");


    if (movies.length === 0) {

        moviesGrid.innerHTML =
            '<div class="message">No movies yet.</div>';

    } else {

        movies.forEach(function(file) {

            moviesGrid.appendChild(
                createCard(file, "movie")
            );

        });

    }


    if (series.length === 0) {

        seriesGrid.innerHTML =
            '<div class="message">No web series yet.</div>';

    } else {

        series.forEach(function(file) {

            seriesGrid.appendChild(
                createCard(file, "series")
            );

        });

    }
}


/* ==================================================
   LOAD LIBRARY
================================================== */

async function loadLibrary() {

    try {

        const results =
            await Promise.all([

                getDriveFiles(
                    MOVIES_FOLDER
                ),

                getDriveFiles(
                    SERIES_FOLDER
                )

            ]);


        movies =
            results[0].filter(
                file =>
                    file.mimeType !==
                    "application/vnd.google-apps.folder"
            );


        series =
            results[1].filter(
                file =>
                    file.mimeType !==
                    "application/vnd.google-apps.folder"
            );


        displayFiles();


    } catch (error) {

        console.error(error);

        moviesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load movies.' +
            '</div>';

        seriesGrid.innerHTML =
            '<div class="message error">' +
            'Unable to load web series.' +
            '</div>';

    }
}


/* ==================================================
   SEARCH
================================================== */

searchInput.addEventListener(
    "input",
    function() {

        const search =
            searchInput.value
                .toLowerCase()
                .trim();


        const movieCards =
            moviesGrid.querySelectorAll(".card");

        const seriesCards =
            seriesGrid.querySelectorAll(".card");


        movieCards.forEach(
            function(card, index) {

                const name =
                    cleanName(
                        movies[index].name
                    ).toLowerCase();

                card.style.display =
                    name.includes(search)
                    ? ""
                    : "none";
            }
        );


        seriesCards.forEach(
            function(card, index) {

                const name =
                    cleanName(
                        series[index].name
                    ).toLowerCase();

                card.style.display =
                    name.includes(search)
                    ? ""
                    : "none";
            }
        );

    }
);


/* ==================================================
   NAVIGATION
================================================== */

document
    .getElementById("homeBtn")
    .onclick = function() {

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    };


document
    .getElementById("moviesBtn")
    .onclick = function() {

        moviesSection.scrollIntoView({
            behavior: "smooth"
        });

    };


document
    .getElementById("seriesBtn")
    .onclick = function() {

        seriesSection.scrollIntoView({
            behavior: "smooth"
        });

    };


/* ==================================================
   START
================================================== */

loadLibrary();

</script>

</body>
</html>
